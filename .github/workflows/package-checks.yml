name: Package checks
on:
  workflow_call:
    inputs:
      previous_revision:
        description: Explicit prior source-build target; empty when qualified artifacts are selected
        type: string
        default: ''
      retain_diagnostic:
        description: Keep this caller-owned diagnostic qualification across new runs
        type: boolean
        default: false
      portable_revision:
        description: Successful exact-source output from caller-owned portable preflight
        type: string
        default: ''
    outputs:
      qualified_revision:
        description: Exact source that passed portable, native and package-input checks
        value: ${{ jobs.macos-package.outputs.qualified_revision }}
  workflow_dispatch:
    inputs:
      previous_revision:
        description: Optional full prior source SHA for nonpublishing two-source helper build diagnosis
        type: string
        required: false
  pull_request:
  push:
    branches: [dev, main]
concurrency:
  group: package-checks-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.retain_diagnostic && github.run_id || 'latest' }}
  cancel-in-progress: ${{ !inputs.retain_diagnostic && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  changes:
    uses: ./.github/workflows/change-classification.yml
  portable:
    needs: changes
    if: needs.changes.outputs.code == 'true' && inputs.portable_revision == ''
    uses: ./.github/workflows/release-preflight.yml
  qualification:
    needs: [changes, portable]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful exact-head portable preflight
        env:
          CLASSIFICATION: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          LOCAL_RESULT: ${{ needs.portable.result }}
          LOCAL_REVISION: ${{ needs.portable.outputs.qualified_revision }}
          CALLER_REVISION: ${{ inputs.portable_revision }}
        run: |
          test "$CLASSIFICATION" = success
          case "$CODE" in true|false) ;; *) exit 1 ;; esac
          if [ "$CODE" = false ]; then
            test "$LOCAL_RESULT" = skipped
            test -z "$CALLER_REVISION"
          elif [ -n "$CALLER_REVISION" ]; then
            test "$LOCAL_RESULT" = skipped
            test "$CALLER_REVISION" = "$GITHUB_SHA"
          else
            test "$LOCAL_RESULT" = success
            test "$LOCAL_REVISION" = "$GITHUB_SHA"
          fi
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        if: inputs.previous_revision != ''
        with:
          fetch-depth: 0
      - name: Verify explicitly selected prior source before native work
        if: inputs.previous_revision != ''
        env:
          PREVIOUS_REVISION: ${{ inputs.previous_revision }}
        run: python3 scripts/release/verify-prior-source.py "$PREVIOUS_REVISION"
  native:
    needs: [changes, qualification]
    if: ${{ always() && !cancelled() && needs.changes.result == 'success' && needs.qualification.result == 'success' && needs.changes.outputs.code == 'true' }}
    uses: ./.github/workflows/release-native.yml
  host-policy:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/host-policy.yml
  native-host-package:
    needs: [changes, qualification, host-policy]
    if: ${{ always() && !cancelled() && needs.changes.result == 'success' && needs.qualification.result == 'success' && needs.host-policy.result == 'success' && needs.changes.outputs.code == 'true' }}
    name: native-host-package (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.host-policy.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Build actual native macOS ARM64 helper
        if: matrix.platform == 'macos'
        run: |
          mkdir -p "$RUNNER_TEMP/host-helper"
          bash scripts/release/build-host-helper.sh "$RUNNER_TEMP/host-helper/symphony-host" --native
          (cd "$RUNNER_TEMP/host-helper" && shasum -a 256 symphony-host > symphony-host.sha256)
      - name: Build actual static Linux x86-64 helper
        if: matrix.platform == 'linux_x86_64'
        run: bash scripts/release/build-linux-host-helper.sh "$RUNNER_TEMP/host-helper"
      - name: Native source-independent shared helper contracts
        env:
          SYMPHONY_TEST_HOST_HELPER: ${{ runner.temp }}/host-helper/symphony-host
          PLATFORM: ${{ matrix.platform }}
        run: |
          test "$("$SYMPHONY_TEST_HOST_HELPER" build-revision)" = "$GITHUB_SHA"
          test "$("$SYMPHONY_TEST_HOST_HELPER" host-platform)" = "$PLATFORM"
          python3 scripts/package/test-package.py -v
          python3 scripts/package/test-selected-image.py -v
          python3 scripts/package/test-environment.py -v
          python3 scripts/package/test-manager-protocol.py -v
      - name: Execute artifact in clean Ubuntu 26.04 without build tools
        if: matrix.platform == 'linux_x86_64'
        env:
          HELPER: ${{ runner.temp }}/host-helper/symphony-host
        run: |
          set -euo pipefail
          docker run --rm -v "$HELPER:/symphony-host:ro" -e EXPECTED_REVISION="$GITHUB_SHA" ubuntu:26.04 bash -euc '
            uname -sm
            cat /etc/os-release
            for tool in swift swiftc python3 node git mise elixir erl; do
              if command -v "$tool" >/dev/null 2>&1; then
                printf "unexpected helper runtime dependency present: %s\n" "$tool" >&2
                exit 1
              fi
            done
            test "$(/symphony-host build-revision)" = "$EXPECTED_REVISION"
            test "$(/symphony-host hash-blob hello)" = b6fc4c620b67d95f953a5c1c1230aaab5db5a1b0
            mkdir -m700 /contract
            /symphony-host owned-directory /contract
            exec 8>>/contract/lock
            /symphony-host lock /contract/lock 8 acquire
            /symphony-host lock /contract/lock 8 inherited
          ' | tee "$RUNNER_TEMP/host-helper/ubuntu26.log"
      - name: Prepare the real selected prior source
        if: inputs.previous_revision != ''
        env:
          PREVIOUS_REVISION: ${{ inputs.previous_revision }}
        run: bash scripts/release/prepare-candidate-source.sh "$PREVIOUS_REVISION" "$RUNNER_TEMP/prior-helper-source"
      - name: Build prior helper early on its actual supported native host
        if: inputs.previous_revision != ''
        env:
          PREVIOUS_REVISION: ${{ inputs.previous_revision }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p "$RUNNER_TEMP/prior-helper"
          source="$RUNNER_TEMP/prior-helper-source"
          helper="$RUNNER_TEMP/prior-helper/symphony-host"
          if [ "$PLATFORM" = macos ]; then
            bash "$source/scripts/release/build-host-helper.sh" "$helper" --native
            (cd "$RUNNER_TEMP/prior-helper" && shasum -a 256 symphony-host > symphony-host.sha256)
            test "$(lipo -archs "$helper")" = arm64
          else
            bash scripts/release/build-linux-host-helper.sh "$RUNNER_TEMP/prior-helper" "$source" "$PREVIOUS_REVISION"
          fi
          test "$("$helper" build-revision)" = "$PREVIOUS_REVISION"
          test "$("$helper" host-platform)" = "$PLATFORM"
          test "$("$helper" hash-blob hello)" = b6fc4c620b67d95f953a5c1c1230aaab5db5a1b0
          if [ "$PLATFORM" = linux_x86_64 ]; then
            SYMPHONY_TEST_HOST_HELPER="$helper" python3 "$source/scripts/package/test-package.py" -v
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: inputs.previous_revision != ''
        with:
          name: prior-native-host-helper-${{ matrix.platform }}-${{ inputs.previous_revision }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/prior-helper/*
          if-no-files-found: error
          retention-days: 30
      - name: Retain actual exact-source platform helper and qualification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-host-helper-${{ matrix.platform }}-${{ github.sha }}
          path: ${{ runner.temp }}/host-helper/*
          if-no-files-found: error
          retention-days: 30

  macos-package:
    needs: [changes, qualification, native, native-host-package]
    if: ${{ always() }}
    outputs:
      qualified_revision: ${{ steps.qualified.outputs.revision }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require a complete classification decision
        env:
          RESULT: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          test "$RESULT" = success
          case "$CODE" in true|false) ;; *) exit 1 ;; esac
      - name: Require every requested native and package-input qualification
        env:
          CODE: ${{ needs.changes.outputs.code }}
          PORTABLE: ${{ needs.qualification.result }}
          NATIVE: ${{ needs.native.result }}
          PACKAGE: ${{ needs.native-host-package.result }}
        run: |
          test "$PORTABLE" = success
          if [ "$CODE" = false ]; then
            test "$NATIVE" = skipped
            test "$PACKAGE" = skipped
            echo 'Documentation-only event; behavioral checks intentionally omitted, not executed.' >> "$GITHUB_STEP_SUMMARY"
          else
            test "$NATIVE" = success
            test "$PACKAGE" = success
          fi
      - id: qualified
        if: needs.changes.outputs.code == 'true'
        name: Bind successful qualification to the exact source
        run: echo "revision=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  listener-and-cleanup:
    needs: [changes, qualification, native, native-host-package, macos-package]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require complete ordinary manager and process fixture evidence
        env:
          RESULT: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          PORTABLE: ${{ needs.qualification.result }}
          NATIVE: ${{ needs.native.result }}
          PACKAGE: ${{ needs.native-host-package.result }}
          AGGREGATE: ${{ needs.macos-package.result }}
          QUALIFIED_REVISION: ${{ needs.macos-package.outputs.qualified_revision }}
        run: |
          test "$RESULT" = success
          test "$PORTABLE" = success
          test "$AGGREGATE" = success
          case "$CODE" in
            false)
              test "$NATIVE" = skipped
              test "$PACKAGE" = skipped
              test -z "$QUALIFIED_REVISION"
              echo "Documentation-only event; manager and process fixtures intentionally omitted, not executed." >> "$GITHUB_STEP_SUMMARY" ;;
            true)
              test "$NATIVE" = success
              test "$PACKAGE" = success
              test "$QUALIFIED_REVISION" = "$GITHUB_SHA"
              echo "Current-source portable checks, both native helpers, package/updater/selection fixtures and native listener/process cleanup fixtures passed. This is fixture proof; selected-environment image qualification and installed composition are separate explicit integration." >> "$GITHUB_STEP_SUMMARY" ;;
            *) exit 1 ;;
          esac
