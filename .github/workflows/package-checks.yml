name: Package checks
on:
  workflow_call:
    outputs:
      qualified_revision:
        description: Exact source that passed portable, native and package-input checks
        value: ${{ jobs.macos-package.outputs.qualified_revision }}
  pull_request:
  push:
    branches: [dev]
concurrency:
  group: package-checks-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ (inputs.retain_diagnostic || inputs.controller_only) && github.run_id || 'latest' }}
  cancel-in-progress: ${{ !inputs.retain_diagnostic && !inputs.controller_only && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  preflight:
    uses: ./.github/workflows/release-preflight.yml
  macos-package:
    needs: preflight
    if: ${{ always() }}
    outputs:
      qualified_revision: ${{ steps.qualified.outputs.revision }}
    runs-on: macos-14
    steps:
      - name: Require successful portable and native preflight
        env:
          RESULT: ${{ needs.preflight.result }}
        run: test "$RESULT" = success
      - uses: actions/checkout@v4
      - name: Build both supported host architectures
        run: bash scripts/release/build-host-helper.sh /tmp/symphony-host
      - name: Source-independent installation and host-helper regressions
        env:
          SYMPHONY_TEST_HOST_HELPER: /tmp/symphony-host
        run: python3 scripts/package/test-package.py -v
      - id: qualified
        name: Bind successful qualification to the exact source
        run: echo "revision=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
