name: Package checks
on:
  pull_request:
  push:
    branches: [dev]
jobs:
  macos-package:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build both supported host architectures
        run: bash scripts/release/build-host-helper.sh /tmp/symphony-host
      - name: Source-independent installation and host-helper regressions
        env:
          SYMPHONY_TEST_HOST_HELPER: /tmp/symphony-host
        run: python3 scripts/package/test-package.py -v
      - name: Release selection and interrupted packaged update regressions
        run: python3 -m unittest discover -s scripts/release/tests -v
