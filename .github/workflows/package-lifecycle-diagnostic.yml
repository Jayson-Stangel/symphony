name: package-lifecycle-diagnostic

# Reuse real checksummed artifacts to diagnose the controller, never publish or
# replace final acceptance's same-head build and lifecycle in runner-release.
on:
  workflow_dispatch:
    inputs:
      artifact_run:
        description: Completed runner-release run ID containing real two-revision artifacts
        type: string
        required: true
      package_source_revision:
        description: Exact current package source SHA from the selected artifact run
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  lifecycle-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Validate explicit diagnostic identities
        env:
          ARTIFACT_RUN: ${{ inputs.artifact_run }}
          PACKAGE_SOURCE_REVISION: ${{ inputs.package_source_revision }}
        run: |
          [[ "$ARTIFACT_RUN" =~ ^[0-9]+$ ]]
          [[ "$PACKAGE_SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          echo 'DIAGNOSTIC ONLY: reused packages do not qualify this controller head for acceptance.'
      - uses: actions/download-artifact@v4
        with:
          name: packaged-candidate
          path: packages
          run-id: ${{ inputs.artifact_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: runner-candidate-*-x86_64
          path: runners
          merge-multiple: true
          run-id: ${{ inputs.artifact_run }}
          github-token: ${{ github.token }}
      - name: Diagnose actual Ubuntu lifecycle using selected real artifacts
        env:
          PACKAGE_SOURCE_REVISION: ${{ inputs.package_source_revision }}
          DIAGNOSTIC_ARTIFACT_RUN: ${{ inputs.artifact_run }}
        run: python3 scripts/release/package-lifecycle.py packages runners evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-only-ubuntu26-${{ github.sha }}-${{ inputs.artifact_run }}
          path: evidence/**
          if-no-files-found: error
          retention-days: 30
