name: change-classification
on:
  workflow_call:
    outputs:
      code:
        description: Whether behavioral qualification is required
        value: ${{ jobs.classify.outputs.code }}
      browser:
        description: Whether browser-consumed inputs or its validation path require qualification
        value: ${{ jobs.classify.outputs.browser }}
permissions:
  contents: read
jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.changes.outputs.code }}
      browser: ${{ steps.changes.outputs.browser }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changes
        name: Classify the complete event diff
        run: python3 scripts/ci/classify_changes.py
