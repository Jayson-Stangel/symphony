name: change-classification
on:
  workflow_call:
    outputs:
      code:
        description: Whether behavioral qualification is required
        value: ${{ jobs.classify.outputs.code }}
      browser:
        description: Whether actual browser inputs or validation controls require shared qualification
        value: ${{ jobs.classify.outputs.browser }}
permissions:
  contents: read
jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.changes.outputs.code }}
      browser: ${{ steps.changes.outputs.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changes
        name: Classify the complete event diff
        run: python3 scripts/ci/classify_changes.py
