name: Runner integration
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      sign_macos:
        description: Only sign/notarize an explicitly approved already-qualified exact dev candidate
        type: boolean
        default: false
      approved_revision:
        description: Exact dev SHA approved for Apple credential use/upload (signing mode only)
        type: string
        default: ''
      qualified_run:
        description: Successful exact-source manual Runner integration run (signing mode only)
        type: string
        default: ''
      distribution_alias:
        description: Isolated same-content distribution alias proof using original OCI digests
        type: boolean
        default: false
      reference_node_smoke:
        description: Also build and qualify the two current-source Node reference harnesses
        type: boolean
        default: false
      baseline_run:
        description: Optional explicit authorized original-record run for pre-merge diagnostics
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'latest' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') }}
jobs:
  sign-macos:
    name: Sign approved macOS candidate
    if: github.event_name == 'workflow_dispatch' && inputs.sign_macos && github.ref == 'refs/heads/dev' && inputs.approved_revision == github.sha
    uses: ./.github/workflows/macos-signing.yml
    with:
      approved_revision: ${{ inputs.approved_revision }}
      qualified_run: ${{ inputs.qualified_run }}
    # Explicit names are required even when values live only in the callee environment.
    secrets:
      MACOS_SIGNING_P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
      MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
      MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
      MACOS_NOTARY_APP_PASSWORD: ${{ secrets.MACOS_NOTARY_APP_PASSWORD }}
  changes:
    name: Classify changes
    if: ${{ !inputs.sign_macos }}
    uses: ./.github/workflows/change-classification.yml
  chromium:
    name: Browser qualification
    needs: changes
    if: ${{ !inputs.sign_macos && (always()) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require a complete classification decision
        env:
          RESULT: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          BROWSER: ${{ needs.changes.outputs.browser }}
          READY: ${{ needs.changes.outputs.ready }}
        run: |
          test "$RESULT" = success
          case "$READY" in true|false) ;; *) exit 1 ;; esac
          case "$CODE" in
            false) test "$BROWSER" = false ;;
            true) case "$BROWSER" in true|false) ;; *) exit 1 ;; esac ;;
            *) exit 1 ;;
          esac
          if [ "$BROWSER" = true ] && [ "$READY" = false ]; then
            echo 'Draft PR: affected browser qualification deferred; this required context remains non-passing until ready qualification succeeds.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Check out source
        if: github.event_name != 'workflow_dispatch' && needs.changes.outputs.code == 'true' && needs.changes.outputs.browser == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Share build layers across final provider images
        if: github.event_name != 'workflow_dispatch' && needs.changes.outputs.code == 'true' && needs.changes.outputs.browser == 'true'
        id: builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build final Codex image
        if: github.event_name != 'workflow_dispatch' && needs.changes.outputs.code == 'true' && needs.changes.outputs.browser == 'true'
        uses: ./.github/actions/build-runner
        with:
          builder: ${{ steps.builder.outputs.name }}
          target: codex
          tags: symphony-browser-codex
          revision: ${{ github.sha }}
      - name: Build final Claude image
        if: github.event_name != 'workflow_dispatch' && needs.changes.outputs.code == 'true' && needs.changes.outputs.browser == 'true'
        uses: ./.github/actions/build-runner
        with:
          builder: ${{ steps.builder.outputs.name }}
          target: claude
          tags: symphony-browser-claude
          revision: ${{ github.sha }}
      - name: Verify both final images as their actual agent users
        if: github.event_name != 'workflow_dispatch' && needs.changes.outputs.code == 'true' && needs.changes.outputs.browser == 'true'
        env:
          REVISION: ${{ github.sha }}
        run: |
          bash runner/node-smoke.sh symphony-browser-codex symphony-browser-claude
          bash runner/browser/smoke-image.sh symphony-browser-codex codex "$REVISION"
          bash runner/browser/smoke-image.sh symphony-browser-claude claude "$REVISION"
      - name: Browser inputs unchanged
        if: needs.changes.outputs.code == 'true' && needs.changes.outputs.browser == 'false'
        run: echo "The complete event diff changes no browser-consumed or browser-validation inputs. Browser work intentionally omitted; no new image qualification or provenance reuse is claimed." >> "$GITHUB_STEP_SUMMARY"
      - name: Documentation-only qualification decision
        if: needs.changes.outputs.code == 'false'
        run: echo "Documentation-only event; behavioral checks intentionally omitted, not executed." >> "$GITHUB_STEP_SUMMARY"
      - name: Use actual selected images during explicit integration
        if: github.event_name == 'workflow_dispatch'
        run: echo "Browser qualification of selected immutable images runs in installed manager integration; no separate reference image build." >> "$GITHUB_STEP_SUMMARY"
  portable:
    name: Portable preflight
    needs: changes
    if: ${{ !inputs.sign_macos && (github.event_name == 'workflow_dispatch' && needs.changes.outputs.code == 'true') }}
    uses: ./.github/workflows/release-preflight.yml
  helpers:
    name: Qualify manager helpers
    if: ${{ !inputs.sign_macos && (github.event_name == 'workflow_dispatch') }}
    needs: portable
    uses: ./.github/workflows/native-manager-helpers.yml
    with:
      portable_revision: ${{ needs.portable.outputs.qualified_revision }}
  reference-node-smoke:
    name: Reference Node images
    needs: [changes, portable]
    if: ${{ !inputs.sign_macos && (github.event_name == 'workflow_dispatch' && always() && !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.code == 'true' && needs.portable.result == 'success' && inputs.reference_node_smoke) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build live E2E and Claude qualification images in their harness contexts
        run: |
          docker build -t symphony-live-node-smoke elixir/test/support/live_e2e_docker
          docker build -f runner/claude/qualification/Dockerfile -t symphony-qualification-node-smoke runner/claude
      - name: Verify reference image Node/npm and native CLI startup
        run: |
          bash runner/node-smoke.sh symphony-live-node-smoke symphony-qualification-node-smoke
          docker run --rm --network none --entrypoint codex symphony-live-node-smoke --version
          docker run --rm --network none symphony-qualification-node-smoke inspect
  plan:
    name: Plan components
    needs: [changes, portable]
    if: ${{ !inputs.sign_macos && (github.event_name == 'workflow_dispatch' && needs.changes.outputs.code == 'true') }}
    uses: ./.github/workflows/component-plan.yml
    with:
      baseline_run: ${{ inputs.baseline_run }}
  runners:
    name: Qualify runner components
    needs: [plan, portable]
    if: ${{ !inputs.sign_macos && (github.event_name == 'workflow_dispatch' && needs.plan.outputs.has_builds == 'true') }}
    uses: ./.github/workflows/runner-release.yml
    with:
      preflight_revision: ${{ needs.portable.outputs.qualified_revision }}
      manifest_schema: '2'
      component_plan_artifact: ${{ needs.plan.outputs.artifact_name }}
      baseline_run: ${{ inputs.baseline_run }}
      compose_packages: false
      retain_diagnostic: true
      publish: false
    permissions:
      contents: read
      actions: read
      packages: write
  manager-inputs:
    name: Bind selected component inputs
    needs: [changes, plan, runners]
    if: ${{ !inputs.sign_macos && (github.event_name == 'workflow_dispatch' && always() && needs.changes.outputs.code == 'true' && needs.plan.result == 'success' && (needs.runners.result == 'success' || needs.runners.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require the complete selected component result
        env:
          HAS_BUILDS: ${{ needs.plan.outputs.has_builds }}
          RUNNERS: ${{ needs.runners.result }}
        run: |
          case "$HAS_BUILDS" in
            true) test "$RUNNERS" = success ;;
            false) test "$RUNNERS" = skipped ;;
            *) exit 1 ;;
          esac
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Retrieve artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.plan.outputs.artifact_name }}
          path: plan
      - name: Retrieve artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: github.event_name == 'workflow_dispatch' && needs.plan.outputs.has_builds == 'true'
        with:
          name: runner-candidate-metadata
          path: built
      - name: Bind current manager to actual selected original components
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_BUILDS: ${{ needs.plan.outputs.has_builds }}
          BASELINE_RUN: ${{ inputs.baseline_run }}
          DISTRIBUTION_ALIAS: ${{ inputs.distribution_alias }}
        run: |
          args=()
          if [ "$DISTRIBUTION_ALIAS" = true ]; then
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            args+=(--distribution-alias)
          fi
          if [ -n "$BASELINE_RUN" ]; then args+=(--baseline-run "$BASELINE_RUN"); fi
          if [ "$HAS_BUILDS" = true ]; then args+=(--built-metadata built/release.json); fi
          python3 scripts/release/prepare-manager-inputs.py --plan plan/component-plan.json --output manager-inputs "${args[@]}"
      - name: Retain artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: current-manager-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: manager-inputs/*
          if-no-files-found: error
  manager-package:
    name: Build current manager packages
    if: ${{ !inputs.sign_macos && (github.event_name == 'workflow_dispatch' && always() && !cancelled() && needs.manager-inputs.result == 'success' && needs.helpers.result == 'success') }}
    needs: [manager-inputs, helpers]
    uses: ./.github/workflows/current-manager-package.yml
    with:
      metadata_artifact: current-manager-inputs-${{ github.run_id }}-${{ github.run_attempt }}
      helper_revision: ${{ needs.helpers.outputs.qualified_revision }}
  listener-and-cleanup:
    name: Installed manager integration
    needs: [changes, portable, helpers, reference-node-smoke, plan, runners, manager-inputs, manager-package]
    if: ${{ !inputs.sign_macos && (always() && github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require complete current-manager and component decisions
        env:
          RESULT: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          PORTABLE: ${{ needs.portable.result }}
          HELPERS: ${{ needs.helpers.result }}
          REFERENCE_NODE_REQUEST: ${{ inputs.reference_node_smoke }}
          REFERENCE_NODE: ${{ needs.reference-node-smoke.result }}
          PLAN: ${{ needs.plan.result }}
          HAS_BUILDS: ${{ needs.plan.outputs.has_builds }}
          RUNNERS: ${{ needs.runners.result }}
          INPUTS: ${{ needs.manager-inputs.result }}
          PACKAGE: ${{ needs.manager-package.result }}
        run: |
          test "$RESULT" = success
          case "$CODE" in
            false) test "$REFERENCE_NODE" = skipped; test "$PORTABLE" = skipped; test "$HELPERS" = skipped; test "$PLAN" = skipped; test "$RUNNERS" = skipped; test "$INPUTS" = skipped; test "$PACKAGE" = skipped ;;
            true)
              test "$PORTABLE" = success
              test "$HELPERS" = success
              case "$REFERENCE_NODE_REQUEST" in
                true) test "$REFERENCE_NODE" = success ;;
                false) test "$REFERENCE_NODE" = skipped ;;
                *) exit 1 ;;
              esac
              test "$PLAN" = success
              test "$INPUTS" = success
              test "$PACKAGE" = success
              case "$HAS_BUILDS" in true) test "$RUNNERS" = success ;; false) test "$RUNNERS" = skipped ;; *) exit 1 ;; esac ;;
            *) exit 1 ;;
          esac
      - name: Check out actual current manager
        if: github.event_name == 'workflow_dispatch' && needs.changes.outputs.code == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Retrieve artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: github.event_name == 'workflow_dispatch' && needs.changes.outputs.code == 'true'
        with:
          name: ${{ needs.plan.outputs.artifact_name }}
          path: plan
      - name: Retrieve artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: github.event_name == 'workflow_dispatch' && needs.changes.outputs.code == 'true'
        with:
          name: current-manager-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: bound
      - name: Retrieve artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: github.event_name == 'workflow_dispatch' && needs.changes.outputs.code == 'true'
        with:
          name: ${{ needs.manager-package.outputs.package_artifact }}
          path: packages
      - name: Retrieve actual original runners without rebuild, export or upload
        if: github.event_name == 'workflow_dispatch' && needs.changes.outputs.code == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_RUN: ${{ inputs.baseline_run }}
          DISTRIBUTION_ALIAS: ${{ inputs.distribution_alias }}
        run: |
          args=()
          if [ "$DISTRIBUTION_ALIAS" = true ]; then
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            args+=(--distribution-alias)
          fi
          if [ -n "$BASELINE_RUN" ]; then args+=(--baseline-run "$BASELINE_RUN"); fi
          python3 scripts/release/prepare-manager-inputs.py --plan plan/component-plan.json --built-metadata bound/release.json \
            --output "$RUNNER_TEMP/verified-manager-inputs" --payloads "$RUNNER_TEMP/original-runners" "${args[@]}"
      - name: Prepare shipped Codex AppArmor on disposable host
        id: codex-apparmor
        if: github.event_name == 'workflow_dispatch' && needs.changes.outputs.code == 'true'
        shell: bash
        run: bash scripts/ci/prepare-codex-apparmor.sh prepare 2>&1 | tee "$RUNNER_TEMP/codex-apparmor-prepare.log"
      - name: Execute the installed current manager with original immutable runners
        if: github.event_name == 'workflow_dispatch' && needs.changes.outputs.code == 'true'
        run: python3 scripts/release/package-lifecycle.py --current-manager-only packages "$RUNNER_TEMP/original-runners" evidence
      - name: Prove anonymous closure refusal with a separate tiny owned synthetic registry
        if: github.event_name == 'workflow_dispatch' && inputs.distribution_alias && needs.changes.outputs.code == 'true'
        run: python3 scripts/release/probe-registry-closure.py --output evidence
      - name: Retain small current-manager and distribution cleanup receipts
        if: ${{ github.event_name == 'workflow_dispatch' && always() && needs.changes.outputs.code == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: selected-current-manager-summary-${{ github.sha }}
          path: |
            evidence/result.json
            evidence/registry-closure-evidence.json
            evidence/registry-closure-state.txt
          if-no-files-found: warn
      - name: Retain actual current-manager and owned cleanup evidence
        if: ${{ github.event_name == 'workflow_dispatch' && always() && needs.changes.outputs.code == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: selected-current-manager-${{ github.sha }}
          path: evidence/*
          if-no-files-found: warn
      - name: Documentation-only qualification decision
        if: needs.changes.outputs.code == 'false'
        run: echo "Documentation-only event; behavioral checks intentionally omitted, not executed." >> "$GITHUB_STEP_SUMMARY"
      - name: Remove only CI-owned Codex AppArmor policy
        if: ${{ always() && steps.codex-apparmor.outcome != 'skipped' && steps.codex-apparmor.outcome != '' }}
        shell: bash
        run: bash scripts/ci/prepare-codex-apparmor.sh cleanup 2>&1 | tee "$RUNNER_TEMP/codex-apparmor-cleanup.log"
      - name: Retain disposable host policy diagnostics
        if: ${{ always() && steps.codex-apparmor.outcome != 'skipped' && steps.codex-apparmor.outcome != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codex-apparmor-current-manager-integration
          path: ${{ runner.temp }}/codex-apparmor-*.log
          if-no-files-found: error
          retention-days: 30
