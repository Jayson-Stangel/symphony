name: runner-integration

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      # Production image inputs and the launcher exercised by the updater smoke.
      - .dockerignore
      - scripts/symphony
      - runner/Dockerfile
      - runner/Dockerfile.dockerignore
      - runner/entrypoint.sh
      - runner/updater-smoke.py
      - runner/browser/package*.json
      - runner/browser/smoke.cjs
      - runner/claude/*.mjs
      - runner/claude/*.sh
      - runner/claude/package*.json
      - runner/claude/test/**
      - elixir/lib/**
      - elixir/config/**
      - elixir/priv/**
      - elixir/mix.exs
      - elixir/mix.lock
      # Skills are packaged into both production images, including their prose.
      - .codex/skills/**
      - .github/workflows/runner-integration.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  listener-and-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Build production Claude image
        run: docker build --target claude -f runner/Dockerfile -t symphony-claude-smoke .
      - name: Verify credential-free listener and owned subprocess cleanup
        run: bash runner/claude/smoke.sh symphony-claude-smoke
      - name: Build production Codex image using shared layers
        run: docker build --target codex -f runner/Dockerfile -t symphony-codex-smoke .
      - name: Verify isolated updater, rollback and project identity lifecycle
        run: python3 runner/updater-smoke.py symphony-codex-smoke symphony-claude-smoke
