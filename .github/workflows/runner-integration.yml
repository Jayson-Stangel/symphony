name: runner-integration

on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/change-classification.yml
  listener-and-cleanup:
    needs: changes
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require a complete classification decision
        env:
          RESULT: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          test "$RESULT" = success
          case "$CODE" in true|false) ;; *) exit 1 ;; esac
      - name: Checkout
        if: needs.changes.outputs.code != 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build production Claude image
        if: needs.changes.outputs.code != 'false'
        uses: ./.github/actions/build-runner
        with:
          target: claude
          tags: symphony-claude-smoke
          revision: ${{ github.sha }}
      - name: Verify credential-free listener and owned subprocess cleanup
        if: needs.changes.outputs.code != 'false'
        run: bash runner/claude/smoke.sh symphony-claude-smoke
      - name: Build production Codex image using shared layers
        if: needs.changes.outputs.code != 'false'
        uses: ./.github/actions/build-runner
        with:
          target: codex
          tags: symphony-codex-smoke
          revision: ${{ github.sha }}
      - name: Verify final runner Node/npm and Codex startup
        if: needs.changes.outputs.code != 'false'
        run: |
          bash runner/node-smoke.sh symphony-codex-smoke symphony-claude-smoke
          docker run --rm --network none --entrypoint codex symphony-codex-smoke --version
      - name: Verify isolated updater, rollback and project identity lifecycle
        if: needs.changes.outputs.code != 'false'
        run: python3 runner/updater-smoke.py symphony-codex-smoke symphony-claude-smoke
      - name: Build live E2E and Claude qualification images in their harness contexts
        if: needs.changes.outputs.code != 'false'
        run: |
          docker build -t symphony-live-node-smoke elixir/test/support/live_e2e_docker
          docker build -f runner/claude/qualification/Dockerfile -t symphony-qualification-node-smoke runner/claude
      - name: Verify reference image Node/npm and native CLI startup
        if: needs.changes.outputs.code != 'false'
        run: |
          bash runner/node-smoke.sh symphony-live-node-smoke symphony-qualification-node-smoke
          docker run --rm --network none --entrypoint codex symphony-live-node-smoke --version
          docker run --rm --network none symphony-qualification-node-smoke inspect
      - name: Documentation-only qualification decision
        if: needs.changes.outputs.code == 'false'
        run: echo "Documentation-only event; behavioral checks intentionally omitted, not executed." >> "$GITHUB_STEP_SUMMARY"
