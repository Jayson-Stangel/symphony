name: make-all

on:
  pull_request:
  push:
    branches:
      - main
      - dev

jobs:
  changes:
    uses: ./.github/workflows/change-classification.yml
  make-all:
    needs: changes
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require a complete classification decision
        env:
          RESULT: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          test "$RESULT" = success
          case "$CODE" in true|false) ;; *) exit 1 ;; esac
      - name: Checkout
        if: needs.changes.outputs.code != 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Workflow and metadata regressions
        if: needs.changes.outputs.code != 'false'
        run: python3 -m unittest discover -s scripts/ci/tests -v

      - name: Set up mise tools
        if: needs.changes.outputs.code != 'false'
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: true
          cache: true
          working_directory: elixir

      - name: Cache deps and build
        if: needs.changes.outputs.code != 'false'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            elixir/deps
            elixir/_build
          key: ${{ runner.os }}-mix-${{ hashFiles('elixir/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Verify make all
        if: needs.changes.outputs.code != 'false'
        working-directory: elixir
        run: make all
      - name: Documentation-only qualification decision
        if: needs.changes.outputs.code == 'false'
        run: echo "Documentation-only event; behavioral checks intentionally omitted, not executed." >> "$GITHUB_STEP_SUMMARY"
