name: Application checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches:
      - main
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read
  actions: read
  statuses: read

jobs:
  changes:
    name: Classify changes
    uses: ./.github/workflows/change-classification.yml
  platform-contracts:
    name: Fast process contracts (${{ matrix.os }})
    needs: [changes, mac-runner]
    if: ${{ always() && !cancelled() && needs.changes.result == 'success' && needs.mac-runner.result == 'success' && (needs.changes.outputs.npm == 'true' || needs.changes.outputs.contracts == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os == 'macos-14' && needs.mac-runner.outputs.runner || matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require actual native Mac prerequisites
        working-directory: ${{ runner.temp }}
        if: matrix.os == 'macos-14'
        env:
          BACKUP_MAC_SELECTED: ${{ needs.mac-runner.outputs.runner != 'macos-14' }}
        run: |
          test "$(uname -s)/$(uname -m)" = Darwin/arm64
          python3 -c 'import sys; assert sys.version_info >= (3, 11), "native Mac checks require Python 3.11+"'
          if [ "$BACKUP_MAC_SELECTED" = true ]; then
            case "$(sw_vers -productVersion)" in 14.*) ;; *) echo 'Backup guest must be macOS 14' >&2; exit 1 ;; esac
          fi
      - name: Require supported fast contract prerequisites
        run: python3 -c 'import sys; assert sys.version_info >= (3, 11), "fast contracts require Python 3.11+"'
      - name: Npm process ownership regressions
        if: needs.changes.outputs.npm == 'true'
        run: python3 runner/test_npm_cache_lifecycle.py
      - name: Launcher credential and lock contracts
        if: needs.changes.outputs.contracts == 'true'
        run: python3 scripts/ci/release_tests.py contracts
  make-all:
    name: Application checks
    needs: [changes, platform-contracts, mac-runner, elixir-checks, claude-checks]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require a complete classification decision
        env:
          RESULT: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.application }}
          CLAUDE: ${{ needs.changes.outputs.claude }}
          ELIXIR_RESULT: ${{ needs.elixir-checks.result }}
          ELIXIR_MODE: ${{ needs.elixir-checks.outputs.coverage_mode }}
          ELIXIR_ORIGIN: ${{ needs.elixir-checks.outputs.coverage_origin }}
          CLAUDE_RESULT: ${{ needs.claude-checks.result }}
          POLICY: ${{ needs.changes.outputs.policy }}
          READY: ${{ needs.changes.outputs.ready }}
          NPM: ${{ needs.changes.outputs.npm }}
          READINESS: ${{ needs.changes.outputs.readiness }}
          CONFIG: ${{ needs.changes.outputs.codex_config }}
          CONTRACTS: ${{ needs.changes.outputs.contracts }}
          PROCESS_RESULT: ${{ needs.platform-contracts.result }}
          MAC_RUNNER_RESULT: ${{ needs.mac-runner.result }}
        run: |
          test "$RESULT" = success
          case "$CODE" in true|false) ;; *) exit 1 ;; esac
          case "$POLICY" in true|false) ;; *) exit 1 ;; esac
          for flag in "$CLAUDE" "$READY" "$NPM" "$READINESS" "$CONFIG" "$CONTRACTS"; do
            case "$flag" in true|false) ;; *) exit 1 ;; esac
          done
          if [ "$CODE" = true ] || [ "$CLAUDE" = true ]; then test "$POLICY" = true; fi
          for family in elixir claude; do
            if [ "$family" = elixir ]; then selected=$CODE; observed=$ELIXIR_RESULT;
            else selected=$CLAUDE; observed=$CLAUDE_RESULT; fi
            if [ "$selected" = true ] && [ "$READY" = true ]; then
              test "$observed" = success
              if [ "$family" = elixir ]; then
                case "$ELIXIR_MODE" in
                  EXECUTED) test -z "$ELIXIR_ORIGIN" || exit 1 ;;
                  REUSED) [[ "$ELIXIR_ORIGIN" =~ ^https://github.com/Jayson-Stangel/symphony/actions/runs/[1-9][0-9]*/attempts/[1-9][0-9]*$ ]] || exit 1 ;;
                  *) exit 1 ;;
                esac
              fi
            else
              test "$observed" = skipped
              if [ "$family" = elixir ]; then test -z "$ELIXIR_MODE$ELIXIR_ORIGIN" || exit 1; fi
            fi
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              if [ "$family" = elixir ]; then mode=${ELIXIR_MODE:-OMITTED};
              elif [ "$observed" = success ]; then mode=EXECUTED; else mode=OMITTED; fi
              echo "$family family: $mode; selected=$selected, ready=$READY, result=$observed; Elixir original=${ELIXIR_ORIGIN:-none}. Other selected stages remain fresh." >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          if [ "$NPM" = true ] || [ "$READINESS" = true ] || [ "$CONFIG" = true ] || [ "$CONTRACTS" = true ]; then
            test "$POLICY" = true
          fi
          if [ "$NPM" = true ] || [ "$CONTRACTS" = true ]; then
            test "$MAC_RUNNER_RESULT" = success
            test "$PROCESS_RESULT" = success
          else
            test "$MAC_RUNNER_RESULT" = skipped
            test "$PROCESS_RESULT" = skipped
          fi
      - name: Check out source
        if: needs.changes.outputs.policy == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Workflow and metadata regressions
        if: needs.changes.outputs.policy == 'true'
        run: python3 -m unittest discover -s scripts/ci/tests -v

      - name: Validate all workflow and composite action definitions
        if: needs.changes.outputs.policy == 'true'
        run: |
          curl -fsSL --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes=

      - name: Codex readiness regressions
        if: needs.changes.outputs.readiness == 'true'
        run: python3 runner/test_codex_readiness.py
      - name: Codex file and mount policy regressions
        if: needs.changes.outputs.codex_config == 'true'
        run: python3 scripts/ci/release_tests.py codex-config
      - name: Npm configuration semantics
        if: needs.changes.outputs.npm == 'true'
        run: python3 runner/test_npm_cache.py
      - name: Require ready application qualification
        env:
          APPLICATION: ${{ needs.changes.outputs.application }}
          CLAUDE: ${{ needs.changes.outputs.claude }}
          READY: ${{ needs.changes.outputs.ready }}
        run: |
          if { [ "$APPLICATION" = true ] || [ "$CLAUDE" = true ]; } && [ "$READY" = false ]; then
            echo 'Draft PR: affected application family qualification deferred; this required context remains non-passing until ready qualification succeeds.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Application qualification omission
        if: needs.changes.outputs.application == 'false' && needs.changes.outputs.claude == 'false'
        run: echo "No application inputs changed; behavioral checks intentionally omitted, not executed." >> "$GITHUB_STEP_SUMMARY"
      - name: Documentation policy omission
        if: needs.changes.outputs.policy == 'false'
        run: echo "Human-facing documentation only; CI regression suites and workflow/toolchain setup intentionally omitted, not executed." >> "$GITHUB_STEP_SUMMARY"

  elixir-checks:
    name: Elixir quality, build and full coverage
    needs: changes
    if: needs.changes.outputs.application == 'true' && needs.changes.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    outputs:
      coverage_mode: ${{ steps.executed.outputs.mode || steps.reused.outputs.mode }}
      coverage_origin: ${{ steps.reused.outputs.origin }}
    env:
      COVERAGE_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
      COVERAGE_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || '' }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select audited coverage preparation and isolated cache family
        id: profile
        run: /usr/bin/python3 -B scripts/ci/elixir_coverage.py select
      - name: Set up mise tools
        if: steps.profile.outputs.supported == 'false'
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: true
          cache: ${{ steps.profile.outputs.supported == 'false' }}
          working_directory: elixir
      - name: Cache ordinary deps and build
        if: steps.profile.outputs.supported == 'false'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            elixir/deps
            elixir/_build
          key: ${{ runner.os }}-mix-${{ hashFiles('elixir/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-
      - name: Prove actual read-only evidence service access
        env:
          GH_TOKEN: ${{ github.token }}
        run: /usr/bin/python3 -B scripts/ci/elixir_coverage.py capability
      - name: Load immutable protected-dev coverage controller or force fresh
        id: controller
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          /usr/bin/python3 -B -I - <<'PY'
          import base64, hashlib, json, os, re, subprocess
          from pathlib import Path
          root = Path(os.environ['GITHUB_WORKSPACE']) / 'scripts/ci'
          selected = root
          trusted = False
          # The root workflow is reviewed/unchanged; candidate modules do not
          # decide whether they may skip tests. Feature/fork paths stay fresh.
          eligible = ((os.environ['GITHUB_EVENT_NAME'] == 'push' and os.environ.get('GITHUB_REF') in ('refs/heads/dev','refs/heads/main'))
              or (os.environ['GITHUB_EVENT_NAME'] == 'pull_request'
              and os.environ.get('COVERAGE_HEAD_REPOSITORY') == 'Jayson-Stangel/symphony'))
          if eligible:
              try:
                  temporary = Path(os.environ['RUNNER_TEMP'])
                  home = temporary / 'symphony-coverage-bootstrap-fetch-v1'
                  home.mkdir(mode=0o700)
                  environment = dict(PATH='/usr/bin:/bin', HOME=str(home), GH_CONFIG_DIR=str(home / 'gh'),
                      GH_TOKEN=os.environ['GH_TOKEN'], GH_HOST='github.com', GH_PROMPT_DISABLED='1')
                  def get(path):
                      raw = subprocess.check_output(['/usr/bin/gh', 'api', '--method', 'GET',
                          'repos/Jayson-Stangel/symphony/' + path], env=environment,
                          stderr=subprocess.DEVNULL, timeout=8)
                      if len(raw) > 256 * 1024: raise ValueError('bounded immutable source required')
                      return json.loads(raw)
                  dev = get('branches/dev')
                  revision = dev['commit']['sha']
                  if dev.get('protected') is not True or not re.fullmatch('[0-9a-f]{40}', revision):
                      raise ValueError('protected dev source unavailable')
                  value = get('contents/scripts/ci/elixir_coverage_bootstrap.py?ref=' + revision)
                  raw = base64.b64decode(''.join(value['content'].split()), validate=True)
                  actual = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
                  if value.get('encoding') != 'base64' or actual != value.get('sha'):
                      raise ValueError('immutable bootstrap bytes differ')
                  path = temporary / 'symphony-coverage-bootstrap.py'
                  fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
                  with os.fdopen(fd, 'wb') as target: target.write(raw)
                  # Only immutable upstream stdlib bootstrap code executes here.
                  subprocess.run(['/usr/bin/python3', '-B', '-I', str(path)], check=True, timeout=35)
                  raise SystemExit(0)
              except (ValueError, OSError, KeyError, TypeError, AttributeError, subprocess.SubprocessError):
                  pass
          with open(os.environ['GITHUB_OUTPUT'], 'a') as target:
              target.write('controller=' + str(selected) + '\ntrusted=false\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as target:
              target.write('No eligible immutable protected-dev controller; full coverage is forced fresh.\n')
          PY
      - name: Prove read-only OCI tool and isolation profile
        if: steps.profile.outputs.supported == 'true'
        run: /usr/bin/python3 -B scripts/ci/elixir_coverage.py oci_setup
      - name: Authenticate protected-origin cache before preparation
        if: steps.profile.outputs.supported == 'true' && steps.controller.outputs.trusted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: /usr/bin/python3 -B "${{ steps.controller.outputs.controller }}/elixir_coverage.py" warm
      - name: Prepare controlled full Elixir qualification
        run: /usr/bin/python3 -B scripts/ci/elixir_coverage.py prepare
      - name: Measure complete full-coverage inputs
        run: /usr/bin/python3 -B scripts/ci/elixir_coverage.py measure
      - name: Choose fresh or verified full-coverage evidence
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: /usr/bin/python3 -B "${{ steps.controller.outputs.controller }}/elixir_coverage.py" decide
      - name: Execute full ExUnit coverage (EXECUTED)
        id: executed
        if: steps.controller.outputs.trusted != 'true' || steps.evidence.outputs.mode != 'REUSED'
        run: /usr/bin/python3 -B scripts/ci/elixir_coverage.py execute
      - name: Retain upstream full-coverage proof (REUSED)
        id: reused
        if: steps.controller.outputs.trusted == 'true' && steps.evidence.outputs.mode == 'REUSED'
        run: /usr/bin/python3 -B "${{ steps.controller.outputs.controller }}/elixir_coverage.py" reused
      - name: Verify fresh Dialyzer
        run: /usr/bin/python3 -B scripts/ci/elixir_coverage.py dialyzer
      - name: Prepare original executed coverage proof
        id: producer
        env:
          GH_TOKEN: ${{ github.token }}
        run: /usr/bin/python3 -B scripts/ci/elixir_coverage.py seal
      - name: Retain original executed coverage proof
        if: steps.producer.outputs.available == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: elixir-full-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/symphony-coverage-v2/proof/
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

      - name: Prepare bounded unqualified public input diagnostics
        id: diagnostics
        if: always() && steps.profile.outputs.supported == 'true' && (failure() || (steps.producer.outputs.available != 'true' && steps.evidence.outputs.mode != 'REUSED'))
        run: /usr/bin/python3 -B scripts/ci/elixir_coverage.py diagnostics
      - name: Retain unqualified public input diagnostics
        if: always() && steps.diagnostics.outputs.available == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: elixir-coverage-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/symphony-coverage-v2/diagnostics/
          retention-days: 3
          if-no-files-found: error
          compression-level: 1

      - name: Remove owned OCI execution resources
        if: always() && steps.profile.outputs.supported == 'true'
        run: /usr/bin/python3 -B scripts/ci/elixir_coverage.py cleanup

  claude-checks:
    name: Claude syntax and Node tests
    needs: changes
    if: needs.changes.outputs.claude == 'true' && needs.changes.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the canonical pinned Node version
        id: node-toolchain
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          import re, tomllib
          version = tomllib.loads(Path('elixir/mise.toml').read_text())['tools']['node']
          if not isinstance(version, str) or not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version):
              raise ValueError('Claude checks require a complete pinned Node version')
          print('version=' + version)
          PY
      - name: Set up only the Node toolchain
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: true
          cache: true
          tool_versions: node ${{ steps.node-toolchain.outputs.version }}
      - name: Verify independent Claude family
        run: make -C elixir claude-ci

  mac-runner:
    name: Select owned Mac first for platform contracts
    needs: changes
    if: ${{ always() && !cancelled() && needs.changes.result == 'success' && (needs.changes.outputs.npm == 'true' || needs.changes.outputs.contracts == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    outputs:
      runner: ${{ steps.selected.outputs.runner }}
    steps:
      - name: Check out source for owned-first capacity selection
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prove actual workflow-token capacity read before host preparation
        id: capacity-probe
        env:
          SELECT_TARGET_REQUESTED: ${{ needs.changes.outputs.npm == 'true' || needs.changes.outputs.contracts == 'true' }}
          GH_TOKEN: ${{ github.token }}
          SELECT_WORKFLOW_PATH: .github/workflows/make-all.yml
          SELECT_JOB_KEY: platform-contracts
        run: python3 scripts/ci/mac_runner_request.py --probe >> "$GITHUB_OUTPUT"
      - name: Prefer prepared owned capacity; report pre-execution fallback
        id: selected
        env:
          SELECT_TARGET_REQUESTED: ${{ needs.changes.outputs.npm == 'true' || needs.changes.outputs.contracts == 'true' }}
          GH_TOKEN: ${{ github.token }}
          BACKUP_MAC_PERMIT: ${{ vars.SYMPHONY_BACKUP_MAC_PERMIT }}
          SELECT_WORKFLOW_PATH: .github/workflows/make-all.yml
          SELECT_JOB_KEY: platform-contracts
        run: python3 scripts/ci/mac_runner_request.py >> "$GITHUB_OUTPUT"
