name: Verify locally signed production distribution
on:
  workflow_dispatch:
    inputs:
      transport_fixture_only:
        description: Explicit nonproduction dev transport fixture only; no native admission or signing
        required: false
        default: false
        type: boolean
      approved_revision:
        description: Exact promoted source approved for local import
        required: true
        type: string
      staging_release:
        description: Private nonproduction draft release ID from local upload receipt
        required: true
        type: string
      staging_asset:
        description: Exact original GitHub staging asset ID
        required: true
        type: string
      staging_digest:
        description: Original GitHub sha256 asset digest from local upload receipt
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: macos-local-signing-import
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  verify:
    name: Verify locally signed distribution
    permissions:
      contents: read
      actions: read
    needs: [mac-runner-local-import, staging-ingress]
    if: ${{ !inputs.transport_fixture_only && github.repository == 'Jayson-Stangel/symphony' && github.ref == 'refs/heads/main' && inputs.approved_revision == github.sha }}
    environment: macos-production-signing
    # Default remains hosted Intel; an exact permit may select the isolated ARM guest.
    # Both inspect signatures/tickets without executing the uploaded ARM64 payload.
    runs-on: ${{ needs.mac-runner-local-import.outputs.runner }}
    timeout-minutes: 30
    steps:
      - name: Require and report actual Mac verification hardware
        working-directory: ${{ runner.temp }}
        env:
          BACKUP_MAC_SELECTED: ${{ needs.mac-runner-local-import.outputs.runner != 'macos-15-intel' }}
        run: |
          test "$(uname -s)" = Darwin
          case "$(uname -m)" in arm64|x86_64) ;; *) echo 'Unsupported Mac inspection hardware' >&2; exit 1 ;; esac
          if [ "$BACKUP_MAC_SELECTED" = true ]; then
            test "$(uname -m)" = arm64
            case "$(sw_vers -productVersion)" in 14.*) ;; *) echo 'Backup guest must be macOS 14' >&2; exit 1 ;; esac
          fi
          printf 'Native inspection hardware: %s; macOS %s\n' "$(uname -m)" "$(sw_vers -productVersion)"
      - name: Check out exact approved source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Import exact local bytes and verify qualification and native signatures
        env:
          INGRESS_ARTIFACT_ID: ${{ needs.staging-ingress.outputs.artifact_id }}
          INGRESS_ARTIFACT_NAME: ${{ needs.staging-ingress.outputs.artifact_name }}
          INGRESS_ARTIFACT_DIGEST: ${{ needs.staging-ingress.outputs.artifact_digest }}
          GH_TOKEN: ${{ github.token }}
          STAGING_RELEASE: ${{ inputs.staging_release }}
          STAGING_ASSET: ${{ inputs.staging_asset }}
          STAGING_DIGEST: ${{ inputs.staging_digest }}
          MACOS_SIGNING_IDENTITY_SHA1: ${{ vars.MACOS_SIGNING_IDENTITY_SHA1 }}
          MACOS_TEAM_ID: ${{ vars.MACOS_TEAM_ID }}
        run: |
          python3 scripts/release/local_distribution.py import-ingress "$INGRESS_ARTIFACT_ID" "$INGRESS_ARTIFACT_NAME" "$INGRESS_ARTIFACT_DIGEST" "$STAGING_RELEASE" "$STAGING_ASSET" "$STAGING_DIGEST" "$RUNNER_TEMP/local-import"
      - name: Retain immutable locally signed bytes and native admission evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-local-signed-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/local-import/signed/
            ${{ runner.temp }}/local-import/local-origin.json
            ${{ runner.temp }}/local-import/native-verification.json
          if-no-files-found: error
  mac-runner-local-import:
    name: Select backup Mac for local distribution inspection
    if: ${{ !inputs.transport_fixture_only && github.repository == 'Jayson-Stangel/symphony' && github.ref == 'refs/heads/main' && inputs.approved_revision == github.sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      runner: ${{ steps.hosted.outputs.runner || steps.selected.outputs.runner }}
    steps:
      - name: Retain hosted Intel inspection by default
        id: hosted
        if: vars.SYMPHONY_BACKUP_MAC_PERMIT == ''
        run: echo 'runner=macos-15-intel' >> "$GITHUB_OUTPUT"
      - name: Check out source for an explicit routing permit
        if: vars.SYMPHONY_BACKUP_MAC_PERMIT != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the exact credential free Mac routing permit
        id: selected
        if: vars.SYMPHONY_BACKUP_MAC_PERMIT != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_MAC_PERMIT: ${{ vars.SYMPHONY_BACKUP_MAC_PERMIT }}
          SELECT_WORKFLOW_PATH: .github/workflows/macos-local-signing-import.yml
          SELECT_JOB_KEY: verify
        run: python3 scripts/ci/select_mac_runner.py >> "$GITHUB_OUTPUT"
  staging-ingress:
    name: Read private staged distribution
    if: ${{ !inputs.transport_fixture_only && github.repository == 'Jayson-Stangel/symphony' && github.ref == 'refs/heads/main' && inputs.approved_revision == github.sha }}
    environment: macos-production-signing
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      artifact_id: ${{ steps.opaque.outputs.artifact-id }}
      artifact_digest: "sha256:${{ steps.opaque.outputs.artifact-digest }}"
      artifact_name: local-signing-ingress-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out exact approved source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read only the exact original private asset into opaque staging
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_RELEASE: ${{ inputs.staging_release }}
          STAGING_ASSET: ${{ inputs.staging_asset }}
          STAGING_DIGEST: ${{ inputs.staging_digest }}
        run: |
          python3 scripts/release/local_distribution.py stage-ingress "$STAGING_RELEASE" "$STAGING_ASSET" "$STAGING_DIGEST" "$RUNNER_TEMP/staging-ingress"
      - name: Retain opaque bytes without native or qualification admission
        id: opaque
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: local-signing-ingress-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/staging-ingress/payload.zip
            ${{ runner.temp }}/staging-ingress/ingress.json
          if-no-files-found: error
  transport-source:
    name: Read fixed transport fixture into opaque handoff
    if: github.repository == 'Jayson-Stangel/symphony' && github.event_name == 'workflow_dispatch' && inputs.transport_fixture_only && github.actor == 'Jayson-Stangel' && github.ref == 'refs/heads/dev' && inputs.approved_revision == github.sha && github.run_attempt == 1
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      artifact_id: ${{ steps.opaque.outputs.artifact-id }}
      artifact_digest: "sha256:${{ steps.opaque.outputs.artifact-digest }}"
      artifact_name: transport-fixture-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    env:
      TRANSPORT_FIXTURE_ONLY: 'true'
      APPROVED_REVISION: ${{ inputs.approved_revision }}
      STAGING_RELEASE: ${{ inputs.staging_release }}
      STAGING_ASSET: ${{ inputs.staging_asset }}
      STAGING_DIGEST: ${{ inputs.staging_digest }}
    steps:
      - name: Check out exact reviewed fixture source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read only the exact approved fixture asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release/transport_fixture.py stage "$RUNNER_TEMP/transport-source" > "$RUNNER_TEMP/transport-source-result.json"
          cat "$RUNNER_TEMP/transport-source-result.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain the one opaque fixture handoff
        id: opaque
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: transport-fixture-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/transport-source/payload.zip
            ${{ runner.temp }}/transport-source/ingress.json
          if-no-files-found: error
          retention-days: 1
  transport-reader:
    name: Verify fixed transport fixture with read-only token
    needs: transport-source
    if: github.repository == 'Jayson-Stangel/symphony' && github.event_name == 'workflow_dispatch' && inputs.transport_fixture_only && github.actor == 'Jayson-Stangel' && github.ref == 'refs/heads/dev' && inputs.approved_revision == github.sha && github.run_attempt == 1
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TRANSPORT_FIXTURE_ONLY: 'true'
      APPROVED_REVISION: ${{ inputs.approved_revision }}
      STAGING_RELEASE: ${{ inputs.staging_release }}
      STAGING_ASSET: ${{ inputs.staging_asset }}
      STAGING_DIGEST: ${{ inputs.staging_digest }}
      INGRESS_ARTIFACT_ID: ${{ needs.transport-source.outputs.artifact_id }}
      INGRESS_ARTIFACT_NAME: ${{ needs.transport-source.outputs.artifact_name }}
      INGRESS_ARTIFACT_DIGEST: ${{ needs.transport-source.outputs.artifact_digest }}
    steps:
      - name: Check out exact reviewed fixture source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact immutable fixture service identity and opaque bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release/transport_fixture.py receive "$RUNNER_TEMP/transport-reader" > "$RUNNER_TEMP/transport-reader-result.json"
          cat "$RUNNER_TEMP/transport-reader-result.json" >> "$GITHUB_STEP_SUMMARY"
  transport-registry:
    name: Verify canonical fixture upload and explicit continuation
    needs: [transport-source, transport-reader]
    if: github.repository == 'Jayson-Stangel/symphony' && github.event_name == 'workflow_dispatch' && inputs.transport_fixture_only && github.actor == 'Jayson-Stangel' && github.ref == 'refs/heads/dev' && inputs.approved_revision == github.sha && github.run_attempt == 1
    permissions:
      contents: read
      actions: read
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TRANSPORT_FIXTURE_ONLY: 'true'
      APPROVED_REVISION: ${{ inputs.approved_revision }}
      STAGING_RELEASE: ${{ inputs.staging_release }}
      STAGING_ASSET: ${{ inputs.staging_asset }}
      STAGING_DIGEST: ${{ inputs.staging_digest }}
      INGRESS_ARTIFACT_ID: ${{ needs.transport-source.outputs.artifact_id }}
      INGRESS_ARTIFACT_NAME: ${{ needs.transport-source.outputs.artifact_name }}
      INGRESS_ARTIFACT_DIGEST: ${{ needs.transport-source.outputs.artifact_digest }}
    steps:
      - name: Check out exact reviewed fixture source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Exercise only the approved tiny immutable graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release/transport_fixture.py registry "$RUNNER_TEMP/transport-registry"
      - name: Retain bounded structural evidence without upload state or tokens
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/transport-registry/registry-proof.json" ]; then
            cat "$RUNNER_TEMP/transport-registry/registry-proof.json" >> "$GITHUB_STEP_SUMMARY"
          fi
