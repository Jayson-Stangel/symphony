name: Verify locally signed production distribution
on:
  workflow_dispatch:
    inputs:
      approved_revision:
        description: Exact promoted source already qualified and signed locally
        required: true
        type: string
      staging_release:
        description: Private nonproduction draft release ID from local upload receipt
        required: true
        type: string
      staging_asset:
        description: Exact original GitHub staging asset ID
        required: true
        type: string
      staging_digest:
        description: Original GitHub sha256 asset digest from local upload receipt
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: macos-local-signing-import
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  verify:
    name: Verify locally signed distribution
    if: github.repository == 'Jayson-Stangel/symphony' && github.ref == 'refs/heads/main' && inputs.approved_revision == github.sha
    environment: macos-production-signing
    # Inspect signatures/tickets on Intel; do not execute the ARM64 payload.
    # This avoids depending on ARM64 signing-runner capacity for the fallback.
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - name: Check out exact approved source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Import exact local bytes and verify qualification and native signatures
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_RELEASE: ${{ inputs.staging_release }}
          STAGING_ASSET: ${{ inputs.staging_asset }}
          STAGING_DIGEST: ${{ inputs.staging_digest }}
          MACOS_SIGNING_IDENTITY_SHA1: ${{ vars.MACOS_SIGNING_IDENTITY_SHA1 }}
          MACOS_TEAM_ID: ${{ vars.MACOS_TEAM_ID }}
        run: |
          python3 scripts/release/local_distribution.py import "$STAGING_RELEASE" "$STAGING_ASSET" "$STAGING_DIGEST" "$RUNNER_TEMP/local-import"
      - name: Retain immutable locally signed bytes and native admission evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-local-signed-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/local-import/signed/
            ${{ runner.temp }}/local-import/local-origin.json
            ${{ runner.temp }}/local-import/native-verification.json
          if-no-files-found: error
