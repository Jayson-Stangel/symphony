name: Current manager helpers
on:
  workflow_call:
    inputs:
      portable_revision:
        description: Exact source qualified by the caller's cheap portable preflight
        type: string
        required: true
    outputs:
      qualified_revision:
        value: ${{ jobs.qualification.outputs.qualified_revision }}
permissions:
  contents: read
  actions: read
jobs:
  host-policy:
    name: Select native hosts
    uses: ./.github/workflows/host-policy.yml
  helper:
    name: Build manager helper (${{ matrix.platform }})
    if: ${{ always() && !cancelled() && needs.host-policy.result == 'success' && needs.mac-runner-helper.result == 'success' }}
    needs: [host-policy, mac-runner-helper]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.host-policy.outputs.matrix) }}
    runs-on: ${{ matrix.platform == 'macos' && needs.mac-runner-helper.outputs.runner || matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Require actual native Mac prerequisites
        working-directory: ${{ runner.temp }}
        if: matrix.platform == 'macos'
        env:
          BACKUP_MAC_SELECTED: ${{ needs.mac-runner-helper.outputs.runner != 'macos-14' }}
        run: |
          test "$(uname -s)/$(uname -m)" = Darwin/arm64
          python3 -c 'import sys; assert sys.version_info >= (3, 11), "native Mac checks require Python 3.11+"'
          if [ "$BACKUP_MAC_SELECTED" = true ]; then
            case "$(sw_vers -productVersion)" in 14.*) ;; *) echo 'Backup guest must be macOS 14' >&2; exit 1 ;; esac
          fi
      - name: Require successful exact-source portable qualification
        env:
          PORTABLE_REVISION: ${{ inputs.portable_revision }}
        run: test "$PORTABLE_REVISION" = "$GITHUB_SHA"
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Build actual native macOS ARM64 helper
        if: matrix.platform == 'macos'
        run: |
          mkdir -p "$RUNNER_TEMP/host-helper"
          bash scripts/release/build-host-helper.sh "$RUNNER_TEMP/host-helper/symphony-host" --native
          (cd "$RUNNER_TEMP/host-helper" && shasum -a 256 symphony-host > symphony-host.sha256)
      - name: Build actual static Linux x86-64 helper
        if: matrix.platform == 'linux_x86_64'
        run: bash scripts/release/build-linux-host-helper.sh "$RUNNER_TEMP/host-helper"
      - name: Native source-independent shared helper contracts
        env:
          SYMPHONY_TEST_HOST_HELPER: ${{ runner.temp }}/host-helper/symphony-host
          PLATFORM: ${{ matrix.platform }}
        run: |
          test "$("$SYMPHONY_TEST_HOST_HELPER" build-revision)" = "$GITHUB_SHA"
          test "$("$SYMPHONY_TEST_HOST_HELPER" host-platform)" = "$PLATFORM"
          python3 scripts/package/test-package.py -v
          python3 scripts/package/test-selected-image.py -v
          python3 scripts/package/test-environment.py -v
          python3 scripts/package/test-manager-protocol.py -v
          python3 -B -m unittest discover -s scripts/package/tests -p test_codex_config_store.py -v
      - name: Execute artifact in clean Ubuntu 26.04 without build tools
        if: matrix.platform == 'linux_x86_64'
        env:
          HELPER: ${{ runner.temp }}/host-helper/symphony-host
        run: |
          set -euo pipefail
          docker run --rm -v "$HELPER:/symphony-host:ro" -e EXPECTED_REVISION="$GITHUB_SHA" ubuntu:26.04 bash -euc '
            uname -sm
            cat /etc/os-release
            for tool in swift swiftc python3 node git mise elixir erl; do
              if command -v "$tool" >/dev/null 2>&1; then
                printf "unexpected helper runtime dependency present: %s\n" "$tool" >&2
                exit 1
              fi
            done
            test "$(/symphony-host build-revision)" = "$EXPECTED_REVISION"
            test "$(/symphony-host hash-blob hello)" = b6fc4c620b67d95f953a5c1c1230aaab5db5a1b0
            mkdir -m700 /contract
            /symphony-host owned-directory /contract
            exec 8>>/contract/lock
            /symphony-host lock /contract/lock 8 acquire
            /symphony-host lock /contract/lock 8 inherited
          ' | tee "$RUNNER_TEMP/host-helper/ubuntu26.log"
      - name: Retain actual exact-source platform helper and qualification
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: current-manager-helper-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/host-helper/*
          if-no-files-found: error
          retention-days: 30

  qualification:
    name: Bind qualified manager helpers
    if: ${{ always() && !cancelled() && needs.helper.result == 'success' }}
    needs: helper
    runs-on: ubuntu-24.04
    outputs:
      qualified_revision: ${{ steps.qualified.outputs.revision }}
    steps:
      - name: Emit exact-source qualification receipt
        id: qualified
        env:
          PORTABLE_REVISION: ${{ inputs.portable_revision }}
        run: |
          test "$PORTABLE_REVISION" = "$GITHUB_SHA"
          echo "revision=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  mac-runner-helper:
    name: Select backup Mac for helper
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      runner: ${{ steps.hosted.outputs.runner || steps.selected.outputs.runner }}
    steps:
      - name: Retain hosted execution by default
        id: hosted
        if: vars.SYMPHONY_BACKUP_MAC_PERMIT == ''
        run: echo 'runner=macos-14' >> "$GITHUB_OUTPUT"
      - name: Check out source for an explicit routing permit
        if: vars.SYMPHONY_BACKUP_MAC_PERMIT != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the exact credential free Mac routing permit
        id: selected
        if: vars.SYMPHONY_BACKUP_MAC_PERMIT != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_MAC_PERMIT: ${{ vars.SYMPHONY_BACKUP_MAC_PERMIT }}
          SELECT_WORKFLOW_PATH: .github/workflows/native-manager-helpers.yml
          SELECT_JOB_KEY: helper
        run: python3 scripts/ci/select_mac_runner.py >> "$GITHUB_OUTPUT"
