name: Native release fixtures
on:
  workflow_call:
permissions:
  contents: read
  actions: read
  statuses: read
jobs:
  host-policy:
    name: Select native hosts
    uses: ./.github/workflows/host-policy.yml
  native:
    name: Native process fixtures (${{ matrix.platform }})
    needs: [host-policy, mac-runner-native]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.host-policy.outputs.matrix) }}
    runs-on: ${{ matrix.platform == 'macos' && needs.mac-runner-native.outputs.runner || matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Require actual native Mac prerequisites
        working-directory: ${{ runner.temp }}
        if: matrix.platform == 'macos'
        env:
          BACKUP_MAC_SELECTED: ${{ needs.mac-runner-native.outputs.runner != 'macos-14' }}
        run: |
          test "$(uname -s)/$(uname -m)" = Darwin/arm64
          python3 -c 'import sys; assert sys.version_info >= (3, 11), "native Mac checks require Python 3.11+"'
          if [ "$BACKUP_MAC_SELECTED" = true ]; then
            case "$(sw_vers -productVersion)" in 14.*) ;; *) echo 'Backup guest must be macOS 14' >&2; exit 1 ;; esac
          fi
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Native compatibility fixtures verify retained source trees in Git.
          fetch-depth: 0
      - name: Install native socket inspection utility
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y lsof
      - name: Run native process and updater fixtures once for this OS and CPU
        run: |
          uname -sm
          python3 scripts/ci/release_tests.py native

  mac-runner-native:
    name: Select owned Mac first for native
    needs: [host-policy]
    if: ${{ always() && !cancelled() && needs.host-policy.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    outputs:
      runner: ${{ steps.selected.outputs.runner }}
    steps:
      - name: Check out source for owned-first capacity selection
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prove actual workflow-token capacity read before host preparation
        id: capacity-probe
        env:
          GH_TOKEN: ${{ github.token }}
          SELECT_WORKFLOW_PATH: .github/workflows/release-native.yml
          SELECT_JOB_KEY: native
        run: python3 scripts/ci/mac_runner_request.py --probe >> "$GITHUB_OUTPUT"
      - name: Prefer prepared owned capacity; report pre-execution fallback
        id: selected
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_MAC_PERMIT: ${{ vars.SYMPHONY_BACKUP_MAC_PERMIT }}
          SELECT_WORKFLOW_PATH: .github/workflows/release-native.yml
          SELECT_JOB_KEY: native
        run: python3 scripts/ci/mac_runner_request.py >> "$GITHUB_OUTPUT"
