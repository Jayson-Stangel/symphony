name: Native release fixtures
on:
  workflow_call:
permissions:
  contents: read
jobs:
  host-policy:
    name: Select native hosts
    uses: ./.github/workflows/host-policy.yml
  native:
    name: Native process fixtures (${{ matrix.platform }})
    needs: host-policy
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.host-policy.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Native compatibility fixtures verify retained source trees in Git.
          fetch-depth: 0
      - name: Install native socket inspection utility
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y lsof
      - name: Run native process and updater fixtures once for this OS and CPU
        run: |
          uname -sm
          python3 scripts/ci/release_tests.py native
