name: Native release fixtures
on:
  workflow_call:
permissions:
  contents: read
jobs:
  host-policy:
    uses: ./.github/workflows/host-policy.yml
  native:
    needs: host-policy
    name: native-fixtures (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.host-policy.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install native socket inspection utility
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y lsof
      - name: Run native process and updater fixtures once for this OS and CPU
        run: |
          uname -sm
          python3 scripts/ci/release_tests.py native
