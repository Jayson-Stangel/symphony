name: Engine release

on:
  # Manual feature-ref runs build and qualify candidates without production publication.
  workflow_dispatch:
    inputs:
      previous_artifact_run:
        description: Exact qualified current-manager package run for download-only installed update tests
        type: string
        default: ''
      legacy_artifact_run:
        description: Exact old schema1 run retained across bridge and schema2 updates
        type: string
        default: ''
      manager_only_update:
        description: Require unchanged components and test actual manager-only update/rollback
        type: boolean
        default: false
      previous_revision:
        description: Optional full prior Linux-capable source for actual two-revision package lifecycle
        type: string
        default: ''
      retain_diagnostic:
        description: Preserve this explicitly requested full candidate across new commits
        type: boolean
        default: false
      engine_only:
        description: Qualify only the two native standalone engines; omit runner images and publication
        type: boolean
        default: false
      controller_only:
        description: Run only isolated controller fixtures on native macOS ARM64 (no artifacts or publication)
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: engine-candidate-${{ github.event_name }}-${{ github.ref }}-${{ (inputs.controller_only || inputs.retain_diagnostic) && github.run_id || 'latest' }}
  cancel-in-progress: ${{ !inputs.controller_only && !inputs.retain_diagnostic && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  qualification:
    name: Validate preflight inputs
    if: ${{ !inputs.controller_only }}
    uses: ./.github/workflows/release-preflight.yml
  host-policy:
    name: Select native hosts
    uses: ./.github/workflows/host-policy.yml

  engine-fixtures:
    name: Qualify native engine fixtures
    needs: qualification
    if: ${{ always() && !cancelled() && needs.qualification.result == 'success' && inputs.engine_only && !inputs.controller_only }}
    uses: ./.github/workflows/release-native.yml

  runners:
    name: Qualify runner components
    needs: qualification
    if: ${{ !inputs.controller_only && !inputs.engine_only }}
    uses: ./.github/workflows/runner-release.yml
    with:
      retain_diagnostic: ${{ inputs.controller_only || inputs.retain_diagnostic }}
      previous_revision: ${{ inputs.previous_revision }}
      previous_artifact_run: ${{ inputs.previous_artifact_run }}
      legacy_artifact_run: ${{ inputs.legacy_artifact_run }}
      manager_only_update: ${{ inputs.manager_only_update }}
      preflight_revision: ${{ needs.qualification.outputs.qualified_revision }}
      manifest_schema: ${{ needs.qualification.outputs.release_schema }}
      publish: ${{ startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: read
      actions: read
      packages: write

  build:
    name: Build engine (${{ matrix.target }})
    needs: [qualification, host-policy]
    if: ${{ !inputs.controller_only }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.host-policy.outputs.matrix) }}
    defaults:
      run:
        working-directory: elixir

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise tools
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: true
          cache: true
          working_directory: elixir

      - name: Install Zig
        run: mise install zig@0.15.2

      - name: Install Linux archive utility
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xz-utils
      - name: Verify macOS archive utility
        if: runner.os == 'macOS'
        run: command -v xz || brew install xz

      - name: Install Mix dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Verify release tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 ../scripts/release/manager_version.py --validate-tag "$GITHUB_REF_NAME"

      - name: Build Burrito executable
        run: BURRITO_TARGET=${{ matrix.target }} MIX_ENV=prod mise exec zig@0.15.2 -- mix release symphony --overwrite

      - name: Stage release assets
        run: |
          if test "$GITHUB_REF_TYPE" = "tag"; then
            version="$GITHUB_REF_NAME"
          else
            version="${GITHUB_SHA::7}"
          fi

          artifact="symphony-${version}-${{ matrix.target }}"
          mkdir -p dist
          cp "burrito_out/symphony_${{ matrix.target }}" "dist/$artifact"
          cd dist

          shasum -a 256 "$artifact" > "$artifact.sha256"
          python3 - "$artifact" "$GITHUB_SHA" "${{ matrix.target }}" <<'PYTHON'
          import hashlib, json, pathlib, sys
          artifact = pathlib.Path(sys.argv[1])
          metadata = {"artifact": artifact.name, "sha256": hashlib.sha256(artifact.read_bytes()).hexdigest(),
                      "source_revision": sys.argv[2], "target": sys.argv[3]}
          artifact.with_name(artifact.name + ".source.json").write_text(json.dumps(metadata, sort_keys=True) + "\n")
          PYTHON

      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: elixir/dist/*
          if-no-files-found: error

  smoke:
    name: Verify engine (${{ matrix.target }})
    needs: [build, host-policy]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.host-policy.outputs.matrix) }}

    steps:
      - name: Checkout the exact candidate controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.target }}
          path: dist

      - name: Install Linux test controller utility
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y lsof

      - name: Qualify actual standalone engine
        run: |
          if test "$GITHUB_REF_TYPE" = "tag"; then
            version="$GITHUB_REF_NAME"
          else
            version="${GITHUB_SHA::7}"
          fi
          python3 scripts/release/engine-smoke.py "dist/symphony-$version-${{ matrix.target }}" \
            --source-revision "$GITHUB_SHA" --target "${{ matrix.target }}" \
            --evidence-dir "$RUNNER_TEMP/engine-evidence-${{ matrix.target }}"

      - name: Retain native qualification evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-evidence-${{ matrix.target }}
          path: ${{ runner.temp }}/engine-evidence-${{ matrix.target }}/
          if-no-files-found: warn

  controller-diagnostics:
    name: Diagnose release controller
    if: inputs.controller_only
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - name: Checkout the exact candidate controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Record controller platform and run isolated process fixtures
        run: |
          uname -sm
          python3 -VV
          python3 -m unittest discover -s scripts/release/tests -p test_engine_smoke.py -v

  release:
    name: Publish approved engine release
    if: ${{ !inputs.engine_only && !inputs.controller_only && startsWith(github.ref, 'refs/tags/v') && vars.SYMPHONY_PRODUCTION_RELEASES == 'enabled' }}
    needs: [build, smoke, runners]
    environment: production-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download linux_x86_64
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux_x86_64
          path: dist/linux_x86_64

      - name: Download macos_arm64
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos_arm64
          path: dist/macos_arm64

      - name: Download packaged-release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packaged-release
          path: dist/packaged-release

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true || { echo "Refusing to alter a completed release." >&2; exit 1; }
          else
            gh release create "$TAG" --draft --verify-tag --generate-notes
          fi
          gh release upload "$TAG" dist/linux_*/* dist/macos_*/* dist/packaged-release/* --clobber
          gh release edit "$TAG" --draft=false --prerelease=false --latest
