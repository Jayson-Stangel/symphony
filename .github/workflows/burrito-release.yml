name: Engine release

on:
  # Manual feature-ref runs build and qualify candidates without production publication.
  workflow_dispatch:
    inputs:
      packaged_host_revision:
        description: Exact operator-approved 40-hex source revision; required only when host preparation is enabled
        type: string
        default: ''
      packaged_host_preparation:
        description: Explicit reviewed native host preparation on an isolated owner manual run
        type: boolean
        default: false
      production_prepare:
        description: Prepare exact main production-reference packages without publication
        type: boolean
        default: false
      baseline_run:
        description: Exact explicitly authorized original native-record run for nonpublishing manual composition
        type: string
        default: ''
      previous_artifact_run:
        description: Exact qualified current-manager package run for download-only installed update tests
        type: string
        default: ''
      legacy_artifact_run:
        description: Exact old schema1 run retained across bridge and schema2 updates
        type: string
        default: ''
      manager_only_update:
        description: Require unchanged components and test actual manager-only update/rollback
        type: boolean
        default: false
      previous_revision:
        description: Optional full prior Linux-capable source for actual two-revision package lifecycle
        type: string
        default: ''
      retain_diagnostic:
        description: Preserve this explicitly requested full candidate across new commits
        type: boolean
        default: false
      engine_only:
        description: Qualify only the two native standalone engines; omit runner images and publication
        type: boolean
        default: false
      controller_only:
        description: Run only isolated controller fixtures on native macOS ARM64 (no artifacts or publication)
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  statuses: read

concurrency:
  group: engine-candidate-${{ github.event_name }}-${{ github.ref }}-${{ (inputs.controller_only || inputs.retain_diagnostic) && github.run_id || 'latest' }}
  cancel-in-progress: ${{ !inputs.controller_only && !inputs.retain_diagnostic && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  production-source:
    name: Verify production preparation source
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Require approved packaged host preparation revision
        if: inputs.packaged_host_preparation
        env:
          PACKAGED_HOST_PREPARATION: ${{ inputs.packaged_host_preparation }}
          PACKAGED_HOST_REVISION: ${{ inputs.packaged_host_revision }}
        run: |
          test "$PACKAGED_HOST_PREPARATION" = true
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = Jayson-Stangel/symphony
          test "$GITHUB_ACTOR" = Jayson-Stangel
          test "$GITHUB_TRIGGERING_ACTOR" = Jayson-Stangel
          [[ "$PACKAGED_HOST_REVISION" =~ ^[a-f0-9]{40}$ ]]
          test "$PACKAGED_HOST_REVISION" = "$GITHUB_SHA"
      - name: Require manual main preparation
        env:
          PACKAGED_HOST_PREPARATION: ${{ inputs.packaged_host_preparation }}
          PACKAGED_HOST_REVISION: ${{ inputs.packaged_host_revision }}
          PREPARE: ${{ inputs.production_prepare }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          ENGINE_ONLY: ${{ inputs.engine_only }}
          CONTROLLER_ONLY: ${{ inputs.controller_only }}
        run: |
          test "$EVENT" = workflow_dispatch
          if [ "$ENGINE_ONLY" != true ] && [ "$CONTROLLER_ONLY" != true ]; then
            test "$PACKAGED_HOST_PREPARATION" = true || { echo 'Selected installed/package qualification requires explicit reviewed host preparation consent.' >&2; exit 1; }
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            test "$GITHUB_REPOSITORY" = Jayson-Stangel/symphony
            test "$GITHUB_ACTOR" = Jayson-Stangel
            test "$GITHUB_TRIGGERING_ACTOR" = Jayson-Stangel
          fi
          if [ "$PREPARE" = true ]; then
            test "$REF" = refs/heads/main
            test "$ENGINE_ONLY" != true
            test "$CONTROLLER_ONLY" != true
          fi

  qualification:
    name: Validate preflight inputs
    needs: production-source
    if: ${{ !inputs.controller_only && github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/release-preflight.yml
  host-policy:
    name: Select native hosts
    needs: production-source
    if: ${{ !inputs.controller_only && github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/host-policy.yml

  runners:
    name: Qualify runner components
    needs: qualification
    if: ${{ !inputs.controller_only && !inputs.engine_only && github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/runner-release.yml
    with:
      packaged_host_preparation: ${{ inputs.packaged_host_preparation }}
      packaged_host_revision: ${{ inputs.packaged_host_revision }}
      baseline_run: ${{ inputs.baseline_run }}
      retain_diagnostic: ${{ inputs.controller_only || inputs.retain_diagnostic }}
      previous_revision: ${{ inputs.previous_revision }}
      previous_artifact_run: ${{ inputs.previous_artifact_run }}
      legacy_artifact_run: ${{ inputs.legacy_artifact_run }}
      manager_only_update: ${{ inputs.manager_only_update }}
      preflight_revision: ${{ needs.qualification.outputs.qualified_revision }}
      manifest_schema: ${{ needs.qualification.outputs.release_schema }}
      publish: false
      prepare_release: ${{ inputs.production_prepare }}
    permissions:
      contents: read
      actions: read
      statuses: read

  build:
    name: Verify engine (${{ matrix.target }})
    needs: [qualification, host-policy, mac-runner-build]
    if: ${{ !inputs.controller_only && github.event_name == 'workflow_dispatch' && needs.mac-runner-build.result == 'success' }}
    runs-on: ${{ matrix.platform == 'macos' && needs.mac-runner-build.outputs.runner || matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.host-policy.outputs.matrix) }}
    defaults:
      run:
        working-directory: elixir

    steps:
      - name: Require actual native Mac prerequisites
        working-directory: ${{ runner.temp }}
        if: matrix.platform == 'macos'
        env:
          BACKUP_MAC_SELECTED: ${{ needs.mac-runner-build.outputs.runner != 'macos-14' }}
        run: |
          test "$(uname -s)/$(uname -m)" = Darwin/arm64
          python3 -c 'import sys; assert sys.version_info >= (3, 11), "native Mac checks require Python 3.11+"'
          if [ "$BACKUP_MAC_SELECTED" = true ]; then
            case "$(sw_vers -productVersion)" in 14.*) ;; *) echo 'Backup guest must be macOS 14' >&2; exit 1 ;; esac
          fi
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up mise tools
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: true
          cache: true
          working_directory: elixir

      - name: Install Zig
        run: mise install zig@0.15.2

      - name: Install Linux archive and controller utilities
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xz-utils lsof
      - name: Verify macOS archive utility
        if: runner.os == 'macOS'
        run: command -v xz || brew install xz

      - name: Retain engine-only native controller coverage in this allocation
        if: inputs.engine_only
        working-directory: ${{ github.workspace }}
        run: python3 scripts/ci/release_tests.py native

      - name: Install Mix dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Verify release tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 ../scripts/release/manager_version.py --validate-tag "$GITHUB_REF_NAME"

      - name: Build Burrito executable
        run: BURRITO_TARGET=${{ matrix.target }} MIX_ENV=prod mise exec zig@0.15.2 -- mix release symphony --overwrite

      - name: Stage release assets
        env:
          PRODUCTION_PREPARE: ${{ inputs.production_prepare }}
        run: |
          if test "$GITHUB_REF_TYPE" = "tag" || test "${PRODUCTION_PREPARE:-false}" = true; then
            version="v$(python3 ../scripts/release/manager_version.py)"
          else
            version="${GITHUB_SHA::7}"
          fi

          artifact="symphony-${version}-${{ matrix.target }}"
          mkdir -p dist
          cp "burrito_out/symphony_${{ matrix.target }}" "dist/$artifact"
          cd dist

          shasum -a 256 "$artifact" > "$artifact.sha256"
          python3 - "$artifact" "$GITHUB_SHA" "${{ matrix.target }}" <<'PYTHON'
          import hashlib, json, pathlib, sys
          artifact = pathlib.Path(sys.argv[1])
          metadata = {"artifact": artifact.name, "sha256": hashlib.sha256(artifact.read_bytes()).hexdigest(),
                      "source_revision": sys.argv[2], "target": sys.argv[3]}
          artifact.with_name(artifact.name + ".source.json").write_text(json.dumps(metadata, sort_keys=True) + "\n")
          PYTHON

      - name: Qualify actual standalone engine
        working-directory: ${{ github.workspace }}
        env:
          PRODUCTION_PREPARE: ${{ inputs.production_prepare }}
        run: |
          if test "$GITHUB_REF_TYPE" = "tag" || test "${PRODUCTION_PREPARE:-false}" = true; then
            version="v$(python3 scripts/release/manager_version.py)"
          else
            version="${GITHUB_SHA::7}"
          fi
          python3 scripts/release/engine-smoke.py "elixir/dist/symphony-$version-${{ matrix.target }}" \
            --source-revision "$GITHUB_SHA" --target "${{ matrix.target }}" \
            --evidence-dir "$RUNNER_TEMP/engine-evidence-${{ matrix.target }}"

      - name: Retain native qualification evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-evidence-${{ matrix.target }}
          path: ${{ runner.temp }}/engine-evidence-${{ matrix.target }}/
          if-no-files-found: warn

      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: elixir/dist/*
          if-no-files-found: error

  controller-diagnostics:
    name: Diagnose release controller
    if: ${{ inputs.controller_only && needs.mac-runner-controller-diagnostics.result == 'success' }}
    needs: mac-runner-controller-diagnostics
    runs-on: ${{ needs.mac-runner-controller-diagnostics.outputs.runner }}
    timeout-minutes: 10
    steps:
      - name: Require actual native Mac prerequisites
        working-directory: ${{ runner.temp }}
        env:
          BACKUP_MAC_SELECTED: ${{ needs.mac-runner-controller-diagnostics.outputs.runner != 'macos-14' }}
        run: |
          test "$(uname -s)/$(uname -m)" = Darwin/arm64
          python3 -c 'import sys; assert sys.version_info >= (3, 11), "native Mac checks require Python 3.11+"'
          if [ "$BACKUP_MAC_SELECTED" = true ]; then
            case "$(sw_vers -productVersion)" in 14.*) ;; *) echo 'Backup guest must be macOS 14' >&2; exit 1 ;; esac
          fi
      - name: Checkout the exact candidate controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Record controller platform and run isolated process fixtures
        run: |
          uname -sm
          python3 -VV
          python3 -m unittest discover -s scripts/release/tests -p test_engine_smoke.py -v

  mac-runner-build:
    name: Select owned Mac first for build
    needs: [qualification, host-policy]
    if: ${{ always() && !cancelled() && needs.qualification.result == 'success' && needs.host-policy.result == 'success' && !inputs.controller_only && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    outputs:
      runner: ${{ steps.selected.outputs.runner }}
    steps:
      - name: Check out source for owned-first capacity selection
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prove actual workflow-token capacity read before host preparation
        id: capacity-probe
        env:
          SELECT_TARGET_REQUESTED: ${{ !inputs.controller_only && github.event_name == 'workflow_dispatch' }}
          GH_TOKEN: ${{ github.token }}
          SELECT_WORKFLOW_PATH: .github/workflows/burrito-release.yml
          SELECT_JOB_KEY: build
        run: python3 scripts/ci/mac_runner_request.py --probe >> "$GITHUB_OUTPUT"
      - name: Prefer prepared owned capacity; report pre-execution fallback
        id: selected
        env:
          SELECT_TARGET_REQUESTED: ${{ !inputs.controller_only && github.event_name == 'workflow_dispatch' }}
          GH_TOKEN: ${{ github.token }}
          BACKUP_MAC_PERMIT: ${{ vars.SYMPHONY_BACKUP_MAC_PERMIT }}
          SELECT_WORKFLOW_PATH: .github/workflows/burrito-release.yml
          SELECT_JOB_KEY: build
        run: python3 scripts/ci/mac_runner_request.py >> "$GITHUB_OUTPUT"

  mac-runner-controller-diagnostics:
    name: Select owned Mac first for controller diagnostics
    needs: production-source
    if: ${{ always() && !cancelled() && needs.production-source.result == 'success' && inputs.controller_only && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    outputs:
      runner: ${{ steps.selected.outputs.runner }}
    steps:
      - name: Check out source for owned-first capacity selection
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prove actual workflow-token capacity read before host preparation
        id: capacity-probe
        env:
          SELECT_TARGET_REQUESTED: ${{ inputs.controller_only }}
          GH_TOKEN: ${{ github.token }}
          SELECT_WORKFLOW_PATH: .github/workflows/burrito-release.yml
          SELECT_JOB_KEY: controller-diagnostics
        run: python3 scripts/ci/mac_runner_request.py --probe >> "$GITHUB_OUTPUT"
      - name: Prefer prepared owned capacity; report pre-execution fallback
        id: selected
        env:
          SELECT_TARGET_REQUESTED: ${{ inputs.controller_only }}
          GH_TOKEN: ${{ github.token }}
          BACKUP_MAC_PERMIT: ${{ vars.SYMPHONY_BACKUP_MAC_PERMIT }}
          SELECT_WORKFLOW_PATH: .github/workflows/burrito-release.yml
          SELECT_JOB_KEY: controller-diagnostics
        run: python3 scripts/ci/mac_runner_request.py >> "$GITHUB_OUTPUT"
