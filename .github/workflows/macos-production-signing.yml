name: Sign production macOS distribution
on:
  workflow_dispatch:
    inputs:
      approved_revision:
        description: Exact promoted main source approved for this Apple submission
        required: true
        type: string
      qualified_run:
        description: Successful full production preparation run on the same source
        required: true
        type: string
      qualified_attempt:
        description: Exact successful preparation attempt
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: macos-production-signing
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  sign:
    name: Sign exact production preparation
    if: github.repository == 'Jayson-Stangel/symphony' && github.ref == 'refs/heads/main' && inputs.approved_revision == github.sha
    environment: macos-production-signing
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - name: Check out exact approved source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Import immutable completed preparation before credentials are consumed
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFIED_RUN: ${{ inputs.qualified_run }}
          QUALIFIED_ATTEMPT: ${{ inputs.qualified_attempt }}
        run: |
          python3 scripts/release/production_release.py source
          python3 scripts/release/production_release.py qualify "$QUALIFIED_RUN" "$QUALIFIED_ATTEMPT" "$RUNNER_TEMP/production-inputs"
      - name: Reuse established signing and Apple acceptance controller
        env:
          GH_TOKEN: ${{ github.token }}
          MACOS_SIGNING_P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_APP_PASSWORD: ${{ secrets.MACOS_NOTARY_APP_PASSWORD }}
          MACOS_SIGNING_IDENTITY_SHA1: ${{ vars.MACOS_SIGNING_IDENTITY_SHA1 }}
          MACOS_TEAM_ID: ${{ vars.MACOS_TEAM_ID }}
        run: |
          python3 scripts/release/production_release.py source
          python3 scripts/release/macos_distribution.py build "$RUNNER_TEMP/production-inputs/internal/release.json" "$RUNNER_TEMP/production-inputs/helper/symphony-host" "$RUNNER_TEMP/production-signed" --qualified-package "$RUNNER_TEMP"/production-inputs/packages/*-macos.tar.gz --authorize-apple-upload
      - name: Preserve Linux and seal final distribution and updater hashes
        run: python3 scripts/release/production_release.py seal "$RUNNER_TEMP/production-inputs" "$RUNNER_TEMP/production-signed"
      - name: Retain final assessed bytes for independent native acceptance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-signed-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/production-signed/
          if-no-files-found: error
      - name: Retain sanitized refusal evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-signing-refused-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/production-signed/evidence/*.json
          if-no-files-found: ignore
      - name: Retain exact private signing checkpoint after failure or cancellation
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-signing-checkpoint-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/production-signed.checkpoint/checkpoint.json
            ${{ runner.temp }}/production-signed.checkpoint/signed-updater.tar.gz
            ${{ runner.temp }}/production-signed.checkpoint/payload.zip
          if-no-files-found: ignore
