name: runner-release

on:
  workflow_call:
    inputs:
      baseline_run:
        description: Exact manually authorized record run; rejected outside workflow_dispatch
        type: string
        default: ''
      manifest_schema:
        description: Candidate metadata schema; independent components use schema 2
        type: string
        default: '1'
      compose_packages:
        description: Assemble native manager packages in this producer (ordinary integration composes separately)
        type: boolean
        default: true
      publish:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      resume_native_run:
        description: Recover small records only from this original manual native run with the known downstream sealing failure
        type: string
        default: ''
      baseline_run:
        description: Exact authorized manual native candidate run (empty uses verified fork history)
        type: string
        default: ''
      manifest_schema:
        description: Candidate schema (1 bridge with same-source runners, 2 independent components)
        type: choice
        options: ['1', '2']
        default: '1'
      cache_probe:
        description: Only run bounded native cold/warm/changed-input cache qualification
        type: boolean
        default: false
      cache_probe_restore:
        description: Skip cold build and import the previous completed probe run from a fresh builder
        type: boolean
        default: false
      previous_revision:
        description: Full prior Linux-capable candidate source SHA for real two-revision package lifecycle
        type: string
        required: false
      diagnostic_artifact_run:
        description: Diagnostic only; reuse this completed runner-release run instead of building
        type: string
        required: false
      diagnostic_package_source_revision:
        description: Exact package source SHA in the diagnostic artifact run
        type: string
        required: false

permissions:
  contents: read
  actions: read

jobs:
  component-plan:
    if: ${{ !inputs.cache_probe && inputs.resume_native_run == '' && inputs.diagnostic_artifact_run == '' }}
    runs-on: ubuntu-24.04
    outputs:
      has_builds: ${{ steps.plan.outputs.has_builds }}
      build_matrix: ${{ steps.plan.outputs.build_matrix }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_RUN: ${{ inputs.baseline_run }}
          PREVIOUS_REVISION: ${{ inputs.previous_revision }}
        run: |
          test -z "$PREVIOUS_REVISION" || { echo 'Independent prior package composition is not yet integrated; refusing incomplete candidate.' >&2; exit 1; }
          args=()
          if [ -n "$BASELINE_RUN" ]; then args+=(--baseline-run "$BASELINE_RUN"); fi
          python3 scripts/release/runner_reuse.py --root . --output component-plan.json "${args[@]}"
          python3 - <<'PYCODE'
          import json, os
          plan = json.load(open('component-plan.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('has_builds=' + str(plan['has_builds']).lower() + '\n')
              output.write('build_matrix=' + json.dumps(plan['build_matrix'], separators=(',', ':')) + '\n')
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runner-component-plan
          path: component-plan.json
          retention-days: 30
  candidate:
    needs: component-plan
    if: ${{ !inputs.cache_probe && inputs.resume_native_run == '' && inputs.diagnostic_artifact_run == '' && needs.component-plan.outputs.has_builds == 'true' }}
    name: runner-${{ matrix.provider }}-${{ matrix.architecture }}
    runs-on: ${{ matrix.native_runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.component-plan.outputs.build_matrix) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Verify release version and run metadata tests
        run: |
          python3 -m unittest discover -s scripts/release/tests -v
          version=$(sed -nE 's/^[[:space:]]*version: "([^"]+)",$/\1/p' elixir/mix.exs | head -n1)
          if [ "$GITHUB_REF_TYPE" = tag ]; then test "$GITHUB_REF_NAME" = "v$(python3 scripts/release/manager_version.py)"; fi
          printf 'VERSION=%s\n' "$version" >> "$GITHUB_ENV"
      - name: Capture committed effective build inputs
        env:
          PROVIDER: ${{ matrix.provider }}
          ARCHITECTURE: ${{ matrix.architecture }}
          EXPECTED_IDENTITY: ${{ matrix.input_identity }}
        run: |
          python3 scripts/release/runner_inputs.py --provider "$PROVIDER" --architecture "$ARCHITECTURE" --output "$RUNNER_TEMP/component-inputs.json"
          test "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["input_identity"])' "$RUNNER_TEMP/component-inputs.json")" = "$EXPECTED_IDENTITY"
      - name: Build exact native candidate with reusable dependency layers
        uses: ./.github/actions/build-runner
        with:
          target: ${{ matrix.provider }}
          tags: localhost:5000/symphony-${{ matrix.provider }}:candidate
          version: ${{ env.VERSION }}
          revision: ${{ github.sha }}
          input-identity: ${{ matrix.input_identity }}
      - name: Build exact runner and test a digest pull from an isolated registry
        env:
          PROVIDER: ${{ matrix.provider }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          mkdir -p dist
          python3 scripts/release/test_registry.py start "$RUNNER_TEMP/native-registry.json"
          image="localhost:5000/symphony-$PROVIDER:candidate"
          docker push "$image"
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$image")
          docker image rm "$image"
          if docker image inspect "$digest" >/dev/null 2>&1; then docker image rm "$digest"; fi
          if docker image inspect "$digest" >/dev/null 2>&1; then echo "Selected image is still cached; refusing false pull proof." >&2; exit 1; fi
          docker pull "$digest"
          bash scripts/release/runner-smoke.sh "$digest" "$PROVIDER" "$ARCHITECTURE" "$GITHUB_SHA"
          python3 scripts/release/record.py --image "$digest" --provider "$PROVIDER" \
            --architecture "$ARCHITECTURE" --revision "$GITHUB_SHA" --inputs "$RUNNER_TEMP/component-inputs.json" \
            --output "dist/$PROVIDER-$ARCHITECTURE.json"
          docker tag "$digest" "$image"
          docker save "$image" | gzip > "dist/$PROVIDER-$ARCHITECTURE.docker.tar.gz"
          (cd dist && sha256sum ./*.docker.tar.gz > "$PROVIDER-$ARCHITECTURE.sha256")
          registry=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["container_id"])' "$RUNNER_TEMP/native-registry.json")
          docker logs "$registry" > "dist/$PROVIDER-$ARCHITECTURE.registry.log" 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: payload
        with:
          name: runner-candidate-${{ matrix.provider }}-${{ matrix.architecture }}
          path: |
            dist/*.docker.tar.gz
            dist/*.sha256
            dist/*.registry.log
          if-no-files-found: error
          retention-days: 30
      - name: Seal original native record against immutable uploaded payload
        env:
          GH_TOKEN: ${{ github.token }}
          PROVIDER: ${{ matrix.provider }}
          ARCHITECTURE: ${{ matrix.architecture }}
          ARTIFACT_ID: ${{ steps.payload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.payload.outputs.artifact-digest }}
        run: |
          python3 scripts/release/component_provenance.py seal --record "dist/$PROVIDER-$ARCHITECTURE.json" \
            --archive "dist/$PROVIDER-$ARCHITECTURE.docker.tar.gz" --archive-name "$PROVIDER-$ARCHITECTURE.docker.tar.gz" \
            --record-name "$PROVIDER-$ARCHITECTURE.json" --artifact-id "$ARTIFACT_ID" --artifact-digest "$ARTIFACT_DIGEST" \
            --job-name "runner-$PROVIDER-$ARCHITECTURE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runner-records-${{ matrix.provider }}-${{ matrix.architecture }}
          path: dist/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove only the qualification registry owned by this job
        if: always()
        run: python3 scripts/release/test_registry.py cleanup "$RUNNER_TEMP/native-registry.json"
      - name: Retain registry cleanup evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runner-native-cleanup-${{ matrix.provider }}-${{ matrix.architecture }}
          path: ${{ runner.temp }}/native-registry.json
          if-no-files-found: error
          retention-days: 30

  publication-preflight:
    if: inputs.publish && startsWith(github.ref, 'refs/tags/v') && vars.SYMPHONY_PRODUCTION_RELEASES == 'enabled'
    needs: [component-plan, candidate-metadata]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: runner-component-plan
      - name: Refuse unsupported mixed-component publication before any image push
        env:
          MANIFEST_SCHEMA: ${{ inputs.manifest_schema || '1' }}
          COMPOSE_PACKAGES: ${{ inputs.compose_packages || github.event_name == 'workflow_dispatch' }}
        run: |
          test "$COMPOSE_PACKAGES" = true
          python3 - <<'PYCODE'
          import json, os
          plan = json.load(open('component-plan.json'))
          assert os.environ['MANIFEST_SCHEMA'] == '1', 'independent-component production publication requires integrated lifecycle qualification'
          assert all(item['action'] == 'build' for group in plan['components'].values() for item in group.values()), 'mixed/reused production image publication is not qualified'
          PYCODE

  publish:
    if: inputs.publish && startsWith(github.ref, 'refs/tags/v') && vars.SYMPHONY_PRODUCTION_RELEASES == 'enabled'
    needs: [candidate, publication-preflight]
    environment: production-release
    permissions:
      contents: read
      packages: write
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        provider: [codex, claude]
        architecture: [arm64, x86_64]
        include:
          - architecture: arm64
            runner: ubuntu-24.04-arm
          - architecture: x86_64
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: runner-candidate-${{ matrix.provider }}-${{ matrix.architecture }}
          path: candidate
      - name: Publish tested image and verify anonymous digest pull
        env:
          GH_TOKEN: ${{ github.token }}
          PROVIDER: ${{ matrix.provider }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          (cd candidate && sha256sum --check ./*.sha256)
          gzip -dc "candidate/$PROVIDER-$ARCHITECTURE.docker.tar.gz" | docker load
          repository="ghcr.io/${GITHUB_REPOSITORY,,}-$PROVIDER"
          image="$repository:$GITHUB_REF_NAME-$ARCHITECTURE"
          docker tag "localhost:5000/symphony-$PROVIDER:candidate" "$image"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$image"
          digest=$(docker image inspect --format '{{join .RepoDigests "\n"}}' "$image" | grep -F "$repository@sha256:")
          docker logout ghcr.io
          docker image rm "$image" "localhost:5000/symphony-$PROVIDER:candidate"
          if docker image inspect "$digest" >/dev/null 2>&1; then docker image rm "$digest"; fi
          if docker image inspect "$digest" >/dev/null 2>&1; then echo "Selected image is still cached; refusing false pull proof." >&2; exit 1; fi
          docker pull "$digest"
          bash scripts/release/runner-smoke.sh "$digest" "$PROVIDER" "$ARCHITECTURE" "$GITHUB_SHA"
          mkdir -p dist
          python3 scripts/release/record.py --image "$digest" --provider "$PROVIDER" \
            --architecture "$ARCHITECTURE" --revision "$GITHUB_SHA" --output "dist/$PROVIDER-$ARCHITECTURE.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runner-stable-${{ matrix.provider }}-${{ matrix.architecture }}
          path: dist/*.json
          if-no-files-found: error

  candidate-metadata:
    needs: [component-plan, candidate]
    if: ${{ always() && !inputs.cache_probe && inputs.resume_native_run == '' && inputs.diagnostic_artifact_run == '' && needs.component-plan.result == 'success' && (needs.candidate.result == 'success' || needs.candidate.result == 'skipped') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: runner-component-plan
          path: plan
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.component-plan.outputs.has_builds == 'true'
        with:
          pattern: runner-records-*
          path: candidate
          merge-multiple: true
      - name: Join exact planned native components without exporting reused payloads
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST_SCHEMA: ${{ inputs.manifest_schema || '1' }}
          BASELINE_RUN: ${{ inputs.baseline_run }}
        run: |
          args=()
          if [ -n "$BASELINE_RUN" ]; then args+=(--baseline-run "$BASELINE_RUN"); fi
          python3 scripts/release/component_join.py --plan plan/component-plan.json --records candidate --output dist \
            --schema "$MANIFEST_SCHEMA" "${args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runner-candidate-metadata
          path: dist/*

  packaged-release-platform:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-14
          - platform: linux_x86_64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    environment: production-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: runner-stable-*
          path: records
          merge-multiple: true
      - name: Assemble native manager archive from tested stable image identities
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          test -f scripts/release/package.sh || { echo 'Packaged manager prerequisite is not integrated; refusing incomplete stable release.' >&2; exit 1; }
          version=$(python3 scripts/release/manager_version.py)
          mkdir -p dist
          python3 scripts/release/artifacts.py assemble --version "$version" --revision "$GITHUB_SHA" \
            --channel stable --platform-bundles --output "$RUNNER_TEMP/release.json" records/*.json
          if [ "$PLATFORM" = macos ]; then bash scripts/release/build-host-helper.sh "$RUNNER_TEMP/symphony-host"
          else bash scripts/release/build-linux-host-helper.sh "$RUNNER_TEMP/linux-helper"; cp "$RUNNER_TEMP/linux-helper/symphony-host" "$RUNNER_TEMP/symphony-host"; fi
          bash scripts/release/package.sh "$RUNNER_TEMP/release.json" dist "$RUNNER_TEMP/symphony-host"
      - uses: actions/upload-artifact@v4
        with:
          name: packaged-release-platform-${{ matrix.platform }}
          path: dist/*.tar.gz
          if-no-files-found: error

  packaged-release:
    needs: packaged-release-platform
    runs-on: ubuntu-24.04
    environment: production-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: runner-stable-*
          path: records
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: packaged-release-platform-*
          path: dist
          merge-multiple: true
      - name: Bind matching Linux and legacy macOS manager archives
        run: |
          version=$(python3 scripts/release/manager_version.py)
          python3 scripts/release/artifacts.py assemble --version "$version" --revision "$GITHUB_SHA" \
            --channel stable --bundle "dist/symphony-$version-macos.tar.gz" \
            --linux-bundle "dist/symphony-$version-linux_x86_64.tar.gz" --output dist/release.json records/*.json
          python3 scripts/release/artifacts.py validate dist/release.json
          (cd dist && sha256sum ./*.tar.gz ./release.json > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: packaged-release
          path: dist/*
          if-no-files-found: error

  cache-probe:
    if: inputs.cache_probe && inputs.resume_native_run == '' && github.event_name == 'workflow_dispatch'
    name: cache-probe-${{ matrix.provider }}-${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        provider: [codex, claude]
        architecture: [arm64, x86_64]
        include:
          - architecture: arm64
            runner: ubuntu-24.04-arm
          - architecture: x86_64
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Prepare isolated registry and evidence
        id: registry
        run: |
          mkdir -p "$RUNNER_TEMP/runner-cache-measurements"
          id=$(docker run -d --label "com.symphony.cache-probe=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" -p 127.0.0.1:5000:5000 registry:3)
          printf 'id=%s\n' "$id" >> "$GITHUB_OUTPUT"
      - name: Actual cold native image
        if: ${{ !inputs.cache_probe_restore }}
        uses: ./.github/actions/build-runner
        with:
          target: ${{ matrix.provider }}
          tags: localhost:5000/symphony-${{ matrix.provider }}:cache-probe
          revision: ${{ github.sha }}
          no-cache: 'true'
          evidence-name: cold
      - name: Qualify cold image and measure transfer
        if: ${{ !inputs.cache_probe_restore }}
        env:
          PROVIDER: ${{ matrix.provider }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: python3 scripts/release/runner-cache-probe.py cold
      - name: Commit real packaging-only source change
        id: warm-source
        run: |
          printf 'Nonpublishing native cache probe at %s.\n' "$GITHUB_SHA" > docs/cache-probe-marker.txt
          git add docs/cache-probe-marker.txt
          git -c user.name=CacheProbe -c user.email=cache-probe@example.invalid commit -m 'Cache probe packaging-only revision'
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Actual warm image at a new source revision
        uses: ./.github/actions/build-runner
        with:
          target: ${{ matrix.provider }}
          tags: localhost:5000/symphony-${{ matrix.provider }}:cache-probe
          revision: ${{ steps.warm-source.outputs.revision }}
          evidence-name: warm
      - name: Qualify warm image and measure transfer
        env:
          PROVIDER: ${{ matrix.provider }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: python3 scripts/release/runner-cache-probe.py warm
      - name: Commit actual dependency-build recipe change
        id: changed-source
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          path = Path('runner/Dockerfile')
          source = path.read_text()
          before = '  && npm cache clean --force\nCOPY runner/browser/smoke.cjs'
          after = '  && npm cache clean --force && git --version\nCOPY runner/browser/smoke.cjs'
          assert source.count(before) == 1
          path.write_text(source.replace(before, after))
          PYCODE
          git add runner/Dockerfile
          git -c user.name=CacheProbe -c user.email=cache-probe@example.invalid commit -m 'Cache probe changes effective dependency build recipe'
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Actual invalidated dependency build
        uses: ./.github/actions/build-runner
        with:
          target: ${{ matrix.provider }}
          tags: localhost:5000/symphony-${{ matrix.provider }}:cache-probe
          revision: ${{ steps.changed-source.outputs.revision }}
          evidence-name: changed
          cache-variant: changed
          export-cache: 'false'
      - name: Qualify changed-input image and measure transfer
        env:
          PROVIDER: ${{ matrix.provider }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: python3 scripts/release/runner-cache-probe.py changed
      - name: Retain native build and transfer measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runner-cache-${{ matrix.provider }}-${{ matrix.architecture }}-${{ github.sha }}
          path: ${{ runner.temp }}/runner-cache-measurements/**
          if-no-files-found: error
          retention-days: 30
      - name: Remove test-owned registry
        if: ${{ always() && steps.registry.outputs.id != '' }}
        env:
          REGISTRY_ID: ${{ steps.registry.outputs.id }}
        run: |
          test "$(docker inspect --format '{{index .Config.Labels "com.symphony.cache-probe"}}' "$REGISTRY_ID")" = "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker rm -f "$REGISTRY_ID"
  packaged-candidate:
    if: inputs.compose_packages || github.event_name == 'workflow_dispatch'
    needs: candidate-metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-14
          - platform: linux_x86_64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: runner-candidate-metadata
          path: metadata
      - name: Build source-bound native candidate archives
        env:
          PREVIOUS_REVISION: ${{ inputs.previous_revision }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          for selection in current previous; do
            source=$PWD; manifest="$PWD/metadata/release.json"; destination="$PWD/dist"; revision=$GITHUB_SHA
            if [ "$selection" = previous ]; then
              [ -n "$PREVIOUS_REVISION" ] || continue
              source="$RUNNER_TEMP/previous-package"
              bash scripts/release/prepare-candidate-source.sh "$PREVIOUS_REVISION" "$source"
              manifest="$PWD/metadata/previous/release.json"; destination="$PWD/dist/previous"; revision=$PREVIOUS_REVISION
            fi
            mkdir -p "$destination"
            helper="$destination/symphony-host"
            if [ "$PLATFORM" = macos ]; then bash "$source/scripts/release/build-host-helper.sh" "$helper"
            else bash scripts/release/build-linux-host-helper.sh "$destination" "$source" "$revision"; fi
            bash "$source/scripts/release/package.sh" "$manifest" "$destination" "$helper"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: packaged-candidate-${{ matrix.platform }}
          path: dist/**
          if-no-files-found: error
          retention-days: 30

  packaged-candidate-metadata:
    needs: packaged-candidate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: packaged-candidate-*
          path: packages
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: runner-records-*
          path: records
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: runner-candidate-metadata
          path: records
      - name: Bind both platform archives without changing the legacy macOS contract
        env:
          PREVIOUS_REVISION: ${{ inputs.previous_revision }}
        run: |
          for selection in current previous; do
            directory=packages; inputs=records; revision=$GITHUB_SHA
            if [ "$selection" = previous ]; then
              [ -n "$PREVIOUS_REVISION" ] || continue
              directory=packages/previous; inputs=records/previous; revision=$PREVIOUS_REVISION
            fi
            version=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "$inputs/release.json")
            python3 scripts/release/artifacts.py assemble --version "$version" --revision "$revision" --channel candidate \
              --bundle "$directory/symphony-$version-macos.tar.gz" \
              --linux-bundle "$directory/symphony-$version-linux_x86_64.tar.gz" \
              --output "$directory/release.json" "$inputs"/codex-*.json "$inputs"/claude-*.json
            python3 scripts/release/artifacts.py validate "$directory/release.json"
            (cd "$directory" && sha256sum ./*.tar.gz release.json > SHA256SUMS)
          done
      - uses: actions/upload-artifact@v4
        with:
          name: packaged-candidate
          path: packages/**
          if-no-files-found: error
          retention-days: 30

  ubuntu-package-lifecycle:
    if: inputs.previous_revision != ''
    needs: packaged-candidate-metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: packaged-candidate
          path: packages
      - uses: actions/download-artifact@v4
        with:
          pattern: runner-candidate-*-x86_64
          path: runners
          merge-multiple: true
      - name: Real source-independent Ubuntu 26.04 manager lifecycle
        run: python3 scripts/release/package-lifecycle.py packages runners evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ubuntu26-package-lifecycle-${{ github.sha }}
          path: evidence/**
          if-no-files-found: error
          retention-days: 30

  lifecycle-diagnostic:
    if: github.event_name == 'workflow_dispatch' && !inputs.cache_probe && inputs.resume_native_run == '' && inputs.diagnostic_artifact_run != ''
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Validate explicit diagnostic identities
        env:
          ARTIFACT_RUN: ${{ inputs.diagnostic_artifact_run }}
          PACKAGE_SOURCE_REVISION: ${{ inputs.diagnostic_package_source_revision }}
        run: |
          [[ "$ARTIFACT_RUN" =~ ^[0-9]+$ ]]
          [[ "$PACKAGE_SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          echo 'DIAGNOSTIC ONLY: reused packages do not qualify this controller head for acceptance.'
      - uses: actions/download-artifact@v4
        with:
          name: packaged-candidate
          path: packages
          run-id: ${{ inputs.diagnostic_artifact_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: runner-candidate-*-x86_64
          path: runners
          merge-multiple: true
          run-id: ${{ inputs.diagnostic_artifact_run }}
          github-token: ${{ github.token }}
      - name: Diagnose actual Ubuntu lifecycle using selected real artifacts
        env:
          PACKAGE_SOURCE_REVISION: ${{ inputs.diagnostic_package_source_revision }}
          DIAGNOSTIC_ARTIFACT_RUN: ${{ inputs.diagnostic_artifact_run }}
        run: python3 scripts/release/package-lifecycle.py packages runners evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-only-ubuntu26-${{ github.sha }}-${{ inputs.diagnostic_artifact_run }}
          path: evidence/**
          if-no-files-found: error
          retention-days: 30

  recover-native-records:
    if: github.event_name == 'workflow_dispatch' && inputs.resume_native_run != ''
    name: recover-${{ matrix.provider }}-${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        provider: [codex, claude]
        architecture: [arm64, x86_64]
        include:
          - architecture: arm64
            runner: ubuntu-24.04-arm
          - architecture: x86_64
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Validate exclusive small-record recovery request
        env:
          CACHE_PROBE: ${{ inputs.cache_probe }}
          PREVIOUS: ${{ inputs.previous_revision }}
          DIAGNOSTIC: ${{ inputs.diagnostic_artifact_run }}
        run: |
          test "$CACHE_PROBE" != true
          test -z "$PREVIOUS"
          test -z "$DIAGNOSTIC"
      - name: Verify original native stages and replay only the retained immutable payload
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_RUN: ${{ inputs.resume_native_run }}
          PROVIDER: ${{ matrix.provider }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          python3 scripts/release/recover_native_record.py --run-id "$ORIGINAL_RUN" --attempt 1 \
            --provider "$PROVIDER" --architecture "$ARCHITECTURE" --output recovered
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runner-records-${{ matrix.provider }}-${{ matrix.architecture }}
          path: recovered/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Retain original-stage and replay identity/cleanup evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-record-recovery-${{ matrix.provider }}-${{ matrix.architecture }}
          path: recovered/*.txt
          if-no-files-found: warn
          retention-days: 30
  recovered-record-qualification:
    needs: recover-native-records
    if: github.event_name == 'workflow_dispatch' && inputs.resume_native_run != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: runner-records-*
          path: recovered
          merge-multiple: true
      - name: Reverify all original qualifications and independent successful recovery origins
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYCODE'
          import json, os, pathlib, sys
          sys.path.insert(0, 'scripts/release')
          import component_provenance as proof
          records = list(pathlib.Path('recovered').glob('*.json'))
          assert len(records) == 4
          results = {}
          for path in records:
              record = json.loads(path.read_text())
              key = record['provider'] + '-' + record['architecture']
              assert key not in results
              results[key] = proof.verify_origin(record, candidate_run=int(os.environ['GITHUB_RUN_ID']))
          assert set(results) == {provider+'-'+arch for provider in ('codex','claude') for arch in ('arm64','x86_64')}
          pathlib.Path('recovery-summary.json').write_text(json.dumps(results, indent=2, sort_keys=True)+'\n')
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-record-recovery-summary
          path: recovery-summary.json
          if-no-files-found: error
          retention-days: 30
