name: Runner release

on:
  workflow_call:
    inputs:
      previous_artifact_run:
        description: Exact qualified current-manager package run for download-only installed update tests
        type: string
        default: ''
      legacy_artifact_run:
        description: Exact old schema1 run retained across bridge and schema2 updates
        type: string
        default: ''
      manager_only_update:
        description: Require unchanged components and test actual manager-only update/rollback
        type: boolean
        default: false
      component_plan_artifact:
        description: Exact same-run source-bound component plan from the ordinary caller
        type: string
        default: ''
      baseline_run:
        description: Exact manually authorized record run; rejected outside workflow_dispatch
        type: string
        default: ''
      manifest_schema:
        description: Candidate metadata schema; independent components use schema 2
        type: string
        default: '2'
      compose_packages:
        description: Assemble native manager packages in this producer (ordinary integration composes separately)
        type: boolean
        default: true
      previous_revision:
        description: Optional full prior Linux-capable source for actual two-revision package lifecycle
        type: string
        default: ''
      retain_diagnostic:
        description: Preserve this caller-owned diagnostic and its package checks
        type: boolean
        default: false
      preflight_revision:
        description: Exact successful caller-owned portable preflight output; empty runs it here
        type: string
        default: ''
      prepare_release:
        description: Retain production-reference packages without publishing; main only
        type: boolean
        default: false
      publish:
        description: Legacy publication is refused; use the signed production publisher
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      previous_artifact_run:
        description: Exact qualified current-manager package run for download-only installed update tests
        type: string
        default: ''
      legacy_artifact_run:
        description: Exact old schema1 run retained across bridge and schema2 updates
        type: string
        default: ''
      manager_only_update:
        description: Require unchanged components and test actual manager-only update/rollback
        type: boolean
        default: false
      compose_packages:
        description: Assemble manager packages and full qualification (false runs components only)
        type: boolean
        default: true
      resume_native_run:
        description: Recover small records only from this original manual native run with the known downstream sealing failure
        type: string
        default: ''
      baseline_run:
        description: Exact authorized manual native candidate run (empty uses verified fork history)
        type: string
        default: ''
      manifest_schema:
        description: Candidate schema (1 bridge with same-source runners, 2 independent components)
        type: choice
        options: ['1', '2']
        default: '2'
      retain_diagnostic:
        description: Preserve this explicitly requested diagnostic run across new commits
        type: boolean
        default: false
      transfer_diagnostic_run:
        description: Existing same-repository runner candidate run ID for build-free transfer diagnosis (empty builds candidates)
        type: string
        required: false
      transfer_replay_run:
        description: Existing successful transfer benchmark run ID for replay/digest proof only (no export)
        type: string
        required: false
      transfer_timing_run:
        description: Existing legacy combined payload run ID for one read-only checksum/identity timing job
        type: string
        required: false
      transfer_timing_provider:
        type: choice
        options: [claude, codex]
        default: claude
      transfer_timing_architecture:
        type: choice
        options: [x86_64, arm64]
        default: x86_64
      cache_probe:
        description: Only run bounded native cold/warm/changed-input cache qualification
        type: boolean
        default: false
      cache_probe_restore:
        description: Skip cold build and import the previous completed probe run from a fresh builder
        type: boolean
        default: false
      previous_revision:
        description: Full prior Linux-capable candidate source SHA for real two-revision package lifecycle
        type: string
        required: false
      diagnostic_artifact_run:
        description: Diagnostic only; reuse this completed runner-release run instead of building
        type: string
        required: false
      diagnostic_package_source_revision:
        description: Exact package source SHA in the diagnostic artifact run
        type: string
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: runner-candidate-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.retain_diagnostic && github.run_id || 'latest' }}
  cancel-in-progress: ${{ !inputs.retain_diagnostic && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  component-plan:
    name: Validate component plan
    needs: qualification
    if: ${{ always() && !cancelled() && needs.qualification.result == 'success' && !inputs.cache_probe && inputs.resume_native_run == '' && !inputs.diagnostic_artifact_run && !inputs.transfer_diagnostic_run && !inputs.transfer_replay_run && !inputs.transfer_timing_run }}
    runs-on: ubuntu-24.04
    outputs:
      has_builds: ${{ steps.plan.outputs.has_builds }}
      build_matrix: ${{ steps.plan.outputs.build_matrix }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Retrieve artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.component_plan_artifact != ''
        with:
          name: ${{ inputs.component_plan_artifact }}
          path: selected-plan
      - name: Resolve the selected component plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_RUN: ${{ inputs.baseline_run }}
          PREVIOUS_REVISION: ${{ inputs.previous_revision }}
          MANIFEST_SCHEMA: ${{ inputs.manifest_schema }}
          SELECTED_PLAN_ARTIFACT: ${{ inputs.component_plan_artifact }}
          PREVIOUS_ARTIFACT_RUN: ${{ inputs.previous_artifact_run }}
          LEGACY_ARTIFACT_RUN: ${{ inputs.legacy_artifact_run }}
          MANAGER_ONLY_UPDATE: ${{ inputs.manager_only_update }}
          PREPARE_RELEASE: ${{ inputs.prepare_release }}
        run: |
          test -z "$PREVIOUS_REVISION" || { echo 'Independent prior package composition is not yet integrated; refusing incomplete candidate.' >&2; exit 1; }
          if [ -n "$PREVIOUS_ARTIFACT_RUN" ]; then [[ "$PREVIOUS_ARTIFACT_RUN" =~ ^[0-9]+$ ]] || exit 1; fi
          if [ -n "$LEGACY_ARTIFACT_RUN" ]; then
            [[ "$LEGACY_ARTIFACT_RUN" =~ ^[0-9]+$ ]] || exit 1
            test "$MANAGER_ONLY_UPDATE" = true
            test -n "$PREVIOUS_ARTIFACT_RUN"
            test "$LEGACY_ARTIFACT_RUN" != "$PREVIOUS_ARTIFACT_RUN"
          fi
          if [ "$MANAGER_ONLY_UPDATE" = true ]; then test -n "$PREVIOUS_ARTIFACT_RUN"; fi
          args=()
          if [ "${PREPARE_RELEASE:-false}" = true ]; then args+=(--production); fi
          if [ "$MANIFEST_SCHEMA" = 1 ]; then args+=(--compatible-originals); fi
          if [ -n "$BASELINE_RUN" ]; then args+=(--baseline-run "$BASELINE_RUN"); fi
          if [ -n "$SELECTED_PLAN_ARTIFACT" ]; then
            cp selected-plan/component-plan.json component-plan.json
          else
            python3 scripts/release/runner_reuse.py --root . --output component-plan.json "${args[@]}"
          fi
          python3 - <<'PYCODE'
          import json, os
          plan = json.load(open('component-plan.json'))
          assert plan.get('manager_source_revision') == os.environ['GITHUB_SHA'] and plan.get('planning_complete') is True
          assert type(plan['has_builds']) is bool
          if os.environ['MANAGER_ONLY_UPDATE'] == 'true':
              assert plan['has_builds'] is False, 'declared manager-only update would require runner builds'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('has_builds=' + str(plan['has_builds']).lower() + '\n')
              output.write('build_matrix=' + json.dumps(plan['build_matrix'], separators=(',', ':')) + '\n')
          PYCODE
      - name: Retain artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runner-component-plan
          path: component-plan.json
          retention-days: 30
  candidate:
    name: Build runner (${{ matrix.provider }}, ${{ matrix.architecture }})
    needs: [qualification, component-plan]
    if: ${{ always() && !cancelled() && needs.qualification.result == 'success' && needs.component-plan.result == 'success' && !inputs.cache_probe && inputs.resume_native_run == '' && !inputs.diagnostic_artifact_run && !inputs.transfer_diagnostic_run && !inputs.transfer_replay_run && !inputs.transfer_timing_run && needs.component-plan.outputs.has_builds == 'true' }}
    runs-on: ${{ matrix.native_runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.component-plan.outputs.build_matrix) }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read preflight-validated release version
        run: |
          version=$(sed -nE 's/^[[:space:]]*version: "([^"]+)",$/\1/p' elixir/mix.exs | head -n1)
          if [ "$GITHUB_REF_TYPE" = tag ]; then python3 scripts/release/manager_version.py --validate-tag "$GITHUB_REF_NAME"; fi
          printf 'VERSION=%s\n' "$version" >> "$GITHUB_ENV"
      - name: Capture committed effective build inputs
        env:
          PROVIDER: ${{ matrix.provider }}
          ARCHITECTURE: ${{ matrix.architecture }}
          EXPECTED_IDENTITY: ${{ matrix.input_identity }}
        run: |
          python3 scripts/release/runner_inputs.py --provider "$PROVIDER" --architecture "$ARCHITECTURE" --output "$RUNNER_TEMP/component-inputs.json"
          test "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["input_identity"])' "$RUNNER_TEMP/component-inputs.json")" = "$EXPECTED_IDENTITY"
      - name: Configure native cache for actual current and prior source builds
        uses: ./.github/actions/configure-runner-cache
      - name: Prepare shipped Codex AppArmor on disposable host
        id: codex-apparmor
        if: matrix.provider == 'codex'
        shell: bash
        run: bash scripts/ci/prepare-codex-apparmor.sh prepare 2>&1 | tee "$RUNNER_TEMP/codex-apparmor-prepare.log"
      - name: Build exact native runner candidates and verify digest pulls
        id: native-build
        env:
          PROVIDER: ${{ matrix.provider }}
          ARCHITECTURE: ${{ matrix.architecture }}
          SYMPHONY_CANDIDATE_CAPTURE_INPUTS: '1'
          SYMPHONY_CANDIDATE_EXPECTED_INPUT_IDENTITY: ${{ matrix.input_identity }}
          SYMPHONY_CANDIDATE_BUILD_COMMAND: ${{ github.workspace }}/scripts/release/build-runner-cached.sh
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIOUS_REVISION: ${{ inputs.previous_revision }}
        run: bash scripts/release/build-candidate-runners.sh "$PROVIDER" "$ARCHITECTURE" dist "$PREVIOUS_REVISION"
      - name: Retain runner payload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: payload
        with:
          name: runner-candidate-${{ matrix.provider }}-${{ matrix.architecture }}
          path: dist/**
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - name: Seal original native record against immutable uploaded payload
        env:
          GH_TOKEN: ${{ github.token }}
          PROVIDER: ${{ matrix.provider }}
          ARCHITECTURE: ${{ matrix.architecture }}
          ARTIFACT_ID: ${{ steps.payload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.payload.outputs.artifact-digest }}
        run: |
          python3 scripts/release/component_provenance.py seal --record "dist/$PROVIDER-$ARCHITECTURE.json" \
            --archive "dist/$PROVIDER-$ARCHITECTURE.docker.tar.gz" --archive-name "$PROVIDER-$ARCHITECTURE.docker.tar.gz" \
            --record-name "$PROVIDER-$ARCHITECTURE.json" --artifact-id "$ARTIFACT_ID" --artifact-digest "$ARTIFACT_DIGEST" \
            --job-name "Build runner ($PROVIDER, $ARCHITECTURE)"
      - name: Retain artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runner-records-${{ matrix.provider }}-${{ matrix.architecture }}
          path: dist/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Retain attempted native registry cleanup evidence
        if: ${{ always() && steps.native-build.outcome != 'skipped' && steps.native-build.outcome != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runner-native-cleanup-${{ matrix.provider }}-${{ matrix.architecture }}
          path: dist/*.registry-state.txt
          if-no-files-found: error
          retention-days: 30
      - name: Remove only CI-owned Codex AppArmor policy
        if: ${{ always() && steps.codex-apparmor.outcome != 'skipped' && steps.codex-apparmor.outcome != '' }}
        shell: bash
        run: bash scripts/ci/prepare-codex-apparmor.sh cleanup 2>&1 | tee "$RUNNER_TEMP/codex-apparmor-cleanup.log"
      - name: Retain disposable host policy diagnostics
        if: ${{ always() && steps.codex-apparmor.outcome != 'skipped' && steps.codex-apparmor.outcome != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codex-apparmor-candidate-${{ matrix.architecture }}
          path: ${{ runner.temp }}/codex-apparmor-*.log
          if-no-files-found: error
          retention-days: 30

  publication-preflight:
    name: Validate publication inputs
    if: ${{ always() && !cancelled() && needs.component-plan.result == 'success' && needs.candidate-metadata.result == 'success' && needs.package-inputs.result == 'success' && needs.qualification.result == 'success' && inputs.prepare_release && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    needs: [component-plan, candidate-metadata, package-inputs, candidate, qualification]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Retrieve artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runner-component-plan
          path: plan
      - name: Retrieve artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runner-candidate-metadata
          path: metadata
      - name: Require qualified component inputs before preparing final metadata
        env:
          HAS_BUILDS: ${{ needs.component-plan.outputs.has_builds }}
          RUNNERS: ${{ needs.candidate.result }}
        run: |
          case "$HAS_BUILDS" in true) test "$RUNNERS" = success ;; false) test "$RUNNERS" = skipped ;; *) exit 1 ;; esac
      - name: Verify every original and public reuse digest before any image push
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release/component_publication.py --plan plan/component-plan.json --metadata metadata/release.json --output prepared/publication-plan.json
      - name: Retain artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runner-distribution-plan
          path: prepared/publication-plan.json
          if-no-files-found: error

  candidate-metadata:
    name: Assemble candidate metadata
    needs: [component-plan, candidate]
    if: ${{ always() && !cancelled() && needs.component-plan.result == 'success' && !inputs.cache_probe && inputs.resume_native_run == '' && !inputs.diagnostic_artifact_run && !inputs.transfer_diagnostic_run && !inputs.transfer_replay_run && !inputs.transfer_timing_run && needs.component-plan.result == 'success' && (needs.candidate.result == 'success' || needs.candidate.result == 'skipped') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Retrieve artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runner-component-plan
          path: plan
      - name: Retrieve artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.component-plan.outputs.has_builds == 'true'
        with:
          pattern: runner-records-*
          path: candidate
          merge-multiple: true
      - name: Join exact planned native components without exporting reused payloads
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST_SCHEMA: ${{ inputs.manifest_schema || '1' }}
          BASELINE_RUN: ${{ inputs.baseline_run }}
        run: |
          args=()
          if [ -n "$BASELINE_RUN" ]; then args+=(--baseline-run "$BASELINE_RUN"); fi
          python3 scripts/release/component_join.py --plan plan/component-plan.json --records candidate --output dist \
            --schema "$MANIFEST_SCHEMA" "${args[@]}"
      - name: Retain artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runner-candidate-metadata
          path: dist/*

  packaged-release-platform:
    name: Build release package (${{ matrix.platform }})
    if: ${{ always() && !cancelled() && needs.publication-preflight.result == 'success' && needs.mac-runner-packaged-release-platform.result == 'success' }}
    needs: [publication-preflight, mac-runner-packaged-release-platform]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-14
          - platform: linux_x86_64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.platform == 'macos' && needs.mac-runner-packaged-release-platform.outputs.runner || matrix.runner }}
    steps:
      - name: Require actual native Mac prerequisites
        working-directory: ${{ runner.temp }}
        if: matrix.platform == 'macos'
        env:
          BACKUP_MAC_SELECTED: ${{ needs.mac-runner-packaged-release-platform.outputs.runner != 'macos-14' }}
        run: |
          test "$(uname -s)/$(uname -m)" = Darwin/arm64
          python3 -c 'import sys; assert sys.version_info >= (3, 11), "native Mac checks require Python 3.11+"'
          if [ "$BACKUP_MAC_SELECTED" = true ]; then
            case "$(sw_vers -productVersion)" in 14.*) ;; *) echo 'Backup guest must be macOS 14' >&2; exit 1 ;; esac
          fi
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Retrieve artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runner-distribution-plan
          path: prepared
      - name: Retrieve artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ format('native-host-helper-{0}-{1}', matrix.platform, github.sha) }}
          path: ${{ runner.temp }}/qualified-helper
      - name: Verify original native helper checksum before restoring executable mode
        run: |
          cd "$RUNNER_TEMP/qualified-helper"
          if command -v sha256sum >/dev/null 2>&1; then sha256sum --check symphony-host.sha256
          else shasum -a 256 --check symphony-host.sha256; fi
          chmod 755 symphony-host
      - name: Select immutable prepared production metadata
        run: |
          mkdir -p metadata
          python3 -c 'import json,pathlib; p=json.load(open("prepared/publication-plan.json")); pathlib.Path("metadata/release.json").write_text(json.dumps(p["manifest"],sort_keys=True)+"\n")'
      - name: Assemble native manager archive from tested stable image identities
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          test -f scripts/release/package.sh || { echo 'Packaged manager prerequisite is not integrated; refusing incomplete stable release.' >&2; exit 1; }
          python3 scripts/release/manager_version.py
          mkdir -p dist
          bash scripts/release/build-manager-package.sh "$PWD/metadata/release.json" "$PWD/dist" "$PLATFORM" "$PWD" "$GITHUB_SHA" "$RUNNER_TEMP/qualified-helper/symphony-host"
      - name: Retain artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packaged-release-platform-${{ matrix.platform }}
          path: dist/*.tar.gz
          if-no-files-found: error

  packaged-release:
    name: Assemble release packages
    if: ${{ always() && !cancelled() && needs.packaged-release-platform.result == 'success' }}
    needs: [packaged-release-platform, publication-preflight]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Retrieve artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runner-distribution-plan
          path: prepared
      - name: Retrieve artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packaged-release-platform-*
          path: dist
          merge-multiple: true
      - name: Select immutable prepared production metadata
        run: |
          mkdir -p metadata
          cp prepared/publication-plan.json dist/production-plan.json
          python3 -c 'import json,pathlib; p=json.load(open("prepared/publication-plan.json")); pathlib.Path("metadata/release.json").write_text(json.dumps(p["manifest"],sort_keys=True)+"\n")'
      - name: Bind matching Linux and legacy macOS manager archives
        run: |
          python3 scripts/release/manager_version.py
          python3 scripts/release/finalize-manager-packages.py metadata/release.json dist
          python3 scripts/release/artifacts.py validate dist/release.json
          python3 - <<'PYCODE'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts/release')
          from production_release import verify_packages
          verify_packages(Path('dist'), os.environ['GITHUB_SHA'])
          PYCODE
          (cd dist && sha256sum ./*.tar.gz ./release.json > SHA256SUMS)
      - name: Retain artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packaged-release
          path: dist/*
          if-no-files-found: error

  cache-probe:
    name: Measure runner cache (${{ matrix.provider }}, ${{ matrix.architecture }})
    needs: qualification
    if: ${{ always() && !cancelled() && needs.qualification.result == 'success' && inputs.cache_probe && inputs.resume_native_run == '' && github.event_name == 'workflow_dispatch' && !inputs.transfer_diagnostic_run && !inputs.transfer_replay_run && !inputs.transfer_timing_run }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        provider: [codex, claude]
        architecture: [arm64, x86_64]
        include:
          - architecture: arm64
            runner: ubuntu-24.04-arm
          - architecture: x86_64
            runner: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare shipped Codex AppArmor on disposable host
        id: codex-apparmor
        if: matrix.provider == 'codex'
        shell: bash
        run: bash scripts/ci/prepare-codex-apparmor.sh prepare 2>&1 | tee "$RUNNER_TEMP/codex-apparmor-prepare.log"
      - name: Prepare isolated registry and evidence
        id: registry
        run: |
          mkdir -p "$RUNNER_TEMP/runner-cache-measurements"
          id=$(docker run -d --label "com.symphony.cache-probe=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" -p 127.0.0.1:5000:5000 registry:3)
          printf 'id=%s\n' "$id" >> "$GITHUB_OUTPUT"
      - name: Actual cold native image
        if: ${{ !inputs.cache_probe_restore }}
        uses: ./.github/actions/build-runner
        with:
          target: ${{ matrix.provider }}
          tags: localhost:5000/symphony-${{ matrix.provider }}:cache-probe
          revision: ${{ github.sha }}
          no-cache: 'true'
          evidence-name: cold
      - name: Qualify cold image and measure transfer
        if: ${{ !inputs.cache_probe_restore }}
        env:
          PROVIDER: ${{ matrix.provider }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: python3 scripts/release/runner-cache-probe.py cold
      - name: Commit real packaging-only source change
        id: warm-source
        run: |
          printf 'Nonpublishing native cache probe at %s.\n' "$GITHUB_SHA" > docs/cache-probe-marker.txt
          git add docs/cache-probe-marker.txt
          git -c user.name=CacheProbe -c user.email=cache-probe@example.invalid commit -m 'Cache probe packaging-only revision'
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Actual warm image at a new source revision
        uses: ./.github/actions/build-runner
        with:
          target: ${{ matrix.provider }}
          tags: localhost:5000/symphony-${{ matrix.provider }}:cache-probe
          revision: ${{ steps.warm-source.outputs.revision }}
          evidence-name: warm
      - name: Qualify warm image and measure transfer
        env:
          PROVIDER: ${{ matrix.provider }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: python3 scripts/release/runner-cache-probe.py warm
      - name: Commit actual dependency-build recipe change
        id: changed-source
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          path = Path('runner/Dockerfile')
          source = path.read_text()
          before = '  && npm cache clean --force\nCOPY runner/browser/smoke.cjs'
          after = '  && npm cache clean --force && git --version\nCOPY runner/browser/smoke.cjs'
          assert source.count(before) == 1
          path.write_text(source.replace(before, after))
          PYCODE
          git add runner/Dockerfile
          git -c user.name=CacheProbe -c user.email=cache-probe@example.invalid commit -m 'Cache probe changes effective dependency build recipe'
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Actual invalidated dependency build
        uses: ./.github/actions/build-runner
        with:
          target: ${{ matrix.provider }}
          tags: localhost:5000/symphony-${{ matrix.provider }}:cache-probe
          revision: ${{ steps.changed-source.outputs.revision }}
          evidence-name: changed
          cache-variant: changed
          export-cache: 'false'
      - name: Qualify changed-input image and measure transfer
        env:
          PROVIDER: ${{ matrix.provider }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: python3 scripts/release/runner-cache-probe.py changed
      - name: Retain native build and transfer measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runner-cache-${{ matrix.provider }}-${{ matrix.architecture }}-${{ github.sha }}
          path: ${{ runner.temp }}/runner-cache-measurements/**
          if-no-files-found: error
          retention-days: 30
      - name: Remove test-owned registry
        if: ${{ always() && steps.registry.outputs.id != '' }}
        env:
          REGISTRY_ID: ${{ steps.registry.outputs.id }}
        run: |
          test "$(docker inspect --format '{{index .Config.Labels "com.symphony.cache-probe"}}' "$REGISTRY_ID")" = "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker rm -f "$REGISTRY_ID"
      - name: Remove only CI-owned Codex AppArmor policy
        if: ${{ always() && steps.codex-apparmor.outcome != 'skipped' && steps.codex-apparmor.outcome != '' }}
        shell: bash
        run: bash scripts/ci/prepare-codex-apparmor.sh cleanup 2>&1 | tee "$RUNNER_TEMP/codex-apparmor-cleanup.log"
      - name: Retain disposable host policy diagnostics
        if: ${{ always() && steps.codex-apparmor.outcome != 'skipped' && steps.codex-apparmor.outcome != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codex-apparmor-cache-${{ matrix.architecture }}
          path: ${{ runner.temp }}/codex-apparmor-*.log
          if-no-files-found: error
          retention-days: 30

  packaged-candidate:
    name: Build candidate package (${{ matrix.platform }})
    if: ${{ always() && !cancelled() && needs.candidate-metadata.result == 'success' && needs.package-inputs.result == 'success' && needs.qualification.outputs.final_only == 'false' && inputs.compose_packages && needs.mac-runner-packaged-candidate.result == 'success' }}
    needs: [qualification, candidate-metadata, package-inputs, mac-runner-packaged-candidate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-14
          - platform: linux_x86_64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.platform == 'macos' && needs.mac-runner-packaged-candidate.outputs.runner || matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Require actual native Mac prerequisites
        working-directory: ${{ runner.temp }}
        if: matrix.platform == 'macos'
        env:
          BACKUP_MAC_SELECTED: ${{ needs.mac-runner-packaged-candidate.outputs.runner != 'macos-14' }}
        run: |
          test "$(uname -s)/$(uname -m)" = Darwin/arm64
          python3 -c 'import sys; assert sys.version_info >= (3, 11), "native Mac checks require Python 3.11+"'
          if [ "$BACKUP_MAC_SELECTED" = true ]; then
            case "$(sw_vers -productVersion)" in 14.*) ;; *) echo 'Backup guest must be macOS 14' >&2; exit 1 ;; esac
          fi
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Retrieve artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runner-candidate-metadata
          path: metadata
      - name: Download current exact-source qualified helper
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ format('native-host-helper-{0}-{1}', matrix.platform, github.sha) }}
          path: ${{ runner.temp }}/qualified-helper
      - name: Verify qualified helper source, platform and checksum
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          cd "$RUNNER_TEMP/qualified-helper"
          if command -v sha256sum >/dev/null 2>&1; then sha256sum --check symphony-host.sha256
          else shasum -a 256 --check symphony-host.sha256; fi
          chmod +x symphony-host
          test "$(./symphony-host build-revision)" = "$GITHUB_SHA"
          test "$(./symphony-host host-platform)" = "$PLATFORM"
      - name: Download exact prior helper qualified alongside current images
        if: inputs.previous_revision != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: prior-native-host-helper-${{ matrix.platform }}-${{ inputs.previous_revision }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qualified-prior-helper
      - name: Verify prior helper checksum, source and native CPU
        if: inputs.previous_revision != ''
        env:
          PREVIOUS_REVISION: ${{ inputs.previous_revision }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          cd "$RUNNER_TEMP/qualified-prior-helper"
          if command -v sha256sum >/dev/null 2>&1; then sha256sum --check symphony-host.sha256
          else shasum -a 256 --check symphony-host.sha256; fi
          chmod +x symphony-host
          test "$(./symphony-host build-revision)" = "$PREVIOUS_REVISION"
          test "$(./symphony-host host-platform)" = "$PLATFORM"
          if [ "$PLATFORM" = macos ]; then test "$(lipo -archs symphony-host)" = arm64
          else readelf -h symphony-host | grep -Eq 'Machine:.*Advanced Micro Devices X86-64'; fi
      - name: Build source-bound native candidate archives
        env:
          PREVIOUS_REVISION: ${{ inputs.previous_revision }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          for selection in current previous; do
            source=$PWD; manifest="$PWD/metadata/release.json"; destination="$PWD/dist"; revision=$GITHUB_SHA
            if [ "$selection" = previous ]; then
              [ -n "$PREVIOUS_REVISION" ] || continue
              source="$RUNNER_TEMP/previous-package"
              bash scripts/release/prepare-candidate-source.sh "$PREVIOUS_REVISION" "$source"
              manifest="$PWD/metadata/previous/release.json"; destination="$PWD/dist/previous"; revision=$PREVIOUS_REVISION
            fi
            helper="$RUNNER_TEMP/qualified-helper/symphony-host"
            if [ "$selection" = previous ]; then helper="$RUNNER_TEMP/qualified-prior-helper/symphony-host"; fi
            bash scripts/release/build-manager-package.sh "$manifest" "$destination" "$PLATFORM" "$source" "$revision" ${helper:+"$helper"}
          done
      - name: Retain artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packaged-candidate-${{ matrix.platform }}
          path: dist/**
          if-no-files-found: error
          retention-days: 30

  packaged-candidate-metadata:
    name: Assemble candidate packages
    if: ${{ always() && !cancelled() && needs.packaged-candidate.result == 'success' }}
    needs: packaged-candidate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Retrieve artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packaged-candidate-*
          path: packages
          merge-multiple: true
      - name: Retrieve artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runner-candidate-metadata
          path: records
      - name: Bind both platform archives without changing the legacy macOS contract
        env:
          PREVIOUS_REVISION: ${{ inputs.previous_revision }}
        run: |
          for selection in current previous; do
            directory=packages; inputs=records; revision=$GITHUB_SHA
            if [ "$selection" = previous ]; then
              [ -n "$PREVIOUS_REVISION" ] || continue
              directory=packages/previous; inputs=records/previous; revision=$PREVIOUS_REVISION
            fi
            python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "$inputs/release.json"
            GITHUB_SHA="$revision" python3 scripts/release/finalize-manager-packages.py "$inputs/release.json" "$directory"
            python3 scripts/release/artifacts.py validate "$directory/release.json"
            (cd "$directory" && sha256sum ./*.tar.gz release.json > SHA256SUMS)
          done
      - name: Retain artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packaged-candidate
          path: packages/**
          if-no-files-found: error
          retention-days: 30

  ubuntu-package-lifecycle:
    name: Installed package lifecycle
    if: ${{ always() && !cancelled() && needs.packaged-candidate-metadata.result == 'success' && (inputs.previous_revision != '' || inputs.previous_artifact_run != '') }}
    needs: [component-plan, packaged-candidate-metadata]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Record exact lifecycle request before artifact retrieval
        env:
          PREVIOUS_ARTIFACT_RUN: ${{ inputs.previous_artifact_run }}
          LEGACY_ARTIFACT_RUN: ${{ inputs.legacy_artifact_run }}
          MANAGER_ONLY_UPDATE: ${{ inputs.manager_only_update }}
        run: |
          mkdir -p evidence
          python3 - <<'PYCODE'
          import json,os,pathlib
          pathlib.Path('evidence/lifecycle-request.json').write_text(json.dumps({key:os.environ[key] for key in
              ('GITHUB_SHA','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT','PREVIOUS_ARTIFACT_RUN','LEGACY_ARTIFACT_RUN','MANAGER_ONLY_UPDATE')},indent=2)+'\n')
          PYCODE
      - name: Retrieve artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packaged-candidate
          path: packages
      - name: Retrieve artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runner-component-plan
          path: plan
      - name: Retrieve exact selected original current payloads without export or upload
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_RUN: ${{ inputs.baseline_run }}
        run: |
          args=()
          if [ -n "$BASELINE_RUN" ]; then args+=(--baseline-run "$BASELINE_RUN"); fi
          python3 scripts/release/prepare-manager-inputs.py --plan plan/component-plan.json --built-metadata packages/release.json \
            --output "$RUNNER_TEMP/lifecycle-current-metadata" --payloads runners "${args[@]}"
      - name: Retrieve verified actual historical package and native payloads only as test subjects
        if: inputs.previous_artifact_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_ARTIFACT_RUN: ${{ inputs.previous_artifact_run }}
          LEGACY_ARTIFACT_RUN: ${{ inputs.legacy_artifact_run }}
        run: |
          args=()
          if [ -n "$LEGACY_ARTIFACT_RUN" ]; then args+=(--package-only); fi
          python3 scripts/release/previous-package-subject.py --run-id "$PREVIOUS_ARTIFACT_RUN" --packages packages --images runners --evidence evidence "${args[@]}"
          if [ -n "$LEGACY_ARTIFACT_RUN" ]; then
            python3 scripts/release/previous-package-subject.py --run-id "$LEGACY_ARTIFACT_RUN" --packages packages --images runners --evidence evidence --selection legacy
          fi
      - name: Prepare shipped Codex AppArmor on disposable host
        id: codex-apparmor
        shell: bash
        run: bash scripts/ci/prepare-codex-apparmor.sh prepare 2>&1 | tee "$RUNNER_TEMP/codex-apparmor-prepare.log"
      - name: Real source-independent Ubuntu 26.04 manager lifecycle
        env:
          MANAGER_ONLY_UPDATE: ${{ inputs.manager_only_update }}
        run: |
          args=()
          if [ "$MANAGER_ONLY_UPDATE" = true ]; then args+=(--manager-only-update); fi
          python3 scripts/release/package-lifecycle.py "${args[@]}" packages runners evidence
      - name: Retain small actual lifecycle, origin and cleanup receipts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ubuntu26-package-lifecycle-summary-${{ github.sha }}
          path: |
            evidence/result.json
            evidence/lifecycle-request.json
            evidence/*-package-subject.json
          if-no-files-found: warn
          retention-days: 30
      - name: Retain artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ubuntu26-package-lifecycle-${{ github.sha }}
          path: evidence/**
          if-no-files-found: error
          retention-days: 30
      - name: Remove only CI-owned Codex AppArmor policy
        if: ${{ always() && steps.codex-apparmor.outcome != 'skipped' && steps.codex-apparmor.outcome != '' }}
        shell: bash
        run: bash scripts/ci/prepare-codex-apparmor.sh cleanup 2>&1 | tee "$RUNNER_TEMP/codex-apparmor-cleanup.log"
      - name: Retain disposable host policy diagnostics
        if: ${{ always() && steps.codex-apparmor.outcome != 'skipped' && steps.codex-apparmor.outcome != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codex-apparmor-installed-lifecycle
          path: ${{ runner.temp }}/codex-apparmor-*.log
          if-no-files-found: error
          retention-days: 30

  lifecycle-diagnostic:
    name: Diagnose installed package lifecycle
    needs: qualification
    if: ${{ always() && !cancelled() && needs.qualification.result == 'success' && github.event_name == 'workflow_dispatch' && !inputs.cache_probe && inputs.resume_native_run == '' && inputs.diagnostic_artifact_run != '' && !inputs.transfer_diagnostic_run && !inputs.transfer_replay_run && !inputs.transfer_timing_run }}
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate explicit diagnostic identities
        env:
          ARTIFACT_RUN: ${{ inputs.diagnostic_artifact_run }}
          PACKAGE_SOURCE_REVISION: ${{ inputs.diagnostic_package_source_revision }}
        run: |
          [[ "$ARTIFACT_RUN" =~ ^[0-9]+$ ]]
          [[ "$PACKAGE_SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          echo 'DIAGNOSTIC ONLY: reused packages do not qualify this controller head for acceptance.'
      - name: Retrieve artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packaged-candidate
          path: packages
          run-id: ${{ inputs.diagnostic_artifact_run }}
          github-token: ${{ github.token }}
      - name: Retrieve artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: runner-candidate-*-x86_64
          path: runners
          merge-multiple: true
          run-id: ${{ inputs.diagnostic_artifact_run }}
          github-token: ${{ github.token }}
      - name: Prepare shipped Codex AppArmor on disposable host
        id: codex-apparmor
        shell: bash
        run: bash scripts/ci/prepare-codex-apparmor.sh prepare 2>&1 | tee "$RUNNER_TEMP/codex-apparmor-prepare.log"
      - name: Diagnose actual Ubuntu lifecycle using selected real artifacts
        env:
          PACKAGE_SOURCE_REVISION: ${{ inputs.diagnostic_package_source_revision }}
          DIAGNOSTIC_ARTIFACT_RUN: ${{ inputs.diagnostic_artifact_run }}
        run: python3 scripts/release/package-lifecycle.py packages runners evidence
      - name: Retain artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: diagnostic-only-ubuntu26-${{ github.sha }}-${{ inputs.diagnostic_artifact_run }}
          path: evidence/**
          if-no-files-found: error
          retention-days: 30
      - name: Remove only CI-owned Codex AppArmor policy
        if: ${{ always() && steps.codex-apparmor.outcome != 'skipped' && steps.codex-apparmor.outcome != '' }}
        shell: bash
        run: bash scripts/ci/prepare-codex-apparmor.sh cleanup 2>&1 | tee "$RUNNER_TEMP/codex-apparmor-cleanup.log"
      - name: Retain disposable host policy diagnostics
        if: ${{ always() && steps.codex-apparmor.outcome != 'skipped' && steps.codex-apparmor.outcome != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codex-apparmor-lifecycle-diagnostic
          path: ${{ runner.temp }}/codex-apparmor-*.log
          if-no-files-found: error
          retention-days: 30

  recover-native-records:
    name: Recover native records (${{ matrix.provider }}, ${{ matrix.architecture }})
    if: github.event_name == 'workflow_dispatch' && inputs.resume_native_run != ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        provider: [codex, claude]
        architecture: [arm64, x86_64]
        include:
          - architecture: arm64
            runner: ubuntu-24.04-arm
          - architecture: x86_64
            runner: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate exclusive small-record recovery request
        env:
          CACHE_PROBE: ${{ inputs.cache_probe }}
          PREVIOUS: ${{ inputs.previous_revision }}
          DIAGNOSTIC: ${{ inputs.diagnostic_artifact_run }}
        run: |
          test "$CACHE_PROBE" != true
          test -z "$PREVIOUS"
          test -z "$DIAGNOSTIC"
      - name: Verify original native stages and replay only the retained immutable payload
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_RUN: ${{ inputs.resume_native_run }}
          PROVIDER: ${{ matrix.provider }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          python3 scripts/release/recover_native_record.py --run-id "$ORIGINAL_RUN" --attempt 1 \
            --provider "$PROVIDER" --architecture "$ARCHITECTURE" --output recovered
      - name: Retain artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runner-records-${{ matrix.provider }}-${{ matrix.architecture }}
          path: recovered/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Retain original-stage and replay identity/cleanup evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-record-recovery-${{ matrix.provider }}-${{ matrix.architecture }}
          path: recovered/*.txt
          if-no-files-found: warn
          retention-days: 30
  recovered-record-qualification:
    name: Validate recovered native records
    needs: recover-native-records
    if: github.event_name == 'workflow_dispatch' && inputs.resume_native_run != ''
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Retrieve artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: runner-records-*
          path: recovered
          merge-multiple: true
      - name: Reverify all original qualifications and independent successful recovery origins
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYCODE'
          import json, os, pathlib, sys
          sys.path.insert(0, 'scripts/release')
          import component_provenance as proof
          records = list(pathlib.Path('recovered').glob('*.json'))
          assert len(records) == 4
          results = {}
          for path in records:
              record = json.loads(path.read_text())
              key = record['provider'] + '-' + record['architecture']
              assert key not in results
              results[key] = proof.verify_origin(record, candidate_run=int(os.environ['GITHUB_RUN_ID']))
          assert set(results) == {provider+'-'+arch for provider in ('codex','claude') for arch in ('arm64','x86_64')}
          pathlib.Path('recovery-summary.json').write_text(json.dumps(results, indent=2, sort_keys=True)+'\n')
          PYCODE
      - name: Retain artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-record-recovery-summary
          path: recovery-summary.json
          if-no-files-found: error
          retention-days: 30
  portable:
    name: Portable preflight
    if: inputs.preflight_revision == '' && inputs.resume_native_run == ''
    uses: ./.github/workflows/release-preflight.yml
  qualification:
    name: Validate preflight inputs
    outputs:
      final_only: ${{ steps.validated.outputs.final_only }}
    needs: portable
    if: ${{ always() && inputs.resume_native_run == '' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require exact successful local or caller-owned preflight
        id: validated
        env:
          LOCAL_RESULT: ${{ needs.portable.result }}
          LOCAL_REVISION: ${{ needs.portable.outputs.qualified_revision }}
          CALLER_REVISION: ${{ inputs.preflight_revision }}
          LEGACY_PUBLISH: ${{ inputs.publish }}
          PREVIOUS_REVISION: ${{ inputs.previous_revision }}
          CACHE_PROBE: ${{ inputs.cache_probe }}
          DIAGNOSTIC_ARTIFACT_RUN: ${{ inputs.diagnostic_artifact_run }}
          PREPARE_RELEASE: ${{ inputs.prepare_release }}
          COMPOSE_PACKAGES: ${{ inputs.compose_packages }}
          PREVIOUS_ARTIFACT_RUN: ${{ inputs.previous_artifact_run }}
          LEGACY_ARTIFACT_RUN: ${{ inputs.legacy_artifact_run }}
          MANAGER_ONLY_UPDATE: ${{ inputs.manager_only_update }}
        run: |
          test "${LEGACY_PUBLISH:-false}" != true || { echo 'Unsigned publication is disabled; use production-publish with signed inputs.' >&2; exit 1; }
          if [ "${CACHE_PROBE:-}" = true ] && [ -n "${DIAGNOSTIC_ARTIFACT_RUN:-}" ]; then exit 1; fi
          test -z "${PREVIOUS_REVISION:-}" || { echo 'Raw prior-source composition is unsupported by the component producer; select a verified historical artifact run.' >&2; exit 1; }
          if [ -n "$CALLER_REVISION" ]; then
            test "$LOCAL_RESULT" = skipped
            test "$CALLER_REVISION" = "$GITHUB_SHA"
          else
            test "$LOCAL_RESULT" = success
            test "$LOCAL_REVISION" = "$GITHUB_SHA"
          fi
          if [ -n "${PREVIOUS_ARTIFACT_RUN:-}" ]; then [[ "$PREVIOUS_ARTIFACT_RUN" =~ ^[0-9]+$ ]] || exit 1; fi
          if [ "${MANAGER_ONLY_UPDATE:-false}" = true ]; then test -n "${PREVIOUS_ARTIFACT_RUN:-}"; fi
          if [ -n "${LEGACY_ARTIFACT_RUN:-}" ]; then
            [[ "$LEGACY_ARTIFACT_RUN" =~ ^[0-9]+$ ]] || exit 1
            test "${MANAGER_ONLY_UPDATE:-false}" = true
            test -n "${PREVIOUS_ARTIFACT_RUN:-}"
            test "$LEGACY_ARTIFACT_RUN" != "$PREVIOUS_ARTIFACT_RUN"
          fi
          final_only=false
          if [ "${PREPARE_RELEASE:-false}" = true ]; then
            test "${COMPOSE_PACKAGES:-true}" != false
            if [ -z "${PREVIOUS_REVISION:-}" ] && [ -z "${PREVIOUS_ARTIFACT_RUN:-}" ] && [ -z "${LEGACY_ARTIFACT_RUN:-}" ] && [ "${MANAGER_ONLY_UPDATE:-false}" != true ]; then
              final_only=true
            fi
          fi
          printf 'final_only=%s\n' "$final_only" >> "$GITHUB_OUTPUT"
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.previous_revision != ''
        with:
          fetch-depth: 0
      - name: Refuse unavailable or incapable selected prior before native fanout
        if: inputs.previous_revision != ''
        env:
          PREVIOUS_REVISION: ${{ inputs.previous_revision }}
        run: python3 scripts/release/verify-prior-source.py "$PREVIOUS_REVISION"
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.previous_artifact_run != '' || inputs.legacy_artifact_run != ''
        with:
          fetch-depth: 0
      - name: Verify historical source and native/package availability before current fanout
        if: inputs.previous_artifact_run != '' || inputs.legacy_artifact_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_ARTIFACT_RUN: ${{ inputs.previous_artifact_run }}
          LEGACY_ARTIFACT_RUN: ${{ inputs.legacy_artifact_run }}
        run: |
          if [ -n "$PREVIOUS_ARTIFACT_RUN" ]; then
            python3 scripts/release/previous-package-subject.py --run-id "$PREVIOUS_ARTIFACT_RUN" --check-only early-subjects/previous.json
          fi
          if [ -n "$LEGACY_ARTIFACT_RUN" ]; then
            python3 scripts/release/previous-package-subject.py --run-id "$LEGACY_ARTIFACT_RUN" --check-only early-subjects/legacy.json
          fi
      - name: Retain artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.previous_artifact_run != '' || inputs.legacy_artifact_run != ''
        with:
          name: historical-package-subject-plan
          path: early-subjects/*.json
          if-no-files-found: error
          retention-days: 30
  package-inputs:
    name: Qualify package inputs
    if: ${{ always() && !cancelled() && needs.qualification.result == 'success' && inputs.compose_packages && inputs.resume_native_run == '' && !inputs.cache_probe && !inputs.diagnostic_artifact_run && !inputs.transfer_diagnostic_run && !inputs.transfer_replay_run && !inputs.transfer_timing_run }}
    needs: qualification
    uses: ./.github/workflows/package-checks.yml
    with:
      portable_revision: ${{ github.sha }}
      previous_revision: ${{ inputs.previous_revision }}
      retain_diagnostic: ${{ inputs.retain_diagnostic }}
  candidate-qualification:
    name: Candidate qualification
    needs: [component-plan, qualification, package-inputs, candidate, candidate-metadata, packaged-candidate-metadata, ubuntu-package-lifecycle, packaged-release]
    if: ${{ always() && inputs.compose_packages && inputs.resume_native_run == '' && !inputs.cache_probe && !inputs.diagnostic_artifact_run && !inputs.transfer_diagnostic_run && !inputs.transfer_replay_run && !inputs.transfer_timing_run }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require all requested candidate work without accepting omitted failures
        env:
          PREFLIGHT: ${{ needs.qualification.result }}
          PACKAGES: ${{ needs.package-inputs.result }}
          RUNNERS: ${{ needs.candidate.result }}
          HAS_BUILDS: ${{ needs.component-plan.outputs.has_builds }}
          METADATA: ${{ needs.candidate-metadata.result }}
          BUNDLES: ${{ needs.packaged-candidate-metadata.result }}
          FINAL_ONLY: ${{ needs.qualification.outputs.final_only }}
          FINAL_PACKAGES: ${{ needs.packaged-release.result }}
          LIFECYCLE: ${{ needs.ubuntu-package-lifecycle.result }}
          PREVIOUS_REVISION: ${{ inputs.previous_revision }}
          PREVIOUS_ARTIFACT_RUN: ${{ inputs.previous_artifact_run }}
        run: |
          test "$PREFLIGHT" = success
          test "$PACKAGES" = success
          case "$HAS_BUILDS" in true) test "$RUNNERS" = success ;; false) test "$RUNNERS" = skipped ;; *) exit 1 ;; esac
          test "$METADATA" = success
          case "$FINAL_ONLY" in
            true) test "$BUNDLES" = skipped; test "$FINAL_PACKAGES" = success ;;
            false) test "$BUNDLES" = success ;;
            *) exit 1 ;;
          esac
          if [ -n "$PREVIOUS_REVISION" ] || [ -n "${PREVIOUS_ARTIFACT_RUN:-}" ]; then test "$LIFECYCLE" = success
          else test "$LIFECYCLE" = skipped; fi
          echo 'Exact-head preflight, native fixtures, selected provider/platform components and requested final native archive cohort succeeded. Candidate archives are intentionally omitted only for production preparation without lifecycle consumers. Requested lifecycle must succeed.' >> "$GITHUB_STEP_SUMMARY"
  retained-transfer-timing:
    name: Measure retained transfer
    if: ${{ inputs.resume_native_run == '' && inputs.transfer_timing_run != '' && !inputs.cache_probe }}
    uses: ./.github/workflows/transfer-timing.yml
    with:
      source_run: ${{ inputs.transfer_timing_run }}
      provider: ${{ inputs.transfer_timing_provider }}
      architecture: ${{ inputs.transfer_timing_architecture }}

  transfer-benchmark:
    name: Measure runner transfer (${{ matrix.provider }}, ${{ matrix.architecture }})
    if: ${{ inputs.resume_native_run == '' && inputs.transfer_diagnostic_run != '' && !inputs.transfer_replay_run && !inputs.transfer_timing_run && !inputs.cache_probe }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        provider: [codex, claude]
        architecture: [arm64, x86_64]
        include:
          - architecture: arm64
            runner: ubuntu-24.04-arm
          - architecture: x86_64
            runner: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify original run and successful native producer
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.transfer_diagnostic_run }}
          PROVIDER: ${{ matrix.provider }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          python3 - <<'PYTHON'
          import json, os, re, subprocess
          from pathlib import Path
          run_id = os.environ['RUN_ID']
          assert re.fullmatch('[0-9]+', run_id), 'invalid immutable run ID'
          repo = os.environ['GITHUB_REPOSITORY']
          run = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/actions/runs/{run_id}']))
          assert run['head_repository']['full_name'] == repo, 'foreign source run'
          assert re.fullmatch('[0-9a-f]{40}', run['head_sha'])
          jobs = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/actions/runs/{run_id}/jobs?per_page=100']))['jobs']
          import sys
          sys.path.insert(0, 'scripts/release')
          from artifacts import runner_job_names
          names = runner_job_names(os.environ['PROVIDER'], os.environ['ARCHITECTURE'])
          producer = [job for job in jobs if job['name'] in names]
          assert len(producer) == 1 and producer[0]['conclusion'] == 'success', 'native producer did not pass'
          Path('provenance').mkdir()
          Path('provenance/original-run.txt').write_text(json.dumps(run, indent=2))
          Path('provenance/original-producer.txt').write_text(json.dumps(producer[0], indent=2))
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('ORIGINAL_SOURCE=' + run['head_sha'] + '\n')
          PYTHON
      - name: Download original qualified image payloads
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.transfer_diagnostic_run }}
          name: runner-candidate-${{ matrix.provider }}-${{ matrix.architecture }}
          path: original
      - name: Record native compression capability
        run: |
          uname -sm
          command -v pigz || command -v gzip
          df -h .
      - name: Compare actual baseline and improved export and load
        env:
          PROVIDER: ${{ matrix.provider }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          python3 scripts/release/benchmark-transfer.py benchmark --input original --output improved \
            --provider "$PROVIDER" --architecture "$ARCHITECTURE" --source-revision "$ORIGINAL_SOURCE"
          cp -R provenance improved/
      - name: Upload improved replay payloads without recompression
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: transfer-replay-${{ matrix.provider }}-${{ matrix.architecture }}
          path: improved/**
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - name: Retain small timing and original-provenance evidence on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: transfer-timing-${{ matrix.provider }}-${{ matrix.architecture }}
          path: |
            improved/**/*.txt
            provenance/*.txt
          if-no-files-found: warn


  transfer-replay:
    name: Replay runner transfer (${{ matrix.provider }}, ${{ matrix.architecture }})
    if: ${{ inputs.resume_native_run == '' && always() && !inputs.transfer_timing_run && !inputs.cache_probe && (inputs.transfer_replay_run != '' || needs.transfer-benchmark.result == 'success') }}
    needs: transfer-benchmark
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        provider: [codex, claude]
        architecture: [arm64, x86_64]
        include:
          - architecture: arm64
            runner: ubuntu-24.04-arm
          - architecture: x86_64
            runner: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify completed benchmark source before replay
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.transfer_replay_run || github.run_id }}
          BENCHMARK_RUN: ${{ inputs.transfer_diagnostic_run }}
          REPLAY_RUN: ${{ inputs.transfer_replay_run }}
          PROVIDER: ${{ matrix.provider }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          python3 - <<'PYTHON'
          import json, os, re, subprocess
          from pathlib import Path
          assert not (os.environ['BENCHMARK_RUN'] and os.environ['REPLAY_RUN']), 'choose benchmark or replay source'
          run_id = os.environ['SOURCE_RUN']
          assert re.fullmatch('[0-9]+', run_id), 'invalid immutable replay run ID'
          repo = os.environ['GITHUB_REPOSITORY']
          run = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/actions/runs/{run_id}']))
          assert run['head_repository']['full_name'] == repo, 'foreign benchmark source'
          jobs = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/actions/runs/{run_id}/jobs?per_page=100']))['jobs']
          name = 'transfer-benchmark (' + os.environ['PROVIDER'] + ', ' + os.environ['ARCHITECTURE'] + ')'
          producer = [job for job in jobs if job['name'] == name]
          assert len(producer) == 1 and producer[0]['conclusion'] == 'success', 'benchmark producer did not pass'
          Path('evidence').mkdir()
          Path('evidence/transport-source.txt').write_text(json.dumps({'run':run, 'producer':producer[0]}, indent=2))
          PYTHON
      - name: Download improved image payloads
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.transfer_replay_run || github.run_id }}
          name: transfer-replay-${{ matrix.provider }}-${{ matrix.architecture }}
          path: replay
      - name: Prepare shipped Codex AppArmor on disposable host
        id: codex-apparmor
        if: matrix.provider == 'codex'
        shell: bash
        run: bash scripts/ci/prepare-codex-apparmor.sh prepare 2>&1 | tee "$RUNNER_TEMP/codex-apparmor-prepare.log"
      - name: Real checksum, Docker load and model-free runtime proof
        env:
          PROVIDER: ${{ matrix.provider }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          source=$(python3 -c 'import json;print(json.load(open("replay/provenance/original-run.txt"))["head_sha"])')
          python3 scripts/release/benchmark-transfer.py replay --input replay --output evidence \
            --provider "$PROVIDER" --architecture "$ARCHITECTURE" --source-revision "$source"
      - name: Retain actual load, startup and transfer evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: transfer-runtime-${{ matrix.provider }}-${{ matrix.architecture }}
          path: evidence/**
          if-no-files-found: warn
      - name: Remove only CI-owned Codex AppArmor policy
        if: ${{ always() && steps.codex-apparmor.outcome != 'skipped' && steps.codex-apparmor.outcome != '' }}
        shell: bash
        run: bash scripts/ci/prepare-codex-apparmor.sh cleanup 2>&1 | tee "$RUNNER_TEMP/codex-apparmor-cleanup.log"
      - name: Retain disposable host policy diagnostics
        if: ${{ always() && steps.codex-apparmor.outcome != 'skipped' && steps.codex-apparmor.outcome != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codex-apparmor-transfer-replay-${{ matrix.architecture }}
          path: ${{ runner.temp }}/codex-apparmor-*.log
          if-no-files-found: error
          retention-days: 30

  mac-runner-packaged-candidate:
    name: Select backup Mac for packaged candidate
    needs: [qualification, candidate-metadata, package-inputs]
    if: ${{ always() && !cancelled() && needs.qualification.result == 'success' && needs.candidate-metadata.result == 'success' && needs.package-inputs.result == 'success' && needs.qualification.outputs.final_only == 'false' && inputs.compose_packages }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      runner: ${{ steps.hosted.outputs.runner || steps.selected.outputs.runner }}
    steps:
      - name: Retain hosted execution by default
        id: hosted
        if: vars.SYMPHONY_BACKUP_MAC_PERMIT == ''
        run: echo 'runner=macos-14' >> "$GITHUB_OUTPUT"
      - name: Check out source for an explicit routing permit
        if: vars.SYMPHONY_BACKUP_MAC_PERMIT != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the exact credential free Mac routing permit
        id: selected
        if: vars.SYMPHONY_BACKUP_MAC_PERMIT != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_MAC_PERMIT: ${{ vars.SYMPHONY_BACKUP_MAC_PERMIT }}
          SELECT_WORKFLOW_PATH: .github/workflows/runner-release.yml
          SELECT_JOB_KEY: packaged-candidate
        run: python3 scripts/ci/select_mac_runner.py >> "$GITHUB_OUTPUT"

  mac-runner-packaged-release-platform:
    name: Select backup Mac for packaged release platform
    needs: publication-preflight
    if: ${{ always() && !cancelled() && needs.publication-preflight.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      runner: ${{ steps.hosted.outputs.runner || steps.selected.outputs.runner }}
    steps:
      - name: Retain hosted execution by default
        id: hosted
        if: vars.SYMPHONY_BACKUP_MAC_PERMIT == ''
        run: echo 'runner=macos-14' >> "$GITHUB_OUTPUT"
      - name: Check out source for an explicit routing permit
        if: vars.SYMPHONY_BACKUP_MAC_PERMIT != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the exact credential free Mac routing permit
        id: selected
        if: vars.SYMPHONY_BACKUP_MAC_PERMIT != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_MAC_PERMIT: ${{ vars.SYMPHONY_BACKUP_MAC_PERMIT }}
          SELECT_WORKFLOW_PATH: .github/workflows/runner-release.yml
          SELECT_JOB_KEY: packaged-release-platform
        run: python3 scripts/ci/select_mac_runner.py >> "$GITHUB_OUTPUT"
