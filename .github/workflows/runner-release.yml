name: runner-release

on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      previous_revision:
        description: Full prior Linux-capable candidate source SHA for real two-revision package lifecycle
        type: string
        required: false

permissions:
  contents: read

jobs:
  candidate:
    name: runner-${{ matrix.provider }}-${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        provider: [codex, claude]
        include:
          - architecture: arm64
            runner: ubuntu-24.04-arm
          - architecture: x86_64
            runner: ubuntu-24.04
        architecture: [arm64, x86_64]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Verify release version and run metadata tests
        run: |
          python3 -m unittest discover -s scripts/release/tests -v
          version=$(sed -nE 's/^[[:space:]]*version: "([^"]+)",$/\1/p' elixir/mix.exs | head -n1)
          if [ "$GITHUB_REF_TYPE" = tag ]; then test "$GITHUB_REF_NAME" = "v$version"; fi
          printf 'VERSION=%s\n' "$version" >> "$GITHUB_ENV"
      - name: Build exact native runner candidates and verify digest pulls
        env:
          PROVIDER: ${{ matrix.provider }}
          ARCHITECTURE: ${{ matrix.architecture }}
          PREVIOUS_REVISION: ${{ inputs.previous_revision }}
        run: bash scripts/release/build-candidate-runners.sh "$PROVIDER" "$ARCHITECTURE" dist "$PREVIOUS_REVISION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runner-candidate-${{ matrix.provider }}-${{ matrix.architecture }}
          path: dist/**
          if-no-files-found: error
          retention-days: 30

  publish:
    if: inputs.publish && startsWith(github.ref, 'refs/tags/v') && vars.SYMPHONY_PRODUCTION_RELEASES == 'enabled'
    needs: candidate
    environment: production-release
    permissions:
      contents: read
      packages: write
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        provider: [codex, claude]
        architecture: [arm64, x86_64]
        include:
          - architecture: arm64
            runner: ubuntu-24.04-arm
          - architecture: x86_64
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: runner-candidate-${{ matrix.provider }}-${{ matrix.architecture }}
          path: candidate
      - name: Publish tested image and verify anonymous digest pull
        env:
          GH_TOKEN: ${{ github.token }}
          PROVIDER: ${{ matrix.provider }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          (cd candidate && sha256sum --check ./*.sha256)
          gzip -dc "candidate/$PROVIDER-$ARCHITECTURE.docker.tar.gz" | docker load
          repository="ghcr.io/${GITHUB_REPOSITORY,,}-$PROVIDER"
          image="$repository:$GITHUB_REF_NAME-$ARCHITECTURE"
          docker tag "localhost:5000/symphony-$PROVIDER:candidate" "$image"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$image"
          digest=$(docker image inspect --format '{{join .RepoDigests "\n"}}' "$image" | grep -F "$repository@sha256:")
          docker logout ghcr.io
          docker image rm "$image" "localhost:5000/symphony-$PROVIDER:candidate"
          if docker image inspect "$digest" >/dev/null 2>&1; then docker image rm "$digest"; fi
          if docker image inspect "$digest" >/dev/null 2>&1; then echo "Selected image is still cached; refusing false pull proof." >&2; exit 1; fi
          docker pull "$digest"
          bash scripts/release/runner-smoke.sh "$digest" "$PROVIDER" "$ARCHITECTURE" "$GITHUB_SHA"
          mkdir -p dist
          python3 scripts/release/record.py --image "$digest" --provider "$PROVIDER" \
            --architecture "$ARCHITECTURE" --revision "$GITHUB_SHA" --output "dist/$PROVIDER-$ARCHITECTURE.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runner-stable-${{ matrix.provider }}-${{ matrix.architecture }}
          path: dist/*.json
          if-no-files-found: error

  candidate-metadata:
    needs: candidate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: runner-candidate-*
          path: candidate
          merge-multiple: true
      - name: Assemble source-independent candidate metadata
        env:
          PREVIOUS_REVISION: ${{ inputs.previous_revision }}
        run: |
          version=$(sed -nE 's/^[[:space:]]*version: "([^"]+)",$/\1/p' elixir/mix.exs | head -n1)
          mkdir -p dist
          python3 scripts/release/artifacts.py assemble --version "$version" --revision "$GITHUB_SHA" \
            --channel candidate --platform-bundles --output dist/release.json candidate/*.json
          if [ -n "$PREVIOUS_REVISION" ]; then
            git fetch origin "$PREVIOUS_REVISION"
            old_version=$(git show "$PREVIOUS_REVISION:elixir/mix.exs" | sed -nE 's/^[[:space:]]*version: "([^"]+)",$/\1/p' | head -n1)
            mkdir -p dist/previous
            python3 scripts/release/artifacts.py assemble --version "$old_version" --revision "$PREVIOUS_REVISION" \
              --channel candidate --platform-bundles --output dist/previous/release.json candidate/previous/*.json
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runner-candidate-metadata
          path: dist/**

  packaged-release-platform:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-14
          - platform: linux_x86_64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    environment: production-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: runner-stable-*
          path: records
          merge-multiple: true
      - name: Assemble native manager archive from tested stable image identities
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          version=$(sed -nE 's/^[[:space:]]*version: "([^"]+)",$/\1/p' elixir/mix.exs | head -n1)
          mkdir -p dist
          python3 scripts/release/artifacts.py assemble --version "$version" --revision "$GITHUB_SHA" \
            --channel stable --platform-bundles --output "$RUNNER_TEMP/release.json" records/*.json
          if [ "$PLATFORM" = macos ]; then bash scripts/release/build-host-helper.sh "$RUNNER_TEMP/symphony-host"
          else bash scripts/release/build-linux-host-helper.sh "$RUNNER_TEMP/linux-helper"; cp "$RUNNER_TEMP/linux-helper/symphony-host" "$RUNNER_TEMP/symphony-host"; fi
          bash scripts/release/package.sh "$RUNNER_TEMP/release.json" dist "$RUNNER_TEMP/symphony-host"
      - uses: actions/upload-artifact@v4
        with:
          name: packaged-release-platform-${{ matrix.platform }}
          path: dist/*.tar.gz
          if-no-files-found: error

  packaged-release:
    needs: packaged-release-platform
    runs-on: ubuntu-24.04
    environment: production-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: runner-stable-*
          path: records
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: packaged-release-platform-*
          path: dist
          merge-multiple: true
      - name: Bind matching Linux and legacy macOS manager archives
        run: |
          version=$(sed -nE 's/^[[:space:]]*version: "([^"]+)",$/\1/p' elixir/mix.exs | head -n1)
          python3 scripts/release/artifacts.py assemble --version "$version" --revision "$GITHUB_SHA" \
            --channel stable --bundle "dist/symphony-$version-macos.tar.gz" \
            --linux-bundle "dist/symphony-$version-linux_x86_64.tar.gz" --output dist/release.json records/*.json
          python3 scripts/release/artifacts.py validate dist/release.json
          (cd dist && sha256sum ./*.tar.gz ./release.json > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: packaged-release
          path: dist/*
          if-no-files-found: error

  packaged-candidate:
    needs: candidate-metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-14
          - platform: linux_x86_64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: runner-candidate-metadata
          path: metadata
      - name: Build source-bound native candidate archives
        env:
          PREVIOUS_REVISION: ${{ inputs.previous_revision }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          for selection in current previous; do
            source=$PWD; manifest="$PWD/metadata/release.json"; destination="$PWD/dist"
            if [ "$selection" = previous ]; then
              [ -n "$PREVIOUS_REVISION" ] || continue
              git fetch origin "$PREVIOUS_REVISION"
              source="$RUNNER_TEMP/previous-package"
              git clone --no-hardlinks --no-checkout "$PWD" "$source"
              git -C "$source" checkout --detach "$PREVIOUS_REVISION"
              manifest="$PWD/metadata/previous/release.json"; destination="$PWD/dist/previous"
            fi
            mkdir -p "$destination"
            helper="$destination/symphony-host"
            if [ "$PLATFORM" = macos ]; then bash "$source/scripts/release/build-host-helper.sh" "$helper"
            else bash "$source/scripts/release/build-linux-host-helper.sh" "$destination"; fi
            bash "$source/scripts/release/package.sh" "$manifest" "$destination" "$helper"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: packaged-candidate-${{ matrix.platform }}
          path: dist/**
          if-no-files-found: error
          retention-days: 30

  packaged-candidate-metadata:
    needs: packaged-candidate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: packaged-candidate-*
          path: packages
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: runner-candidate-*
          path: records
          merge-multiple: true
      - name: Bind both platform archives without changing the legacy macOS contract
        env:
          PREVIOUS_REVISION: ${{ inputs.previous_revision }}
        run: |
          for selection in current previous; do
            directory=packages; inputs=records; revision=$GITHUB_SHA
            if [ "$selection" = previous ]; then
              [ -n "$PREVIOUS_REVISION" ] || continue
              directory=packages/previous; inputs=records/previous; revision=$PREVIOUS_REVISION
            fi
            version=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "$inputs/release.json")
            python3 scripts/release/artifacts.py assemble --version "$version" --revision "$revision" --channel candidate \
              --bundle "$directory/symphony-$version-macos.tar.gz" \
              --linux-bundle "$directory/symphony-$version-linux_x86_64.tar.gz" \
              --output "$directory/release.json" "$inputs"/codex-*.json "$inputs"/claude-*.json
            python3 scripts/release/artifacts.py validate "$directory/release.json"
            (cd "$directory" && sha256sum ./*.tar.gz release.json > SHA256SUMS)
          done
      - uses: actions/upload-artifact@v4
        with:
          name: packaged-candidate
          path: packages/**
          if-no-files-found: error
          retention-days: 30

  ubuntu-package-lifecycle:
    if: inputs.previous_revision != ''
    needs: packaged-candidate-metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: packaged-candidate
          path: packages
      - uses: actions/download-artifact@v4
        with:
          pattern: runner-candidate-*-x86_64
          path: runners
          merge-multiple: true
      - name: Real source-independent Ubuntu 26.04 manager lifecycle
        run: python3 scripts/release/package-lifecycle.py packages runners evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ubuntu26-package-lifecycle-${{ github.sha }}
          path: evidence/**
          if-no-files-found: error
          retention-days: 30
