name: runner-release

on:
  workflow_call:
    inputs:
      retain_diagnostic:
        description: Preserve this caller-owned diagnostic and its package checks
        type: boolean
        default: false
      preflight_revision:
        description: Exact successful caller-owned portable preflight output; empty runs it here
        type: string
        default: ''
      publish:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      retain_diagnostic:
        description: Preserve this explicitly requested diagnostic run across new commits
        type: boolean
        default: false
      cache_probe:
        description: Only run bounded native cold/warm/changed-input cache qualification
        type: boolean
        default: false
      cache_probe_restore:
        description: Skip cold build and import the previous completed probe run from a fresh builder
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: runner-candidate-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.retain_diagnostic && github.run_id || 'latest' }}
  cancel-in-progress: ${{ !inputs.retain_diagnostic && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  portable:
    if: inputs.preflight_revision == ''
    uses: ./.github/workflows/release-preflight.yml
  package-inputs:
    if: ${{ !inputs.cache_probe }}
    needs: qualification
    uses: ./.github/workflows/package-checks.yml
    with:
      portable_revision: ${{ github.sha }}
      retain_diagnostic: ${{ inputs.retain_diagnostic }}
  qualification:
    needs: portable
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require exact successful local or caller-owned preflight
        env:
          LOCAL_RESULT: ${{ needs.portable.result }}
          LOCAL_REVISION: ${{ needs.portable.outputs.qualified_revision }}
          CALLER_REVISION: ${{ inputs.preflight_revision }}
        run: |
          if [ -n "$CALLER_REVISION" ]; then
            test "$LOCAL_RESULT" = skipped
            test "$CALLER_REVISION" = "$GITHUB_SHA"
          else
            test "$LOCAL_RESULT" = success
            test "$LOCAL_REVISION" = "$GITHUB_SHA"
          fi
  candidate:
    needs: qualification
    if: ${{ !inputs.cache_probe }}
    name: runner-${{ matrix.provider }}-${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        provider: [codex, claude]
        include:
          - architecture: arm64
            runner: ubuntu-24.04-arm
          - architecture: x86_64
            runner: ubuntu-24.04
        architecture: [arm64, x86_64]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Read preflight-validated release version
        run: |
          version=$(sed -nE 's/^[[:space:]]*version: "([^"]+)",$/\1/p' elixir/mix.exs | head -n1)
          if [ "$GITHUB_REF_TYPE" = tag ]; then test "$GITHUB_REF_NAME" = "v$version"; fi
          printf 'VERSION=%s\n' "$version" >> "$GITHUB_ENV"
      - name: Build exact native candidate with reusable dependency layers
        uses: ./.github/actions/build-runner
        with:
          target: ${{ matrix.provider }}
          tags: localhost:5000/symphony-${{ matrix.provider }}:candidate
          version: ${{ env.VERSION }}
          revision: ${{ github.sha }}
      - name: Build exact runner and test a digest pull from an isolated registry
        env:
          PROVIDER: ${{ matrix.provider }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          mkdir -p dist
          docker run -d --name candidate-registry -p 127.0.0.1:5000:5000 registry:3
          image="localhost:5000/symphony-$PROVIDER:candidate"
          docker push "$image"
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$image")
          docker image rm "$image"
          if docker image inspect "$digest" >/dev/null 2>&1; then docker image rm "$digest"; fi
          if docker image inspect "$digest" >/dev/null 2>&1; then echo "Selected image is still cached; refusing false pull proof." >&2; exit 1; fi
          docker pull "$digest"
          bash scripts/release/runner-smoke.sh "$digest" "$PROVIDER" "$ARCHITECTURE" "$GITHUB_SHA"
          python3 scripts/release/record.py --image "$digest" --provider "$PROVIDER" \
            --architecture "$ARCHITECTURE" --revision "$GITHUB_SHA" --output "dist/$PROVIDER-$ARCHITECTURE.json"
          docker tag "$digest" "$image"
          docker save "$image" | gzip > "dist/$PROVIDER-$ARCHITECTURE.docker.tar.gz"
          (cd dist && sha256sum ./*.docker.tar.gz > "$PROVIDER-$ARCHITECTURE.sha256")
          docker logs candidate-registry > "dist/$PROVIDER-$ARCHITECTURE.registry.log" 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runner-candidate-${{ matrix.provider }}-${{ matrix.architecture }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    if: inputs.publish && startsWith(github.ref, 'refs/tags/v') && vars.SYMPHONY_PRODUCTION_RELEASES == 'enabled'
    needs: [candidate, package-inputs]
    environment: production-release
    permissions:
      contents: read
      packages: write
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        provider: [codex, claude]
        architecture: [arm64, x86_64]
        include:
          - architecture: arm64
            runner: ubuntu-24.04-arm
          - architecture: x86_64
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: runner-candidate-${{ matrix.provider }}-${{ matrix.architecture }}
          path: candidate
      - name: Publish tested image and verify anonymous digest pull
        env:
          GH_TOKEN: ${{ github.token }}
          PROVIDER: ${{ matrix.provider }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          (cd candidate && sha256sum --check ./*.sha256)
          gzip -dc "candidate/$PROVIDER-$ARCHITECTURE.docker.tar.gz" | docker load
          repository="ghcr.io/${GITHUB_REPOSITORY,,}-$PROVIDER"
          image="$repository:$GITHUB_REF_NAME-$ARCHITECTURE"
          docker tag "localhost:5000/symphony-$PROVIDER:candidate" "$image"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$image"
          digest=$(docker image inspect --format '{{join .RepoDigests "\n"}}' "$image" | grep -F "$repository@sha256:")
          docker logout ghcr.io
          docker image rm "$image" "localhost:5000/symphony-$PROVIDER:candidate"
          if docker image inspect "$digest" >/dev/null 2>&1; then docker image rm "$digest"; fi
          if docker image inspect "$digest" >/dev/null 2>&1; then echo "Selected image is still cached; refusing false pull proof." >&2; exit 1; fi
          docker pull "$digest"
          bash scripts/release/runner-smoke.sh "$digest" "$PROVIDER" "$ARCHITECTURE" "$GITHUB_SHA"
          mkdir -p dist
          python3 scripts/release/record.py --image "$digest" --provider "$PROVIDER" \
            --architecture "$ARCHITECTURE" --revision "$GITHUB_SHA" --output "dist/$PROVIDER-$ARCHITECTURE.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runner-stable-${{ matrix.provider }}-${{ matrix.architecture }}
          path: dist/*.json
          if-no-files-found: error

  candidate-metadata:
    needs: candidate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: runner-candidate-*
          path: candidate
          merge-multiple: true
      - name: Assemble source-independent candidate metadata
        run: |
          version=$(sed -nE 's/^[[:space:]]*version: "([^"]+)",$/\1/p' elixir/mix.exs | head -n1)
          mkdir -p dist
          python3 scripts/release/artifacts.py assemble --version "$version" --revision "$GITHUB_SHA" \
            --channel candidate --output dist/release.json candidate/*.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runner-candidate-metadata
          path: dist/release.json

  packaged-release:
    needs: publish
    runs-on: macos-14
    environment: production-release
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: runner-stable-*
          path: records
          merge-multiple: true
      - name: Assemble matching manager bundle and checksums
        run: |
          test -f scripts/release/package.sh || { echo 'Packaged manager prerequisite is not integrated; refusing incomplete stable release.' >&2; exit 1; }
          version=$(sed -nE 's/^[[:space:]]*version: "([^"]+)",$/\1/p' elixir/mix.exs | head -n1)
          mkdir -p dist
          python3 scripts/release/artifacts.py assemble --version "$version" --revision "$GITHUB_SHA" \
            --channel stable --output "$RUNNER_TEMP/release.json" records/*.json
          bash scripts/release/package.sh "$RUNNER_TEMP/release.json" dist
          python3 scripts/release/artifacts.py assemble --version "$version" --revision "$GITHUB_SHA" \
            --channel stable --bundle "dist/symphony-$version-macos.tar.gz" --output dist/release.json records/*.json
          python3 scripts/release/artifacts.py validate dist/release.json
          (cd dist && shasum -a 256 ./*.tar.gz ./release.json > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packaged-release
          path: dist/*
          if-no-files-found: error

  candidate-qualification:
    needs: [qualification, package-inputs, candidate, candidate-metadata]
    if: ${{ always() && !inputs.cache_probe }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require all requested candidate work without accepting omitted failures
        env:
          PREFLIGHT: ${{ needs.qualification.result }}
          PACKAGES: ${{ needs.package-inputs.result }}
          RUNNERS: ${{ needs.candidate.result }}
          METADATA: ${{ needs.candidate-metadata.result }}
        run: |
          test "$PREFLIGHT" = success
          test "$PACKAGES" = success
          test "$RUNNERS" = success
          test "$METADATA" = success
          echo 'Exact-head preflight, native fixtures, all four provider/platform images and final metadata succeeded.' >> "$GITHUB_STEP_SUMMARY"
  cache-probe:
    needs: qualification
    if: inputs.cache_probe && github.event_name == 'workflow_dispatch'
    name: cache-probe-${{ matrix.provider }}-${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        provider: [codex, claude]
        architecture: [arm64, x86_64]
        include:
          - architecture: arm64
            runner: ubuntu-24.04-arm
          - architecture: x86_64
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Prepare isolated registry and evidence
        id: registry
        run: |
          mkdir -p "$RUNNER_TEMP/runner-cache-measurements"
          id=$(docker run -d --label "com.symphony.cache-probe=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" -p 127.0.0.1:5000:5000 registry:3)
          printf 'id=%s\n' "$id" >> "$GITHUB_OUTPUT"
      - name: Actual cold native image
        if: ${{ !inputs.cache_probe_restore }}
        uses: ./.github/actions/build-runner
        with:
          target: ${{ matrix.provider }}
          tags: localhost:5000/symphony-${{ matrix.provider }}:cache-probe
          revision: ${{ github.sha }}
          no-cache: 'true'
          evidence-name: cold
      - name: Qualify cold image and measure transfer
        if: ${{ !inputs.cache_probe_restore }}
        env:
          PROVIDER: ${{ matrix.provider }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: python3 scripts/release/runner-cache-probe.py cold
      - name: Commit real packaging-only source change
        id: warm-source
        run: |
          printf 'Nonpublishing native cache probe at %s.\n' "$GITHUB_SHA" > docs/cache-probe-marker.txt
          git add docs/cache-probe-marker.txt
          git -c user.name=CacheProbe -c user.email=cache-probe@example.invalid commit -m 'Cache probe packaging-only revision'
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Actual warm image at a new source revision
        uses: ./.github/actions/build-runner
        with:
          target: ${{ matrix.provider }}
          tags: localhost:5000/symphony-${{ matrix.provider }}:cache-probe
          revision: ${{ steps.warm-source.outputs.revision }}
          evidence-name: warm
      - name: Qualify warm image and measure transfer
        env:
          PROVIDER: ${{ matrix.provider }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: python3 scripts/release/runner-cache-probe.py warm
      - name: Commit actual dependency-build recipe change
        id: changed-source
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          path = Path('runner/Dockerfile')
          source = path.read_text()
          before = '  && npm cache clean --force\nCOPY runner/browser/smoke.cjs'
          after = '  && npm cache clean --force && git --version\nCOPY runner/browser/smoke.cjs'
          assert source.count(before) == 1
          path.write_text(source.replace(before, after))
          PYCODE
          git add runner/Dockerfile
          git -c user.name=CacheProbe -c user.email=cache-probe@example.invalid commit -m 'Cache probe changes effective dependency build recipe'
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Actual invalidated dependency build
        uses: ./.github/actions/build-runner
        with:
          target: ${{ matrix.provider }}
          tags: localhost:5000/symphony-${{ matrix.provider }}:cache-probe
          revision: ${{ steps.changed-source.outputs.revision }}
          evidence-name: changed
          cache-variant: changed
          export-cache: 'false'
      - name: Qualify changed-input image and measure transfer
        env:
          PROVIDER: ${{ matrix.provider }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: python3 scripts/release/runner-cache-probe.py changed
      - name: Retain native build and transfer measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runner-cache-${{ matrix.provider }}-${{ matrix.architecture }}-${{ github.sha }}
          path: ${{ runner.temp }}/runner-cache-measurements/**
          if-no-files-found: error
          retention-days: 30
      - name: Remove test-owned registry
        if: ${{ always() && steps.registry.outputs.id != '' }}
        env:
          REGISTRY_ID: ${{ steps.registry.outputs.id }}
        run: |
          test "$(docker inspect --format '{{index .Config.Labels "com.symphony.cache-probe"}}' "$REGISTRY_ID")" = "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker rm -f "$REGISTRY_ID"
