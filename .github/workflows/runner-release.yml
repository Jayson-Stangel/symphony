name: runner-release

on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      transfer_diagnostic_run:
        description: Existing same-repository runner candidate run ID for build-free transfer diagnosis (empty builds candidates)
        type: string
        required: false

      transfer_replay_run:
        description: Existing successful transfer benchmark run ID for replay/digest proof only (no export)
        type: string
        required: false

      transfer_timing_run:
        description: Existing legacy combined payload run ID for one read-only checksum/identity timing job
        type: string
        required: false
      transfer_timing_provider:
        type: choice
        options: [claude, codex]
        default: claude
      transfer_timing_architecture:
        type: choice
        options: [x86_64, arm64]
        default: x86_64

      cache_probe:
        description: Only run bounded native cold/warm/changed-input cache qualification
        type: boolean
        default: false
      cache_probe_restore:
        description: Skip cold build and import the previous completed probe run from a fresh builder
        type: boolean
        default: false
      previous_revision:
        description: Full prior Linux-capable candidate source SHA for real two-revision package lifecycle
        type: string
        required: false
      diagnostic_artifact_run:
        description: Diagnostic only; reuse this completed runner-release run instead of building
        type: string
        required: false
      diagnostic_package_source_revision:
        description: Exact package source SHA in the diagnostic artifact run
        type: string
        required: false

permissions:
  contents: read
  actions: read

jobs:
  candidate:
    if: ${{ !inputs.cache_probe && !inputs.diagnostic_artifact_run && !inputs.transfer_diagnostic_run && !inputs.transfer_replay_run && !inputs.transfer_timing_run }}
    name: runner-${{ matrix.provider }}-${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        provider: [codex, claude]
        include:
          - architecture: arm64
            runner: ubuntu-24.04-arm
          - architecture: x86_64
            runner: ubuntu-24.04
        architecture: [arm64, x86_64]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Verify release version and run metadata tests
        run: |
          python3 -m unittest discover -s scripts/release/tests -v
          version=$(sed -nE 's/^[[:space:]]*version: "([^"]+)",$/\1/p' elixir/mix.exs | head -n1)
          if [ "$GITHUB_REF_TYPE" = tag ]; then test "$GITHUB_REF_NAME" = "v$version"; fi
          printf 'VERSION=%s\n' "$version" >> "$GITHUB_ENV"
      - name: Configure native cache for actual current and prior source builds
        uses: ./.github/actions/configure-runner-cache
      - name: Build exact native runner candidates and verify digest pulls
        id: native-build
        env:
          PROVIDER: ${{ matrix.provider }}
          ARCHITECTURE: ${{ matrix.architecture }}
          SYMPHONY_CANDIDATE_BUILD_COMMAND: ${{ github.workspace }}/scripts/release/build-runner-cached.sh
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIOUS_REVISION: ${{ inputs.previous_revision }}
        run: bash scripts/release/build-candidate-runners.sh "$PROVIDER" "$ARCHITECTURE" dist "$PREVIOUS_REVISION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runner-candidate-${{ matrix.provider }}-${{ matrix.architecture }}
          path: dist/**
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - name: Retain small source-bound records for metadata consumers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runner-records-${{ matrix.provider }}-${{ matrix.architecture }}
          path: |
            dist/*.json
            dist/previous/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Retain attempted native registry cleanup evidence
        if: ${{ always() && steps.native-build.outcome != 'skipped' && steps.native-build.outcome != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runner-native-cleanup-${{ matrix.provider }}-${{ matrix.architecture }}
          path: dist/*.registry-state.txt
          if-no-files-found: error
          retention-days: 30

  publish:
    if: inputs.publish && startsWith(github.ref, 'refs/tags/v') && vars.SYMPHONY_PRODUCTION_RELEASES == 'enabled'
    needs: candidate
    environment: production-release
    permissions:
      contents: read
      packages: write
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        provider: [codex, claude]
        architecture: [arm64, x86_64]
        include:
          - architecture: arm64
            runner: ubuntu-24.04-arm
          - architecture: x86_64
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: runner-candidate-${{ matrix.provider }}-${{ matrix.architecture }}
          path: candidate
      - name: Publish tested image and verify anonymous digest pull
        env:
          GH_TOKEN: ${{ github.token }}
          PROVIDER: ${{ matrix.provider }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          (cd candidate && sha256sum --check ./*.sha256)
          gzip -dc "candidate/$PROVIDER-$ARCHITECTURE.docker.tar.gz" | docker load
          repository="ghcr.io/${GITHUB_REPOSITORY,,}-$PROVIDER"
          image="$repository:$GITHUB_REF_NAME-$ARCHITECTURE"
          docker tag "localhost:5000/symphony-$PROVIDER:candidate" "$image"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$image"
          digest=$(docker image inspect --format '{{join .RepoDigests "\n"}}' "$image" | grep -F "$repository@sha256:")
          docker logout ghcr.io
          docker image rm "$image" "localhost:5000/symphony-$PROVIDER:candidate"
          if docker image inspect "$digest" >/dev/null 2>&1; then docker image rm "$digest"; fi
          if docker image inspect "$digest" >/dev/null 2>&1; then echo "Selected image is still cached; refusing false pull proof." >&2; exit 1; fi
          docker pull "$digest"
          bash scripts/release/runner-smoke.sh "$digest" "$PROVIDER" "$ARCHITECTURE" "$GITHUB_SHA"
          mkdir -p dist
          python3 scripts/release/record.py --image "$digest" --provider "$PROVIDER" \
            --architecture "$ARCHITECTURE" --revision "$GITHUB_SHA" --output "dist/$PROVIDER-$ARCHITECTURE.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runner-stable-${{ matrix.provider }}-${{ matrix.architecture }}
          path: dist/*.json
          if-no-files-found: error

  candidate-metadata:
    needs: candidate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: runner-records-*
          path: candidate
          merge-multiple: true
      - name: Assemble source-independent candidate metadata
        env:
          PREVIOUS_REVISION: ${{ inputs.previous_revision }}
        run: |
          version=$(sed -nE 's/^[[:space:]]*version: "([^"]+)",$/\1/p' elixir/mix.exs | head -n1)
          mkdir -p dist
          python3 scripts/release/artifacts.py assemble --version "$version" --revision "$GITHUB_SHA" \
            --channel candidate --platform-bundles --output dist/release.json candidate/*.json
          if [ -n "$PREVIOUS_REVISION" ]; then
            git fetch origin "$PREVIOUS_REVISION"
            old_version=$(git show "$PREVIOUS_REVISION:elixir/mix.exs" | sed -nE 's/^[[:space:]]*version: "([^"]+)",$/\1/p' | head -n1)
            mkdir -p dist/previous
            python3 scripts/release/artifacts.py assemble --version "$old_version" --revision "$PREVIOUS_REVISION" \
              --channel candidate --platform-bundles --output dist/previous/release.json candidate/previous/*.json
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runner-candidate-metadata
          path: dist/**

  packaged-release-platform:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-14
          - platform: linux_x86_64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    environment: production-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: runner-stable-*
          path: records
          merge-multiple: true
      - name: Assemble native manager archive from tested stable image identities
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          version=$(sed -nE 's/^[[:space:]]*version: "([^"]+)",$/\1/p' elixir/mix.exs | head -n1)
          mkdir -p dist
          python3 scripts/release/artifacts.py assemble --version "$version" --revision "$GITHUB_SHA" \
            --channel stable --platform-bundles --output "$RUNNER_TEMP/release.json" records/*.json
          if [ "$PLATFORM" = macos ]; then bash scripts/release/build-host-helper.sh "$RUNNER_TEMP/symphony-host"
          else bash scripts/release/build-linux-host-helper.sh "$RUNNER_TEMP/linux-helper"; cp "$RUNNER_TEMP/linux-helper/symphony-host" "$RUNNER_TEMP/symphony-host"; fi
          bash scripts/release/package.sh "$RUNNER_TEMP/release.json" dist "$RUNNER_TEMP/symphony-host"
      - uses: actions/upload-artifact@v4
        with:
          name: packaged-release-platform-${{ matrix.platform }}
          path: dist/*.tar.gz
          if-no-files-found: error

  packaged-release:
    needs: packaged-release-platform
    runs-on: ubuntu-24.04
    environment: production-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: runner-stable-*
          path: records
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: packaged-release-platform-*
          path: dist
          merge-multiple: true
      - name: Bind matching Linux and legacy macOS manager archives
        run: |
          version=$(sed -nE 's/^[[:space:]]*version: "([^"]+)",$/\1/p' elixir/mix.exs | head -n1)
          python3 scripts/release/artifacts.py assemble --version "$version" --revision "$GITHUB_SHA" \
            --channel stable --bundle "dist/symphony-$version-macos.tar.gz" \
            --linux-bundle "dist/symphony-$version-linux_x86_64.tar.gz" --output dist/release.json records/*.json
          python3 scripts/release/artifacts.py validate dist/release.json
          (cd dist && sha256sum ./*.tar.gz ./release.json > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: packaged-release
          path: dist/*
          if-no-files-found: error

  cache-probe:
    if: inputs.cache_probe && github.event_name == 'workflow_dispatch' && !inputs.transfer_diagnostic_run && !inputs.transfer_replay_run && !inputs.transfer_timing_run
    name: cache-probe-${{ matrix.provider }}-${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        provider: [codex, claude]
        architecture: [arm64, x86_64]
        include:
          - architecture: arm64
            runner: ubuntu-24.04-arm
          - architecture: x86_64
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Prepare isolated registry and evidence
        id: registry
        run: |
          mkdir -p "$RUNNER_TEMP/runner-cache-measurements"
          id=$(docker run -d --label "com.symphony.cache-probe=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" -p 127.0.0.1:5000:5000 registry:3)
          printf 'id=%s\n' "$id" >> "$GITHUB_OUTPUT"
      - name: Actual cold native image
        if: ${{ !inputs.cache_probe_restore }}
        uses: ./.github/actions/build-runner
        with:
          target: ${{ matrix.provider }}
          tags: localhost:5000/symphony-${{ matrix.provider }}:cache-probe
          revision: ${{ github.sha }}
          no-cache: 'true'
          evidence-name: cold
      - name: Qualify cold image and measure transfer
        if: ${{ !inputs.cache_probe_restore }}
        env:
          PROVIDER: ${{ matrix.provider }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: python3 scripts/release/runner-cache-probe.py cold
      - name: Commit real packaging-only source change
        id: warm-source
        run: |
          printf 'Nonpublishing native cache probe at %s.\n' "$GITHUB_SHA" > docs/cache-probe-marker.txt
          git add docs/cache-probe-marker.txt
          git -c user.name=CacheProbe -c user.email=cache-probe@example.invalid commit -m 'Cache probe packaging-only revision'
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Actual warm image at a new source revision
        uses: ./.github/actions/build-runner
        with:
          target: ${{ matrix.provider }}
          tags: localhost:5000/symphony-${{ matrix.provider }}:cache-probe
          revision: ${{ steps.warm-source.outputs.revision }}
          evidence-name: warm
      - name: Qualify warm image and measure transfer
        env:
          PROVIDER: ${{ matrix.provider }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: python3 scripts/release/runner-cache-probe.py warm
      - name: Commit actual dependency-build recipe change
        id: changed-source
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          path = Path('runner/Dockerfile')
          source = path.read_text()
          before = '  && npm cache clean --force\nCOPY runner/browser/smoke.cjs'
          after = '  && npm cache clean --force && git --version\nCOPY runner/browser/smoke.cjs'
          assert source.count(before) == 1
          path.write_text(source.replace(before, after))
          PYCODE
          git add runner/Dockerfile
          git -c user.name=CacheProbe -c user.email=cache-probe@example.invalid commit -m 'Cache probe changes effective dependency build recipe'
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Actual invalidated dependency build
        uses: ./.github/actions/build-runner
        with:
          target: ${{ matrix.provider }}
          tags: localhost:5000/symphony-${{ matrix.provider }}:cache-probe
          revision: ${{ steps.changed-source.outputs.revision }}
          evidence-name: changed
          cache-variant: changed
          export-cache: 'false'
      - name: Qualify changed-input image and measure transfer
        env:
          PROVIDER: ${{ matrix.provider }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: python3 scripts/release/runner-cache-probe.py changed
      - name: Retain native build and transfer measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runner-cache-${{ matrix.provider }}-${{ matrix.architecture }}-${{ github.sha }}
          path: ${{ runner.temp }}/runner-cache-measurements/**
          if-no-files-found: error
          retention-days: 30
      - name: Remove test-owned registry
        if: ${{ always() && steps.registry.outputs.id != '' }}
        env:
          REGISTRY_ID: ${{ steps.registry.outputs.id }}
        run: |
          test "$(docker inspect --format '{{index .Config.Labels "com.symphony.cache-probe"}}' "$REGISTRY_ID")" = "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker rm -f "$REGISTRY_ID"
  packaged-candidate:
    needs: candidate-metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-14
          - platform: linux_x86_64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: runner-candidate-metadata
          path: metadata
      - name: Build source-bound native candidate archives
        env:
          PREVIOUS_REVISION: ${{ inputs.previous_revision }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          for selection in current previous; do
            source=$PWD; manifest="$PWD/metadata/release.json"; destination="$PWD/dist"; revision=$GITHUB_SHA
            if [ "$selection" = previous ]; then
              [ -n "$PREVIOUS_REVISION" ] || continue
              source="$RUNNER_TEMP/previous-package"
              bash scripts/release/prepare-candidate-source.sh "$PREVIOUS_REVISION" "$source"
              manifest="$PWD/metadata/previous/release.json"; destination="$PWD/dist/previous"; revision=$PREVIOUS_REVISION
            fi
            mkdir -p "$destination"
            helper="$destination/symphony-host"
            if [ "$PLATFORM" = macos ]; then bash "$source/scripts/release/build-host-helper.sh" "$helper" --native
            else bash scripts/release/build-linux-host-helper.sh "$destination" "$source" "$revision"; fi
            bash "$source/scripts/release/package.sh" "$manifest" "$destination" "$helper"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: packaged-candidate-${{ matrix.platform }}
          path: dist/**
          if-no-files-found: error
          retention-days: 30

  packaged-candidate-metadata:
    needs: packaged-candidate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: packaged-candidate-*
          path: packages
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: runner-records-*
          path: records
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: runner-candidate-metadata
          path: records
      - name: Bind both platform archives without changing the legacy macOS contract
        env:
          PREVIOUS_REVISION: ${{ inputs.previous_revision }}
        run: |
          for selection in current previous; do
            directory=packages; inputs=records; revision=$GITHUB_SHA
            if [ "$selection" = previous ]; then
              [ -n "$PREVIOUS_REVISION" ] || continue
              directory=packages/previous; inputs=records/previous; revision=$PREVIOUS_REVISION
            fi
            version=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "$inputs/release.json")
            python3 scripts/release/artifacts.py assemble --version "$version" --revision "$revision" --channel candidate \
              --bundle "$directory/symphony-$version-macos.tar.gz" \
              --linux-bundle "$directory/symphony-$version-linux_x86_64.tar.gz" \
              --output "$directory/release.json" "$inputs"/codex-*.json "$inputs"/claude-*.json
            python3 scripts/release/artifacts.py validate "$directory/release.json"
            (cd "$directory" && sha256sum ./*.tar.gz release.json > SHA256SUMS)
          done
      - uses: actions/upload-artifact@v4
        with:
          name: packaged-candidate
          path: packages/**
          if-no-files-found: error
          retention-days: 30

  ubuntu-package-lifecycle:
    if: inputs.previous_revision != ''
    needs: packaged-candidate-metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: packaged-candidate
          path: packages
      - uses: actions/download-artifact@v4
        with:
          pattern: runner-candidate-*-x86_64
          path: runners
          merge-multiple: true
      - name: Real source-independent Ubuntu 26.04 manager lifecycle
        run: python3 scripts/release/package-lifecycle.py packages runners evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ubuntu26-package-lifecycle-${{ github.sha }}
          path: evidence/**
          if-no-files-found: error
          retention-days: 30

  lifecycle-diagnostic:
    if: github.event_name == 'workflow_dispatch' && !inputs.cache_probe && inputs.diagnostic_artifact_run != '' && !inputs.transfer_diagnostic_run && !inputs.transfer_replay_run && !inputs.transfer_timing_run
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Validate explicit diagnostic identities
        env:
          ARTIFACT_RUN: ${{ inputs.diagnostic_artifact_run }}
          PACKAGE_SOURCE_REVISION: ${{ inputs.diagnostic_package_source_revision }}
        run: |
          [[ "$ARTIFACT_RUN" =~ ^[0-9]+$ ]]
          [[ "$PACKAGE_SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          echo 'DIAGNOSTIC ONLY: reused packages do not qualify this controller head for acceptance.'
      - uses: actions/download-artifact@v4
        with:
          name: packaged-candidate
          path: packages
          run-id: ${{ inputs.diagnostic_artifact_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: runner-candidate-*-x86_64
          path: runners
          merge-multiple: true
          run-id: ${{ inputs.diagnostic_artifact_run }}
          github-token: ${{ github.token }}
      - name: Diagnose actual Ubuntu lifecycle using selected real artifacts
        env:
          PACKAGE_SOURCE_REVISION: ${{ inputs.diagnostic_package_source_revision }}
          DIAGNOSTIC_ARTIFACT_RUN: ${{ inputs.diagnostic_artifact_run }}
        run: python3 scripts/release/package-lifecycle.py packages runners evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-only-ubuntu26-${{ github.sha }}-${{ inputs.diagnostic_artifact_run }}
          path: evidence/**
          if-no-files-found: error
          retention-days: 30

  retained-transfer-timing:
    if: ${{ inputs.transfer_timing_run != '' && !inputs.cache_probe }}
    uses: ./.github/workflows/transfer-timing.yml
    with:
      source_run: ${{ inputs.transfer_timing_run }}
      provider: ${{ inputs.transfer_timing_provider }}
      architecture: ${{ inputs.transfer_timing_architecture }}

  transfer-benchmark:
    if: ${{ inputs.transfer_diagnostic_run != '' && !inputs.transfer_replay_run && !inputs.transfer_timing_run && !inputs.cache_probe }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        provider: [codex, claude]
        architecture: [arm64, x86_64]
        include:
          - architecture: arm64
            runner: ubuntu-24.04-arm
          - architecture: x86_64
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Verify original run and successful native producer
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.transfer_diagnostic_run }}
          PROVIDER: ${{ matrix.provider }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          python3 - <<'PYTHON'
          import json, os, re, subprocess
          from pathlib import Path
          run_id = os.environ['RUN_ID']
          assert re.fullmatch('[0-9]+', run_id), 'invalid immutable run ID'
          repo = os.environ['GITHUB_REPOSITORY']
          run = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/actions/runs/{run_id}']))
          assert run['head_repository']['full_name'] == repo, 'foreign source run'
          assert re.fullmatch('[0-9a-f]{40}', run['head_sha'])
          jobs = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/actions/runs/{run_id}/jobs?per_page=100']))['jobs']
          name = 'runner-' + os.environ['PROVIDER'] + '-' + os.environ['ARCHITECTURE']
          producer = [job for job in jobs if job['name'] == name]
          assert len(producer) == 1 and producer[0]['conclusion'] == 'success', 'native producer did not pass'
          Path('provenance').mkdir()
          Path('provenance/original-run.txt').write_text(json.dumps(run, indent=2))
          Path('provenance/original-producer.txt').write_text(json.dumps(producer[0], indent=2))
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('ORIGINAL_SOURCE=' + run['head_sha'] + '\n')
          PYTHON
      - name: Download original qualified image payloads
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.transfer_diagnostic_run }}
          name: runner-candidate-${{ matrix.provider }}-${{ matrix.architecture }}
          path: original
      - name: Record native compression capability
        run: |
          uname -sm
          command -v pigz || command -v gzip
          df -h .
      - name: Compare actual baseline and improved export and load
        env:
          PROVIDER: ${{ matrix.provider }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          python3 scripts/release/benchmark-transfer.py benchmark --input original --output improved \
            --provider "$PROVIDER" --architecture "$ARCHITECTURE" --source-revision "$ORIGINAL_SOURCE"
          cp -R provenance improved/
      - name: Upload improved replay payloads without recompression
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: transfer-replay-${{ matrix.provider }}-${{ matrix.architecture }}
          path: improved/**
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - name: Retain small timing and original-provenance evidence on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: transfer-timing-${{ matrix.provider }}-${{ matrix.architecture }}
          path: |
            improved/**/*.txt
            provenance/*.txt
          if-no-files-found: warn

  transfer-replay:
    if: ${{ always() && !inputs.transfer_timing_run && !inputs.cache_probe && (inputs.transfer_replay_run != '' || needs.transfer-benchmark.result == 'success') }}
    needs: transfer-benchmark
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        provider: [codex, claude]
        architecture: [arm64, x86_64]
        include:
          - architecture: arm64
            runner: ubuntu-24.04-arm
          - architecture: x86_64
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Verify completed benchmark source before replay
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.transfer_replay_run || github.run_id }}
          BENCHMARK_RUN: ${{ inputs.transfer_diagnostic_run }}
          REPLAY_RUN: ${{ inputs.transfer_replay_run }}
          PROVIDER: ${{ matrix.provider }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          python3 - <<'PYTHON'
          import json, os, re, subprocess
          from pathlib import Path
          assert not (os.environ['BENCHMARK_RUN'] and os.environ['REPLAY_RUN']), 'choose benchmark or replay source'
          run_id = os.environ['SOURCE_RUN']
          assert re.fullmatch('[0-9]+', run_id), 'invalid immutable replay run ID'
          repo = os.environ['GITHUB_REPOSITORY']
          run = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/actions/runs/{run_id}']))
          assert run['head_repository']['full_name'] == repo, 'foreign benchmark source'
          jobs = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/actions/runs/{run_id}/jobs?per_page=100']))['jobs']
          name = 'transfer-benchmark (' + os.environ['PROVIDER'] + ', ' + os.environ['ARCHITECTURE'] + ')'
          producer = [job for job in jobs if job['name'] == name]
          assert len(producer) == 1 and producer[0]['conclusion'] == 'success', 'benchmark producer did not pass'
          Path('evidence').mkdir()
          Path('evidence/transport-source.txt').write_text(json.dumps({'run':run, 'producer':producer[0]}, indent=2))
          PYTHON
      - name: Download improved image payloads
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.transfer_replay_run || github.run_id }}
          name: transfer-replay-${{ matrix.provider }}-${{ matrix.architecture }}
          path: replay
      - name: Real checksum, Docker load and model-free runtime proof
        env:
          PROVIDER: ${{ matrix.provider }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          source=$(python3 -c 'import json;print(json.load(open("replay/provenance/original-run.txt"))["head_sha"])')
          python3 scripts/release/benchmark-transfer.py replay --input replay --output evidence \
            --provider "$PROVIDER" --architecture "$ARCHITECTURE" --source-revision "$source"
      - name: Retain actual load, startup and transfer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: transfer-runtime-${{ matrix.provider }}-${{ matrix.architecture }}
          path: evidence/**
          if-no-files-found: warn
